<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HOLD ON — a motion reel (live preview)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#05030f;color:#fff6e8;font:600 15px/1.3 system-ui,sans-serif}
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  #gl{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block;background:#0a0620}
  #play{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 34px;font:800 22px system-ui;letter-spacing:.06em;
        color:#0a0620;background:#ffe14a;border:0;border-radius:999px;cursor:pointer;box-shadow:0 10px 0 #ff2e93,0 24px 60px #ff2e9366}
  #play:hover{transform:translate(-50%,-52%)}
  #hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:#ffffff18}
  #bar{height:100%;width:0;background:linear-gradient(90deg,#ff2e93,#ffe14a,#1fe4ff)}
  #tip{position:fixed;left:16px;bottom:14px;opacity:.55;font-size:12px}
  body.export #play,body.export #hud,body.export #tip{display:none}
  body.export #gl{width:1920px;height:1080px}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>
<button id="play">▶ HOLD ON</button>
<div id="hud"><div id="bar"></div></div>
<div id="tip">live preview renders without motion blur · the final video is rendered offline with render.py</div>
<audio id="aud" src="../../soundtrack.wav" preload="auto"></audio>

<script src="score.js"></script>
<script src="lib.js"></script>
<script src="font.js"></script>
<script src="post.js"></script>
<script src="g3d.js"></script>
<script src="chars.js"></script>
<script src="timeline.js"></script>
<script src="scenes_a.js"></script>
<script src="scene_climb.js"></script>
<script src="scenes_b.js"></script>
<script src="scenes_c.js"></script>
<script src="scenes_d.js"></script>
<script src="main.js"></script>
<script>
  if (/export/.test(location.search)) document.body.classList.add('export');
  else startPreview();
  window.READY = true;
</script>
</body>
</html>
