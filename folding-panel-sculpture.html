<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Folding Panel Sculpture — Kinetic Study</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #07090c;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    color: #ece7d9;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 20;
    background: rgba(10, 13, 17, 0.92);
    border: 1px solid rgba(236, 231, 217, 0.14);
    border-left: 3px solid #d99a3d;
    border-radius: 8px;
    padding: 12px 16px; min-width: 230px;
    font-size: 12px; line-height: 1.8;
    pointer-events: none; user-select: none;
  }
  #hud h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; }
  #hud .sub { color: rgba(236, 231, 217, 0.55); font-size: 11px; }
  #hud .row { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; }
  #hud .row span:last-child { color: #fff; }
  #dock {
    position: fixed; bottom: 14px; left: 16px; z-index: 20;
    background: rgba(10, 13, 17, 0.92);
    border: 1px solid rgba(236, 231, 217, 0.14);
    border-radius: 8px; padding: 10px 14px;
    font-size: 12px; display: flex; align-items: center; gap: 10px;
    user-select: none;
  }
  #dock input[type="range"] { width: 130px; accent-color: #d99a3d; cursor: pointer; }
  #dock .val { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: #d99a3d; }
  #hint {
    position: fixed; bottom: 14px; right: 16px; z-index: 20;
    font-size: 11.5px; color: rgba(236, 231, 217, 0.5);
    pointer-events: none; user-select: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>FOLDING PANELS</h1>
  <div class="sub">kinetic sculpture &middot; hinge hierarchy</div>
  <div class="row"><span>panels</span><span id="stat-panels">—</span></div>
  <div class="row"><span>depth</span><span id="stat-depth">—</span></div>
  <div class="row"><span>fps</span><span id="stat-fps">—</span></div>
</div>
<div id="dock">
  <label for="speed">Motion</label>
  <input type="range" id="speed" min="0" max="2.5" step="0.05" value="1" />
  <span class="val" id="speedVal">1.00&times;</span>
</div>
<div id="hint">drag to orbit &middot; scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================== config ============================== */
const CONFIG = {
  anchors: 9,        // limbs radiating from the core hub
  maxDepth: 4,       // panels deep per limb (root = depth 0)
  branches: 2,       // children spawned at each panel tip
  panelLength: 2.3,  // root panel length; shrinks per depth
  panelWidth: 1.6,
  decay: 0.7,        // per-depth size multiplier
  foldSpeed: 0.65,   // base folding frequency
  spinY: 0.12,       // master turntable speeds (rad/s)
  spinZ: 0.05,
  coreRadius: 1.15,
};

/* ====================== renderer / scene / camera =================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090c);
scene.fog = new THREE.FogExp2(0x07090c, 0.016);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
camera.position.set(8.5, 4.5, 12.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 80;

// Image-based lighting so the chrome has something to reflect
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ============================== materials =========================== */
// Polished dark chrome with a frosted-glass feel: low roughness, high
// metalness, full clearcoat, transmission enabled where supported.
function makeChrome(tintHex) {
  const m = new THREE.MeshPhysicalMaterial({
    color: tintHex,
    roughness: 0.2,
    metalness: 0.9,
    clearcoat: 1.0,
    clearcoatRoughness: 0.12,
    envMapIntensity: 1.25,
    side: THREE.DoubleSide,
  });
  if ('transmission' in m) {
    m.transmission = 0.55;
    m.thickness = 0.45;
    m.ior = 1.45;
  }
  return m;
}
const panelMats = [makeChrome(0x1a2027), makeChrome(0x232a30), makeChrome(0x141a20), makeChrome(0x2a2620)];
const hubMat = makeChrome(0x10141a);
hubMat.flatShading = true;

/* ============================== lighting ============================ */
// Key: strong warm-white directional with sharp shadows
const key = new THREE.DirectionalLight(0xfff0dd, 3.0);
key.position.set(9, 14, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -12; key.shadow.camera.right = 12;
key.shadow.camera.top = 12; key.shadow.camera.bottom = -12;
key.shadow.camera.near = 2; key.shadow.camera.far = 45;
key.shadow.bias = -0.0004;
scene.add(key);

// Inner color: saturated point light buried in the hub, animated later
const heart = new THREE.PointLight(0xff4a2a, 60, 20, 2);
scene.add(heart);

// Fill + ambient: cool, quiet, just lifting the shadows
const fill = new THREE.DirectionalLight(0x5a7396, 0.55);
fill.position.set(-8, 2, -7);
scene.add(fill);
scene.add(new THREE.AmbientLight(0x2a3340, 0.65));

// Distant dust for depth
{
  const n = 500, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 60 + Math.random() * 160;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    p[i * 3] = r * Math.sin(ph) * Math.cos(th);
    p[i * 3 + 1] = r * Math.cos(ph);
    p[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0x8a93a5, size: 0.55, sizeAttenuation: true,
    transparent: true, opacity: 0.6, fog: false,
  })));
}

/* ==================== geometry: hinge-edge triangles =============== */
// Triangle in the local XY plane. The hinge edge lies ON the local X axis
// (base corners at y=0), so the parent pivot's origin IS the hinge line and
// rotating the pivot folds the panel around its edge, never its center.
const geoCache = new Map();
function triGeometry(len, wid) {
  const k = `${len.toFixed(3)}|${wid.toFixed(3)}`;
  if (!geoCache.has(k)) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      -wid / 2, 0, 0,
       wid / 2, 0, 0,
       0, len, 0,
    ]), 3));
    g.setIndex([0, 2, 1]);
    g.computeVertexNormals();
    geoCache.set(k, g);
  }
  return geoCache.get(k);
}
const sizeAt = (base, depth) => base * Math.pow(CONFIG.decay, depth);

/* ==================== hierarchy: hub, limbs, hinge pivots ========== */
const master = new THREE.Group();   // everything kinetic lives under this
scene.add(master);
heart.position.set(0, 0, 0);
master.add(heart);

const hub = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.coreRadius, 1), hubMat);
hub.castShadow = hub.receiveShadow = true;
master.add(hub);

// Glowing ember visible through the gaps between panels
const ember = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.5, 1),
  new THREE.MeshStandardMaterial({ color: 0x1a0d08, emissive: 0xff5a26, emissiveIntensity: 2.2, roughness: 0.5 })
);
master.add(ember);

// Evenly spaced anchor directions (Fibonacci sphere)
function anchorDir(i, total) {
  const golden = Math.PI * (3 - Math.sqrt(5));
  const y = 1 - ((i + 0.5) / total) * 2;
  const r = Math.sqrt(Math.max(0, 1 - y * y));
  const th = golden * i;
  return new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r);
}

// Every folding joint registers a driver: {node, phase, depth, baseX, baseY, amp}
const drivers = [];
let matCursor = 0;
const _up = new THREE.Vector3(0, 1, 0);

// Recursive hinge chain. Each pivot's origin is the hinge edge; the panel
// mesh extends +Y; children mount at the panel tip (0, len, 0).
function growLimb(depth, phaseSeed) {
  const pivot = new THREE.Group();
  const len = sizeAt(CONFIG.panelLength, depth);
  const wid = sizeAt(CONFIG.panelWidth, depth);

  const mesh = new THREE.Mesh(triGeometry(len, wid), panelMats[(matCursor++) % panelMats.length]);
  mesh.castShadow = mesh.receiveShadow = true;
  pivot.add(mesh);

  drivers.push({
    node: pivot,
    depth,
    phase: phaseSeed * 1.618 + depth * 1.15,
    baseX: 0.35 + depth * 0.22,
    baseY: 0,
    amp: 0.85 / (1 + depth * 0.35),
  });

  if (depth < CONFIG.maxDepth) {
    for (let b = 0; b < CONFIG.branches; b++) {
      const child = growLimb(depth + 1, phaseSeed + b * 2.4 + depth);
      child.position.set(0, len, 0);
      // Static splay so limbs fan out instead of stacking
      const side = b === 0 ? 1 : -1;
      child.rotation.y = side * (0.55 + depth * 0.12);
      child.rotation.z = side * 0.35;
      const d = drivers.find(dr => dr.node === child);
      if (d) d.baseY = child.rotation.y;
      pivot.add(child);
    }
  }
  return pivot;
}

for (let a = 0; a < CONFIG.anchors; a++) {
  const dir = anchorDir(a, CONFIG.anchors);
  const mount = new THREE.Group();
  mount.position.copy(dir).multiplyScalar(CONFIG.coreRadius * 0.9);
  mount.quaternion.setFromUnitVectors(_up, dir); // local +Y points outward
  const limb = growLimb(0, a * 3.1);
  limb.rotation.x = 0.5; // rest pose: panels lean outward from the hub
  const d = drivers.find(dr => dr.node === limb);
  if (d) d.baseX = limb.rotation.x;
  mount.add(limb);
  master.add(mount);
}

document.getElementById('stat-panels').textContent = drivers.length;
document.getElementById('stat-depth').textContent = `0–${CONFIG.maxDepth}`;

/* ==================== kinetic animation loop ======================== */
const clock = new THREE.Clock();
const statFps = document.getElementById('stat-fps');
const speedInput = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
let motionScale = 1.0;
let simT = 0, fpsAcc = 0, fpsN = 0, fpsT = 0;

speedInput.addEventListener('input', () => {
  motionScale = parseFloat(speedInput.value);
  speedVal.textContent = `${motionScale.toFixed(2)}×`;
});

// Synchronized undulation: nested sin/cos waves with per-joint phase
// offsets so the fold ripples outward through the hierarchy.
function driveJoints(t) {
  const w = CONFIG.foldSpeed;
  for (let i = 0; i < drivers.length; i++) {
    const dr = drivers[i];
    const p = dr.phase;
    const ripple = Math.sin(t * w + p) * 0.62
      + Math.sin(t * w * 1.83 + p * 1.7 + Math.sin(t * w * 0.5 + p) * 0.9) * 0.38;
    const sway = Math.cos(t * w * 0.77 + p * 1.3 + Math.cos(t * w * 0.31 + p * 0.6) * 0.7);
    dr.node.rotation.x = dr.baseX + ripple * dr.amp;
    dr.node.rotation.y = dr.baseY + sway * dr.amp * 0.45;
  }
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  simT += dt * motionScale;
  const t = simT;

  driveJoints(t);

  // Slow all-around turntable: continuous drift on Y and Z
  master.rotation.y = t * CONFIG.spinY;
  master.rotation.z = t * CONFIG.spinZ;

  // Breathing heart light: intensity pulse + slow hue wander (warm range)
  heart.intensity = 46 + Math.sin(t * 2.1) * 16 + Math.sin(t * 4.7) * 7;
  heart.color.setHSL(0.03 + 0.045 * (0.5 + 0.5 * Math.sin(t * 0.23)), 0.95, 0.55);
  ember.material.emissiveIntensity = 1.8 + Math.sin(t * 2.1) * 0.6;

  hub.rotation.x = t * 0.08;
  hub.rotation.y = -t * 0.11;

  controls.update();
  renderer.render(scene, camera);

  fpsAcc += dt; fpsN++; fpsT += dt;
  if (fpsT > 0.5) {
    statFps.textContent = Math.round(fpsN / Math.max(fpsAcc, 1e-6));
    fpsAcc = 0; fpsN = 0; fpsT = 0;
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
