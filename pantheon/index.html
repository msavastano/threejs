<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ------------------------------------------------------------------ constants (metres) */
const R = 21.65;                       // interior radius = height of springline
const OC_R = 4.1;                      // oculus radius (8.2 m diameter)
const OC_Y = R + Math.sqrt(R * R - OC_R * OC_R);   // height of the oculus rim on the inner shell
const DRUM_R = 27.9;
const LAT = 41.9, LON = 12.5;          // Rome
const DEG = Math.PI / 180;
const CENTER = new THREE.Vector3(0, R, 0);

/* ------------------------------------------------------------------ renderer / scene */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.15, 30000);

const sky = new Sky();
sky.scale.setScalar(9000);
sky.material.uniforms.turbidity.value = 2.2;
sky.material.uniforms.rayleigh.value = 1.3;
sky.material.uniforms.mieCoefficient.value = 0.004;
sky.material.uniforms.mieDirectionalG.value = 0.8;
scene.add(sky);

const cutPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 1e5);   // keeps everything until cutaway is on
const clipList = [cutPlane];

/* ------------------------------------------------------------------ procedural textures */
function lattice(n, seed) {
  let s = seed >>> 0;
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  const a = new Float32Array(n * n);
  for (let i = 0; i < a.length; i++) a[i] = rnd();
  return a;
}
function fbm(size, seed, base = 4, oct = 5, gain = 0.55) {
  const out = new Float32Array(size * size);
  let amp = 1, norm = 0;
  for (let o = 0; o < oct; o++) {
    const f = base * (1 << o), L = lattice(f, seed + o * 77);
    for (let y = 0; y < size; y++) {
      const fy = y / size * f, y0 = Math.floor(fy), ty = fy - y0, sy = ty * ty * (3 - 2 * ty);
      for (let x = 0; x < size; x++) {
        const fx = x / size * f, x0 = Math.floor(fx), tx = fx - x0, sx = tx * tx * (3 - 2 * tx);
        const x1 = (x0 + 1) % f, y1 = (y0 + 1) % f, xx = x0 % f, yy = y0 % f;
        const v = L[yy * f + xx] * (1 - sx) * (1 - sy) + L[yy * f + x1] * sx * (1 - sy)
                + L[y1 * f + xx] * (1 - sx) * sy + L[y1 * f + x1] * sx * sy;
        out[y * size + x] += v * amp;
      }
    }
    norm += amp; amp *= gain;
  }
  for (let i = 0; i < out.length; i++) out[i] /= norm;
  return out;
}
function finishTex(c, repeat = 1) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  t.repeat.set(repeat, repeat);
  return t;
}
// speckled plaster / stone: base colour, contrast of the large mottling, fine grain
function stoneTex(size, seed, base, mottle = 0.25, grain = 0.08, veins = 0) {
  const n = fbm(size, seed, 3, 5), g = fbm(size, seed + 9, 48, 2, 0.5), v = veins ? fbm(size, seed + 31, 3, 4) : null;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d'), img = ctx.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    let k = 1 + (n[i] - 0.5) * 2 * mottle + (g[i] - 0.5) * 2 * grain, vein = 0;
    if (v) { vein = Math.pow(1 - Math.abs(Math.sin((v[i] * 7) * Math.PI)), 24); k += vein * 0.12; }
    img.data[i * 4 + 0] = Math.min(255, base[0] * k * (1 + vein * 0.1));
    img.data[i * 4 + 1] = Math.min(255, base[1] * k);
    img.data[i * 4 + 2] = Math.min(255, base[2] * k * (1 - vein * 0.1));
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}
function brickTex() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d'); x.fillStyle = '#a88a6e'; x.fillRect(0, 0, 512, 512);
  const rows = 16, bw = 64, bh = 512 / rows;
  let s = 7; const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let r = 0; r < rows; r++) for (let i = -1; i < 9; i++) {
    const ox = (r % 2) * bw / 2, l = 0.72 + rnd() * 0.3;
    x.fillStyle = `rgb(${(178 * l) | 0},${(120 * l) | 0},${(88 * l) | 0})`;
    x.fillRect(i * bw + ox + 2, r * bh + 2, bw - 4, bh - 4);
  }
  return c;
}
function floorTex() {
  const S = 2048, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d'); x.fillStyle = '#c9b892'; x.fillRect(0, 0, S, S);
  const N = 9, cell = S / N;
  const noise = (ctx, col) => col;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const cx = i * cell, cy = j * cell, mx = cx + cell / 2, my = cy + cell / 2;
    const even = (i + j) % 2 === 0;
    if (even) {           // pavonazzetto square with granite disc
      x.fillStyle = '#b9a9a6'; x.fillRect(cx + 6, cy + 6, cell - 12, cell - 12);
      x.fillStyle = '#7d7d7a'; x.beginPath(); x.arc(mx, my, cell * 0.36, 0, 7); x.fill();
      x.strokeStyle = '#e8dcc0'; x.lineWidth = 7; x.beginPath(); x.arc(mx, my, cell * 0.36, 0, 7); x.stroke();
    } else {              // giallo square with porphyry disc
      x.fillStyle = '#d9c58a'; x.fillRect(cx + 6, cy + 6, cell - 12, cell - 12);
      x.fillStyle = '#6a2f33'; x.beginPath(); x.arc(mx, my, cell * 0.34, 0, 7); x.fill();
      x.strokeStyle = '#efe6cf'; x.lineWidth = 7; x.beginPath(); x.arc(mx, my, cell * 0.34, 0, 7); x.stroke();
      x.fillStyle = '#e8dcc0'; x.fillRect(mx - cell * 0.42, my - 4, cell * 0.84, 8);
    }
  }
  // stone grain overlay
  const g = fbm(512, 5, 8, 4), img = x.getImageData(0, 0, S, S);
  for (let py = 0; py < S; py++) for (let px = 0; px < S; px++) {
    const k = 0.9 + g[(py >> 2) * 512 + (px >> 2)] * 0.2, o = (py * S + px) * 4;
    img.data[o] *= k; img.data[o + 1] *= k; img.data[o + 2] *= k;
  }
  x.putImageData(img, 0, 0);
  return c;
}

const T = {
  dome:   finishTex(stoneTex(1024, 11, [176, 152, 122], 0.16, 0.07)),
  wall:   finishTex(stoneTex(1024, 21, [200, 186, 158], 0.16, 0.05, 1)),
  yellow: finishTex(stoneTex(512, 31, [214, 178, 96], 0.25, 0.06, 1)),
  granite:finishTex(stoneTex(512, 41, [166, 164, 158], 0.18, 0.2)),
  marble: finishTex(stoneTex(512, 51, [226, 218, 200], 0.1, 0.04, 1)),
  lead:   finishTex(stoneTex(512, 61, [112, 116, 116], 0.18, 0.06)),
  ground: finishTex(stoneTex(1024, 71, [160, 148, 128], 0.2, 0.1), 220),
  brick:  finishTex(brickTex()),
  floor:  finishTex(floorTex()),
};
const M = {
  dome:    new THREE.MeshStandardMaterial({ map: T.dome, bumpMap: T.dome, bumpScale: 0.6, roughness: 0.95, side: THREE.DoubleSide }),
  wall:    new THREE.MeshStandardMaterial({ map: T.wall, roughness: 0.6, side: THREE.DoubleSide }),
  yellow:  new THREE.MeshStandardMaterial({ map: T.yellow, roughness: 0.35 }),
  granite: new THREE.MeshStandardMaterial({ map: T.granite, roughness: 0.5 }),
  marble:  new THREE.MeshStandardMaterial({ map: T.marble, roughness: 0.4, side: THREE.DoubleSide }),
  lead:    new THREE.MeshStandardMaterial({ map: T.lead, roughness: 0.8, side: THREE.DoubleSide }),
  brick:   new THREE.MeshStandardMaterial({ map: T.brick, roughness: 0.95, side: THREE.DoubleSide }),
  ground:  new THREE.MeshStandardMaterial({ map: T.ground, roughness: 1 }),
  floor:   new THREE.MeshStandardMaterial({ map: T.floor, roughness: 0.32 }),
  bronze:  new THREE.MeshStandardMaterial({ color: 0x6b4a22, metalness: 0.55, roughness: 0.42 }),
  porphyry:new THREE.MeshStandardMaterial({ color: 0x8a3f45, roughness: 0.4 }),
  serp:    new THREE.MeshStandardMaterial({ color: 0x62866b, roughness: 0.4 }),
  dark:    new THREE.MeshStandardMaterial({ color: 0x1c1712, roughness: 0.9, side: THREE.DoubleSide }),
  pale:    new THREE.MeshStandardMaterial({ color: 0xd6cbb0, roughness: 0.45, side: THREE.DoubleSide }),
};

/* ------------------------------------------------------------------ helpers */
const world = new THREE.Group();
scene.add(world);
function mesh(geo, mat, parent = world) { const m = new THREE.Mesh(geo, mat); parent.add(m); return m; }
function scaleUV(geo, su, sv) {
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
  return geo;
}
// angle a is measured clockwise from north (-z): entrance north, apse south
const at = (a, r, y = 0) => new THREE.Vector3(r * Math.sin(a), y, -r * Math.cos(a));
function wallSeg(a0, a1, y0, y1, mat, parent = world) {
  const geo = new THREE.CylinderGeometry(R, R, y1 - y0, Math.max(4, Math.ceil((a1 - a0) / DEG / 3)), 1, true, Math.PI - a1, a1 - a0);
  scaleUV(geo, (a1 - a0) * R / 6, (y1 - y0) / 6);
  const m = mesh(geo, mat, parent); m.material = mat; m.position.y = (y0 + y1) / 2;
  m.material.side = THREE.DoubleSide;
  return m;
}
function lathe(points, mat, seg = 128, parent = world) {
  return mesh(new THREE.LatheGeometry(points.map(p => new THREE.Vector2(p[0], p[1])), seg), mat, parent);
}

/* ------------------------------------------------------------------ coffered dome (real stepped geometry) */
class GB {
  constructor() { this.p = []; this.n = []; this.u = []; }
  vert(v, n, uv) { return { v, n, uv }; }
  tri(a, b, c, hint) {
    const g = new THREE.Vector3().subVectors(b.v, a.v).cross(new THREE.Vector3().subVectors(c.v, a.v));
    if (g.dot(hint) < 0) { const t = b; b = c; c = t; }
    for (const q of [a, b, c]) { this.p.push(q.v.x, q.v.y, q.v.z); this.n.push(q.n.x, q.n.y, q.n.z); this.u.push(q.uv[0], q.uv[1]); }
  }
  geometry() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.u, 2));
    return g;
  }
}
const sp = (th, ph, r) => new THREE.Vector3(r * Math.sin(th) * Math.sin(ph), R + r * Math.cos(th), r * Math.sin(th) * Math.cos(ph));
const domeUV = (th, ph) => [ph / (2 * Math.PI) * 16, th * R / 8];

// sphere patch at radius r (normals face the centre, i.e. the viewer inside)
function patch(gb, th0, th1, ph0, ph1, r, nT, nP) {
  const grid = [];
  for (let i = 0; i <= nT; i++) {
    const row = [];
    for (let j = 0; j <= nP; j++) {
      const th = th0 + (th1 - th0) * i / nT, ph = ph0 + (ph1 - ph0) * j / nP;
      const p = sp(th, ph, r);
      row.push(gb.vert(p, new THREE.Vector3().subVectors(CENTER, p).normalize(), domeUV(th, ph)));
    }
    grid.push(row);
  }
  for (let i = 0; i < nT; i++) for (let j = 0; j < nP; j++) {
    const a = grid[i][j], b = grid[i + 1][j], c = grid[i + 1][j + 1], d = grid[i][j + 1];
    const hint = new THREE.Vector3().addVectors(a.n, c.n);
    gb.tri(a, b, c, hint); gb.tri(a, c, d, hint);
  }
}
// ring of frame between an outer and an inner (th,ph) rectangle, at radius r
function frame(gb, o, i, r) {
  patch(gb, o.t0, i.t0, o.p0, o.p1, r, 1, 3);       // low-theta strip
  patch(gb, i.t1, o.t1, o.p0, o.p1, r, 1, 3);       // high-theta strip
  patch(gb, i.t0, i.t1, o.p0, i.p0, r, 2, 1);       // left
  patch(gb, i.t0, i.t1, i.p1, o.p1, r, 2, 1);       // right
}
// side walls of a rectangular recess between radius r1 and r2
function walls(gb, rc, r1, r2) {
  const mid = sp((rc.t0 + rc.t1) / 2, (rc.p0 + rc.p1) / 2, r2);
  const edge = (a, b, hintFrom) => {
    const n = 3;
    for (let k = 0; k < n; k++) {
      const s0 = k / n, s1 = (k + 1) / n;
      const P = (s, r) => a(s, r);
      const q00 = P(s0, r1), q01 = P(s1, r1), q10 = P(s0, r2), q11 = P(s1, r2);
      const mc = new THREE.Vector3().add(q00).add(q11).multiplyScalar(0.5);
      const hint = new THREE.Vector3().subVectors(mid, mc);
      const nrm = new THREE.Vector3().subVectors(q01, q00).cross(new THREE.Vector3().subVectors(q10, q00)).normalize();
      if (nrm.dot(hint) < 0) nrm.negate();
      const V = (q, s, r) => gb.vert(q, nrm, [s * 2, (r - r1) * 0.3]);
      gb.tri(V(q00, s0, r1), V(q01, s1, r1), V(q11, s1, r2), hint);
      gb.tri(V(q00, s0, r1), V(q11, s1, r2), V(q10, s0, r2), hint);
    }
  };
  edge((s, r) => sp(rc.t0, rc.p0 + (rc.p1 - rc.p0) * s, r));
  edge((s, r) => sp(rc.t1, rc.p0 + (rc.p1 - rc.p0) * s, r));
  edge((s, r) => sp(rc.t0 + (rc.t1 - rc.t0) * s, rc.p0, r));
  edge((s, r) => sp(rc.t0 + (rc.t1 - rc.t0) * s, rc.p1, r));
}
{
  const gb = new GB();
  const ringDeg = [90, 78, 67, 57, 47.5, 38.5].map(d => d * DEG);
  const depth = [1.8, 1.6, 1.35, 1.1, 0.85];
  const inFrac = [0.10, 0.17, 0.24, 0.31], depthF = [0.3, 0.58, 0.82, 1.0];
  const COUNT = 28, dPh = 2 * Math.PI / COUNT;
  const inset = (c, f) => {
    const dt = (c.t1 - c.t0) * f, dp = (c.p1 - c.p0) * f;
    return { t0: c.t0 + dt, t1: c.t1 - dt, p0: c.p0 + dp, p1: c.p1 - dp };
  };
  for (let ring = 0; ring < 5; ring++) for (let j = 0; j < COUNT; j++) {
    const cell = { t0: ringDeg[ring + 1], t1: ringDeg[ring], p0: j * dPh, p1: (j + 1) * dPh };
    const rects = inFrac.map(f => inset(cell, f));
    const dl = depthF.map(f => depth[ring] * f);
    frame(gb, cell, rects[0], R);
    walls(gb, rects[0], R, R + dl[0]);
    frame(gb, rects[0], rects[1], R + dl[0]);
    walls(gb, rects[1], R + dl[0], R + dl[1]);
    frame(gb, rects[1], rects[2], R + dl[1]);
    walls(gb, rects[2], R + dl[1], R + dl[2]);
    frame(gb, rects[2], rects[3], R + dl[2]);
    walls(gb, rects[3], R + dl[2], R + dl[3]);
    patch(gb, rects[3].t0, rects[3].t1, rects[3].p0, rects[3].p1, R + dl[3], 1, 2);
  }
  // smooth annulus around the oculus
  const thO = Math.asin(OC_R / R);
  patch(gb, thO, ringDeg[5], 0, 2 * Math.PI, R, 6, 96);
  mesh(gb.geometry(), M.dome);
}

/* ------------------------------------------------------------------ oculus tube + bronze */
{
  const tube = new THREE.CylinderGeometry(OC_R, OC_R, 1.35, 64, 1, true);
  const t = mesh(tube, M.pale); t.position.y = OC_Y + 0.62; t.material.side = THREE.DoubleSide;
  for (const y of [OC_Y + 0.02, OC_Y + 1.3]) {
    const r = mesh(new THREE.TorusGeometry(OC_R, 0.14, 12, 96), M.bronze);
    r.rotation.x = Math.PI / 2; r.position.y = y;
  }
}

/* ------------------------------------------------------------------ lower walls, entablature, attic */
const OPEN_TOP = 9.2;
const OPEN_W = [7.6, 7.6, 7.6, 7.6, 9.2, 7.6, 7.6, 7.6];        // entrance N (0) ... apse S (4)
const OPEN_D = [5.6, 3.4, 3.4, 3.4, 4.6, 3.4, 3.4, 3.4];
for (let k = 0; k < 8; k++) {

/* ------------------------------------------------------------------ astronomy */
function solar(doy, clockMin) {
  const dst = doy >= 88 && doy < 298, tz = dst ? 2 : 1;                 // CEST / CET (2026 transition dates)
  const hour = clockMin / 60;
  const g = 2 * Math.PI / 365 * (doy - 1 + (hour - 12) / 24);
  const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const tst = clockMin + eq + 4 * LON - 60 * tz;
  const ha = (tst / 4 - 180) * DEG, lat = LAT * DEG;
  const east = -Math.cos(dec) * Math.sin(ha);
  const north = Math.sin(dec) * Math.cos(lat) - Math.cos(dec) * Math.sin(lat) * Math.cos(ha);
  const up = Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(ha);
  const alt = Math.asin(THREE.MathUtils.clamp(up, -1, 1));
  let az = Math.atan2(east, north); if (az < 0) az += 2 * Math.PI;
  return { dir: new THREE.Vector3(east, up, -north).normalize(), alt: alt / DEG, az: az / DEG, dst };
}
// where the centre of the beam first meets the interior
function beamHit(dir) {
  if (dir.y < 0.03) return null;
  const hx = Math.hypot(dir.x, dir.z);
  const oy = OC_Y - R, b = oy * dir.y;
  const sSph = b + Math.sqrt(Math.max(0, b * b - oy * oy + R * R));
  const yS = OC_Y - sSph * dir.y;
  let p, kind, ring = 0;
  if (yS >= R) { p = new THREE.Vector3(-dir.x * sSph, yS, -dir.z * sSph); kind = 'dome'; }
  else {
    const sCyl = hx > 1e-6 ? R / hx : Infinity, sFl = OC_Y / dir.y;
    if (sFl < sCyl) { p = new THREE.Vector3(-dir.x * sFl, 0, -dir.z * sFl); kind = 'floor'; }
    else { p = new THREE.Vector3(-dir.x * sCyl, OC_Y - sCyl * dir.y, -dir.z * sCyl); kind = 'wall'; }
  }
  const n = kind === 'floor' ? new THREE.Vector3(0, 1, 0)
    : kind === 'wall' ? new THREE.Vector3(-p.x, 0, -p.z).normalize()
    : new THREE.Vector3().subVectors(CENTER, p).normalize();
  return { p, n, kind };
}

  beamUniforms.uSun.value.copy(s.dir.y > 0.02 ? s.dir : new THREE.Vector3(0, 1, 0));
  beamUniforms.uInt.value = s.dir.y > 0.02 ? beamF : 0;
  beamUniforms.uColor.value.copy(tmpC);
  beamUniforms.uHaze.value = 0.012 + 0.05 * S.haze;

  const hit = beamHit(s.dir);
  let note = 'sun below the horizon';
  if (hit && s.alt > 0.5) {
    bounce.position.copy(hit.p).addScaledVector(hit.n, 6);
    bounce.intensity = 120 * beamF * (hit.kind === 'floor' ? 1 : 0.7);
    bounce.color.copy(tmpC);
    if (hit.kind === 'floor') note = `beam lands on the floor, ${Math.hypot(hit.p.x, hit.p.z).toFixed(1)} m from centre`;
    else if (hit.kind === 'wall') {
      const nearDoor = hit.p.z < 0 && Math.abs(hit.p.x) < 4 && hit.p.y < 8;
      note = `beam lands on the wall at ${hit.p.y.toFixed(1)} m` + (nearDoor ? ' · on the doorway' : '');
    } else note = `beam lands on the dome, ${(Math.acos(THREE.MathUtils.clamp((hit.p.y - R) / R, -1, 1)) / DEG).toFixed(0)}° from vertical`;
  } else bounce.intensity = 0;
  el('readout').innerHTML = `<b>${fmtDate(S.doy)}</b> &nbsp; <b>${fmtTime(S.min, s.dst)}</b><br>` +
    `sun altitude <b>${s.alt.toFixed(1)}°</b> &nbsp; azimuth <b>${s.az.toFixed(0)}°</b><br><span class="note">${note}</span>`;
  el('timeOut').textContent = fmtTime(S.min, s.dst);
  el('dateOut').textContent = fmtDate(S.doy);
}
function syncUI() {
  el('time').value = Math.floor(S.min); el('date').value = S.doy;
  el('play').textContent = S.playing ? 'Pause' : 'Play'; el('play').classList.toggle('on', S.playing);
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
  document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', +b.dataset.doy === S.doy));
}
el('time').oninput = e => { S.min = +e.target.value; S.playing = false; updateSun(); syncUI(); };
el('date').oninput = e => { S.doy = +e.target.value; updateSun(); syncUI(); };
el('play').onclick = () => { S.playing = !S.playing; syncUI(); };
el('speed').oninput = e => { S.speed = +e.target.value; };
el('haze').oninput = e => { S.haze = e.target.value / 100; updateSun(); };
const applyExposure = () => { renderer.toneMappingExposure = el('exposure').value / 100 * (S.view === 'outside' ? 0.45 : 1); };
el('exposure').oninput = applyExposure;
el('cut').onchange = e => { S.cut = e.target.checked; };
document.querySelectorAll('#presets button').forEach(b => b.onclick = () => {
  S.doy = +b.dataset.doy; if (S.min < 8 * 60 || S.min > 17 * 60) S.min = 12 * 60;
  updateSun(); syncUI();
});

/* ------------------------------------------------------------------ cameras */
const orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = true; orbit.maxDistance = 400; orbit.minDistance = 20; orbit.maxPolarAngle = Math.PI * 0.495;
const look = { yaw: 0, pitch: 0.2, pos: new THREE.Vector3(0, 1.7, -14), fov: 65, drag: false, keys: {} };
function setView(v) {
  S.view = v;
  if (v === 'outside') {
    orbit.enabled = true; camera.fov = 45; camera.updateProjectionMatrix();
    camera.position.set(-70, 32, -95); orbit.target.set(0, 18, 0); orbit.update();
  } else {
    orbit.enabled = false;
    look.fov = v === 'up' ? 80 : 65;
    if (v === 'inside') { look.pos.set(0, 1.7, -14); look.yaw = Math.PI; look.pitch = 0.32; }
    else { look.pos.set(0, 1.7, 3.5); look.yaw = Math.PI; look.pitch = 1.32; }
    camera.fov = look.fov; camera.updateProjectionMatrix();
  }
  applyExposure(); syncUI();
}
document.querySelectorAll('#views button').forEach(b => b.onclick = () => setView(b.dataset.view));
canvas.addEventListener('pointerdown', e => { if (S.view !== 'outside') { look.drag = true; canvas.setPointerCapture(e.pointerId); } });
canvas.addEventListener('pointerup', () => { look.drag = false; });
canvas.addEventListener('pointermove', e => {
  if (!look.drag) return;
  look.yaw -= e.movementX * 0.0035; look.pitch = THREE.MathUtils.clamp(look.pitch - e.movementY * 0.0035, -1.5, 1.55);
});
canvas.addEventListener('wheel', e => {
  if (S.view === 'outside') return;
  look.fov = THREE.MathUtils.clamp(look.fov + e.deltaY * 0.03, 25, 100); camera.fov = look.fov; camera.updateProjectionMatrix();
}, { passive: true });
addEventListener('keydown', e => { look.keys[e.code] = true; });
addEventListener('keyup', e => { look.keys[e.code] = false; });

function updateCamera(dt) {
  if (S.view === 'outside') { orbit.update(); return; }
  const k = look.keys, f = ((k.KeyW || k.ArrowUp) ? 1 : 0) - ((k.KeyS || k.ArrowDown) ? 1 : 0),
        s = ((k.KeyD || k.ArrowRight) ? 1 : 0) - ((k.KeyA || k.ArrowLeft) ? 1 : 0);
  if (f || s) {
    const sp = 6 * dt, fx = -Math.sin(look.yaw), fz = -Math.cos(look.yaw);
    look.pos.x += (fx * f + -fz * s) * sp; look.pos.z += (fz * f + fx * s) * sp;
    const r = Math.hypot(look.pos.x, look.pos.z); if (r > 19.5) { look.pos.x *= 19.5 / r; look.pos.z *= 19.5 / r; }
  }
  camera.position.copy(look.pos);
  camera.quaternion.setFromEuler(new THREE.Euler(look.pitch, look.yaw, 0, 'YXZ'));
}

/* ------------------------------------------------------------------ post */
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.28, 0.6, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});

/* ------------------------------------------------------------------ loop */
const clock = new THREE.Clock();
let lastUI = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  if (S.playing) {
    S.min += S.speed * dt; if (S.min >= 1440) { S.min -= 1440; }
    updateSun();
    if (t - lastUI > 0.1) { el('time').value = Math.floor(S.min); lastUI = t; }
  }
  beamUniforms.uTime.value = t;
  updateCamera(dt);
  if (S.cut && S.view === 'outside') {                         // slice away the half nearest the camera
    const d = new THREE.Vector3(camera.position.x, 0, camera.position.z).normalize();
    cutPlane.set(d.clone().negate(), 0.5);
  } else cutPlane.set(new THREE.Vector3(0, 1, 0), 1e5);
  composer.render();
  requestAnimationFrame(tick);
}
setView('inside'); updateSun(); syncUI();
window.__pantheon = { S, setView, updateSun, syncUI, look, camera, orbit, solar, beamHit, renderer };
tick();
</script>
</body>
</html>
