<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selective Bloom — EffectComposer + UnrealBloomPass</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  #info {
    position: absolute; top: 10px; left: 10px; color: #ccc;
    font: 13px monospace; pointer-events: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">Selective bloom: only the neon spheres (layer 1) glow — terrain stays sharp. Drag to orbit.</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 6, 14);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);

scene.add(new THREE.AmbientLight(0x404060, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 10, 7);
sun.castShadow = true;
scene.add(sun);

// ---------------------------------------------------------------------------
// Scene content: emissive neon spheres (bloom) + plain terrain (no bloom)
// ---------------------------------------------------------------------------
const BLOOM_SCENE = 1;                 // layer number reserved for glowing objects
const bloomLayer = new THREE.Layers();
bloomLayer.set(BLOOM_SCENE);

// Non-emissive terrain — stays perfectly sharp.
const terrain = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60, 64, 64),
  new THREE.MeshStandardMaterial({ color: 0x3a5f3a, roughness: 0.9, metalness: 0.0 })
);
terrain.rotation.x = -Math.PI / 2;
terrain.receiveShadow = true;
scene.add(terrain);

// A few ordinary boxes — also unaffected by bloom.
const boxGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
const boxMat = new THREE.MeshStandardMaterial({ color: 0x8a7a66, roughness: 0.7 });
for (let i = 0; i < 6; i++) {
  const box = new THREE.Mesh(boxGeo, boxMat);
  const a = (i / 6) * Math.PI * 2;
  box.position.set(Math.cos(a) * 6, 0.75, Math.sin(a) * 6);
  box.castShadow = box.receiveShadow = true;
  scene.add(box);
}

// Neon spheres — assigned to the bloom layer.
const sphereGeo = new THREE.SphereGeometry(0.6, 32, 32);
const neonColors = [0xff2d95, 0x00eaff, 0xffe600, 0x7cff00, 0xb537ff];
const neonSpheres = [];
for (let i = 0; i < neonColors.length; i++) {
  const mat = new THREE.MeshStandardMaterial({
    color: 0x000000,
    emissive: neonColors[i],
    emissiveIntensity: 2.5
  });
  const sphere = new THREE.Mesh(sphereGeo, mat);
  const a = (i / neonColors.length) * Math.PI * 2;
  sphere.position.set(Math.cos(a) * 3, 2 + Math.sin(i) * 0.5, Math.sin(a) * 3);
  sphere.layers.enable(BLOOM_SCENE);   // <-- the one line that opts into bloom
  scene.add(sphere);
  neonSpheres.push(sphere);
}

// ---------------------------------------------------------------------------
// Post-processing: selective bloom via the darken / composite technique
//
// Pass 1 (bloomComposer): every material NOT on the bloom layer is swapped
// for black, so only glowing objects can bloom; result is an UnrealBloomPass
// texture held in memory (renderToScreen = false).
// Pass 2 (finalComposer): the scene is rendered normally, then a mix shader
// additively blends baseTexture + bloomTexture, then OutputPass handles
// tone mapping / sRGB.
// ---------------------------------------------------------------------------
const renderScene = new RenderPass(scene, camera);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.5,   // strength
  0.4,   // radius
  0.0    // threshold — 0 is fine here because non-bloom objects render black
);

const bloomComposer = new EffectComposer(renderer);
bloomComposer.renderToScreen = false;
bloomComposer.addPass(renderScene);
bloomComposer.addPass(bloomPass);

const mixPass = new ShaderPass(
  new THREE.ShaderMaterial({
    uniforms: {
      baseTexture: { value: null },
      bloomTexture: { value: bloomComposer.renderTarget2.texture }
    },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D baseTexture;
      uniform sampler2D bloomTexture;
      varying vec2 vUv;
      void main() {
        gl_FragColor = texture2D(baseTexture, vUv) + texture2D(bloomTexture, vUv);
      }
    `
  }),
  'baseTexture'
);
mixPass.needsSwap = true;

const finalComposer = new EffectComposer(renderer);
finalComposer.addPass(renderScene);
finalComposer.addPass(mixPass);
finalComposer.addPass(new OutputPass());

// --- material darkening helpers -------------------------------------------
const darkMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
const materialCache = {};
let cachedBackground = null;

function darkenNonBloomed(obj) {
  if (obj.isMesh && bloomLayer.test(obj.layers) === false) {
    materialCache[obj.uuid] = obj.material;
    obj.material = darkMaterial;
  }
}

function restoreMaterial(obj) {
  if (materialCache[obj.uuid]) {
    obj.material = materialCache[obj.uuid];
    delete materialCache[obj.uuid];
  }
}

// ---------------------------------------------------------------------------
// Resize + render loop
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  bloomComposer.setSize(window.innerWidth, window.innerHeight);
  finalComposer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Gentle bobbing so the bloom streaks move.
  neonSpheres.forEach((s, i) => {
    s.position.y = 2 + Math.sin(t * 1.5 + i * 1.3) * 0.6;
  });

  controls.update();

  // 1. Render bloom only: darken non-bloom meshes (and the background).
  cachedBackground = scene.background;
  scene.background = null;
  scene.traverse(darkenNonBloomed);
  bloomComposer.render();
  scene.traverse(restoreMaterial);
  scene.background = cachedBackground;

  // 2. Render the real scene and composite the bloom texture on top.
  finalComposer.render();
}

animate();
</script>
</body>
</html>
