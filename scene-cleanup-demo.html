<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Three.js Scene Cleanup Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    background: #0a0a0f;
    color: #c9d1d9;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Canvas area ── */
  #canvas-container {
    flex: 1;
    position: relative;
    min-width: 0;
  }
  #canvas-container canvas { display: block; width: 100% !important; height: 100% !important; }

  /* ── Side panel ── */
  #panel {
    width: 420px;
    min-width: 420px;
    background: #0d1117;
    border-left: 1px solid #21262d;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .panel-header {
    padding: 16px 20px;
    border-bottom: 1px solid #21262d;
    font-size: 13px;
    font-weight: 600;
    color: #58a6ff;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ── Sections ── */
  .section {
    padding: 16px 20px;
    border-bottom: 1px solid #21262d;
  }
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8b949e;
    margin-bottom: 12px;
  }

  /* ── Buttons ── */
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font-family: inherit;
    font-size: 12px;
    padding: 8px 14px;
    border: 1px solid #30363d;
    border-radius: 6px;
    cursor: pointer;
    background: #161b22;
    color: #c9d1d9;
    transition: all 0.15s ease;
  }
  button:hover { background: #21262d; border-color: #58a6ff; }
  button.active { background: #1f6feb; border-color: #58a6ff; color: #fff; }
  button.danger { border-color: #f8514966; color: #f85149; }
  button.danger:hover { background: #f851491a; }
  button.success { border-color: #3fb95066; color: #3fb950; }
  button.success:hover { background: #3fb9501a; }

  /* ── Memory table ── */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }
  th, td {
    padding: 6px 10px;
    text-align: left;
    border-bottom: 1px solid #21262d;
  }
  th { color: #8b949e; font-weight: 500; }
  td { color: #c9d1d9; }
  tr:last-child td { border-bottom: none; }
  .val-up   { color: #f85149; }
  .val-down { color: #3fb950; }
  .val-neutral { color: #8b949e; }

  /* ── Log entries ── */
  #log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 20px;
    font-size: 11px;
    line-height: 1.6;
  }
  .log-entry {
    padding: 3px 0;
    border-bottom: 1px solid #21262d33;
  }
  .log-entry .time { color: #484f58; margin-right: 8px; }
  .log-entry.info  { color: #58a6ff; }
  .log-entry.warn  { color: #d29922; }
  .log-entry.error { color: #f85149; }
  .log-entry.ok    { color: #3fb950; }

  /* ── Status bar ── */
  .status-bar {
    padding: 10px 20px;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid #21262d;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #3fb950;
    animation: pulse 2s infinite;
  }
  .status-dot.idle { background: #484f58; animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Scenario cards ── */
  .scenario-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .scenario-card {
    padding: 10px 12px;
    border: 1px solid #30363d;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    font-size: 11px;
    line-height: 1.4;
  }
  .scenario-card:hover { border-color: #58a6ff; background: #1f6feb0d; }
  .scenario-card.selected { border-color: #58a6ff; background: #1f6feb22; }
  .scenario-card .count { color: #58a6ff; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="panel">
  <div class="panel-header">⚙ WebGL Cleanup Monitor</div>

  <!-- Step 1: Scenario selection -->
  <div class="section">
    <div class="section-title">Step 1 — Choose scenario</div>
    <div class="scenario-grid">
      <div class="scenario-card" onclick="selectScenario('basic')" data-scenario="basic">
        <div class="count">~8</div>
        Basic Meshes
      </div>
      <div class="scenario-card" onclick="selectScenario('medium')" data-scenario="medium">
        <div class="count">~25</div>
        Textures + Lights
      </div>
      <div class="scenario-card" onclick="selectScenario('heavy')" data-scenario="heavy">
        <div class="count">~80</div>
        Instanced + Shaders
      </div>
      <div class="scenario-card" onclick="selectScenario('extreme')" data-scenario="extreme">
        <div class="count">~200+</div>
        Full Stress Test
      </div>
    </div>
  </div>

  <!-- Step 2: Build / destroy -->
  <div class="section">
    <div class="section-title">Step 2 — Actions</div>
    <div class="btn-row">
      <button onclick="buildScene()" class="success" id="btn-build">▶ Build Scene</button>
      <button onclick="destroyScene()" class="danger" id="btn-destroy" disabled>✕ Destroy + Cleanup</button>
      <button onclick="runGC()" id="btn-gc" disabled>⟳ Force GC</button>
    </div>
  </div>

  <!-- Step 3: Memory snapshots -->
  <div class="section">
    <div class="section-title">Step 3 — Memory Snapshots</div>
    <table>
      <thead>
        <tr><th>#</th><th>Action</th><th>Geometries</th><th>Textures</th></tr>
      </thead>
      <tbody id="mem-table"></tbody>
    </table>
  </div>

  <!-- Delta summary -->
  <div class="section" id="delta-section" style="display:none;">
    <div class="section-title">Delta Summary</div>
    <div id="delta-content" style="font-size: 12px; line-height: 1.8;"></div>
  </div>

  <!-- Live log -->
  <div class="section" style="padding:0;">
    <div class="section-title">Live Log</div>
    <div id="log"></div>
  </div>

  <div class="status-bar">
    <div class="status-dot idle" id="status-dot"></div>
    <span id="status-text">Idle — select a scenario to begin</span>
  </div>
</div>

<!-- Three.js via CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ═══════════════════════════════════════════
// THREE.JIS CLEANUP UTILITY (bundled for browser)
// ═══════════════════════════════════════════

const CleanupUtil = (() => {
  // Capture current renderer memory counters
  function takeMemorySnapshot(renderer) {
    const info = renderer.info || {};
    return {
      geometries: info.memory.geometries || 0,
      textures: info.memory.textures || 0,
    };
  }

  function disposeTexture(texture) {
    if (!texture || texture.disposed) return;
    texture.dispose();
  }

  function disposeMaterialTextures(material) {
    if (!material) return;
    for (const key of Object.keys(material)) {
      const value = material[key];
      if (value && value.isTexture) {
        disposeTexture(value);
        material[key] = null;
      }
    }
    // ShaderMaterial uniforms
    if (material.uniforms) {
      for (const uKey of Object.keys(material.uniforms)) {
        const uv = material.uniforms[uKey]?.value;
        if (uv && uv.isTexture) {
          disposeTexture(uv);
          material.uniforms[uKey] = { value: null };
        }
      }
    }
  }

  function disposeMaterial(material) {
    if (Array.isArray(material)) {
      material.forEach(disposeMaterial);
    } else {
      disposeMaterialTextures(material);
      material.dispose();
    }
  }

  function disposeGeometry(geometry) {
    if (!geometry || geometry.disposed) return;
    // Clear attribute buffers
    Object.values(geometry.attributes).forEach((attr) => {
      try { attr.array = new Float32Array(0); } catch {}
      try { attr.dispose?.(); } catch {}
    });
    if (geometry.index) {
      try { geometry.index.array = new Int16Array(0); } catch {}
      try { geometry.index.dispose?.(); } catch {}
    }
    try { geometry.clearGroups?.(); } catch {}
    geometry.dispose();
  }

  function disposeObject(object) {
    if (!object) return;
    // Dispose materials + textures
    if (object.isMesh || object.isLineBasicMaterial || object.isPoints) {
      const mesh = object;
      if (mesh.material) disposeMaterial(mesh.material);
    }
    // Dispose children
    while (object.children.length > 0) {
      const child = object.children[0];
      disposeObject(child);
      object.remove(child);
    }
  }

  function disposeRenderTarget(rt) {
    if (!rt || rt.disposed) return;
    if (rt.texture) disposeTexture(rt.texture);
    rt.dispose();
  }

  function disposeComposer(composer) {
    if (!composer) return;
    composer.passes.forEach(pass => {
      try { disposeRenderTarget(pass.renderTarget); } catch {}
      try {
        if (pass.material) disposeMaterial(pass.material);
      } catch {}
      try { pass.dispose?.(); } catch {}
    });
    composer.dispose();
  }

  /**
   * Main destroy function
   */
  function destroyScene(scene, renderer) {
    const before = takeMemorySnapshot(renderer);
    log(`Captured pre-cleanup snapshot — ${before.geometries} geo, ${before.textures} tex`, 'info');

    // ── 1. Traverse scene graph ──
    scene.traverse(obj => {
      // Geometries
      if (obj.isMesh && obj.geometry) {
        disposeGeometry(obj.geometry);
        obj.geometry = null;
      }
      if ((obj.isLineSegments || obj.isLine || obj.isPoints) && obj.geometry) {
        disposeGeometry(obj.geometry);
        obj.geometry = null;
      }
      if (obj.isSkinnedMesh && obj.skeleton) {
        try { obj.skeleton.dispose(); } catch {}
        obj.skeleton = null;
      }
      // Materials on every object
      if (obj.material) disposeMaterial(obj.material);
    });

    // ── 2. Remove all children ──
    while (scene.children.length > 0) {
      scene.remove(scene.children[0]);
    }

    // ── 3. Dispose renderer ──
    try { renderer.dispose(); } catch {}

    // Force context loss (WebGL2)
    try {
      const ext = renderer.getContext().getExtension('WEBGL_lose_context');
      ext?.loseContext();
    } catch {}

    return before;
  }

  return { takeMemorySnapshot, destroyScene };
})();

// ═══════════════════════════════════════════
// DEMO APPLICATION
// ═══════════════════════════════════════════

let renderer, scene, camera, clock;
let trackerSnapshots = [];
let selectedScenario = null;
let isBuilt = false;

// DOM refs
const container = document.getElementById('canvas-container');
const memTable  = document.getElementById('mem-table');
const deltaSection = document.getElementById('delta-section');
const deltaContent = document.getElementById('delta-content');
const logEl = document.getElementById('log');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const btnBuild = document.getElementById('btn-build');
const btnDestroy = document.getElementById('btn-destroy');
const btnGC = document.getElementById('btn-gc');

function setStatus(text, state = 'active') {
  statusText.textContent = text;
  statusDot.className = `status-dot ${state === 'idle' ? 'idle' : ''}`;
}

function log(msg, type = '') {
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = `log-entry ${type}`;
  div.innerHTML = `<span class="time">${time}</span>${msg}`;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function addTableRow(idx, action, geo, tex) {
  const row = document.createElement('tr');
  row.innerHTML = `
    <td>${idx}</td>
    <td>${action}</td>
    <td class="${geo >= 0 ? 'val-neutral' : 'val-up'}">${geo}</td>
    <td class="${tex >= 0 ? 'val-neutral' : 'val-up'}">${tex}</td>
  `;
  memTable.appendChild(row);
}

function updateDelta() {
  if (trackerSnapshots.length < 2) { deltaSection.style.display = 'none'; return; }
  const first = trackerSnapshots[0];
  const last = trackerSnapshots[trackerSnapshots.length - 1];
  const dGeo = trackerSnapshots.length >= 3 ? last.geometries - trackerSnapshots[1].geometries : 0;
  const dTex = trackerSnapshots.length >= 3 ? last.textures - trackerSnapshots[1].textures : 0;
  deltaSection.style.display = '';
  const signG = dGeo >= 0 ? '+' : '';
  const signT = dTex >= 0 ? '+' : '';
  deltaContent.innerHTML = `
    <div>Δ Geometries: <span class="${dGeo <= 0 ? 'val-down' : 'val-up'}">${signG}${dGeo}</span></div>
    <div>Δ Textures:   <span class="${dTex <= 0 ? 'val-down' : 'val-up'}">${signT}${dTex}</span></div>
    <div style="margin-top:4px;color:#8b949e;">
      (Changes measured between "After build" and "After GC")
    </div>
  `;
}

function sample(label) {
  const snap = CleanupUtil.takeMemorySnapshot(renderer);
  trackerSnapshots.push({ label, ...snap });
  addTableRow(trackerSnapshots.length, label, snap.geometries, snap.textures);
  updateDelta();
  return snap;
}

function selectScenario(name) {
  selectedScenario = name;
  document.querySelectorAll('.scenario-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.scenario === name);
  });
  log(`Selected scenario: ${name}`, 'info');
  resetDemo();
}

function resetDemo() {
  // Clean up any existing renderer/canvas
  if (renderer) {
    try { renderer.dispose(); } catch {}
    const ext = renderer.getContext()?.getExtension?.('WEBGL_lose_context');
    ext?.loseContext();
  }
  container.innerHTML = '';
  memTable.innerHTML = '';
  deltaSection.style.display = 'none';
  trackerSnapshots = [];
  isBuilt = false;
  btnBuild.disabled = false;
  btnDestroy.disabled = true;
  btnGC.disabled = true;
  setStatus(selectedScenario ? 'Ready — press Build Scene' : 'Idle — select a scenario to begin', 'idle');
}

// ─── Texture generation helpers ───────────

function generateCanvasTexture(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  fn(ctx, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function noiseTexture(baseR, baseG, baseB) {
  return generateCanvasTexture(256, 256, (ctx, w, h) => {
    const imgData = ctx.createImageData(w, h);
    for (let i = 0; i < imgData.data.length; i += 4) {
      const n = Math.random() * 40 - 20;
      imgData.data[i]     = Math.max(0, Math.min(255, baseR + n));
      imgData.data[i + 1] = Math.max(0, Math.min(255, baseG + n));
      imgData.data[i + 2] = Math.max(0, Math.min(255, baseB + n));
      imgData.data[i + 3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
  });
}

// ─── Scenario builders ────────────────────

function buildBasic(scn) {
  // A handful of different geometric primitives
  const shapes = [
    () => new THREE.BoxGeometry(1, 1, 1),
    () => new THREE.SphereGeometry(0.7, 24, 24),
    () => new THREE.CylinderGeometry(0.4, 0.4, 1.5, 16),
    () => new THREE.ConeGeometry(0.5, 1.2, 8),
    () => new THREE.TorusGeometry(0.6, 0.2, 12, 24),
    () => new THREE.IcosahedronGeometry(0.6, 0),
    () => new THREE.TetrahedronGeometry(0.7, 0),
    () => new THREE.OctahedronGeometry(0.5, 0),
  ];
  const colors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8e6cf, 0xdda0dd, 0xff8c69, 0x98d8c8, 0xf7dc6f];
  shapes.forEach((fn, i) => {
    const geo = fn();
    const mat = new THREE.MeshStandardMaterial({
      map: noiseTexture(100 + i * 20, 80 + i * 15, 60 + i * 10),
      roughness: 0.3 + i * 0.05,
      metalness: i % 3 === 0 ? 0.8 : 0.2,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(Math.cos(i * 0.8) * 3, Math.sin(i * 0.5) * 1.5, Math.sin(i * 0.8) * 3);
    mesh.castShadow = true;
    scn.add(mesh);
  });
}

function buildMedium(scn) {
  buildBasic(scn);
  // Multiple lights with shadow maps
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(5, 10, 5);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  scn.add(dirLight);
  scn.add(new THREE.AmbientLight(0xffffff, 0.4));

  for (let i = 0; i < 4; i++) {
    const pl = new THREE.PointLight(0xff4444, 0.6, 15);
    pl.position.set(Math.cos(i * 1.5) * 4, 3, Math.sin(i * 1.5) * 4);
    pl.castShadow = true;
    scn.add(pl);
  }
}

function buildHeavy(scn) {
  buildMedium(scn);

  // InstancedMesh — 60 instances, shared geometry but heavy draw call count
  const instGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
  const instMat = new THREE.MeshStandardMaterial({
    map: noiseTexture(120, 80, 200),
    normalMap: noiseTexture(200, 200, 255),
    roughnessMap: noiseTexture(100, 100, 100),
    metalness: 0.7,
  });
  const imesh = new THREE.InstancedMesh(instGeo, instMat, 60);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < 60; i++) {
    dummy.position.set(
      (Math.random() - 0.5) * 14,
      Math.random() * 4,
      (Math.random() - 0.5) * 14
    );
    dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    dummy.scale.setScalar(0.3 + Math.random() * 0.7);
    dummy.updateMatrix();
    imesh.setMatrixAt(i, dummy.matrix);
  }
  scn.add(imesh);

  // Custom shader with uniform textures
  const shaderMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uA: { value: noiseTexture(255, 50, 50) },
      uB: { value: noiseTexture(50, 50, 255) },
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `uniform sampler2D uA, uB; uniform float uTime; varying vec2 vUv;
      void main(){
        vec2 p = vUv * 10.0 + uTime;
        float v = sin(p.x) * cos(p.y) * 0.5 + 0.5;
        gl_FragColor = mix(texture2D(uA, vUv), texture2D(uB, vUv), v);
      }`,
  });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), shaderMat);
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -1.5;
  scn.add(plane);

  // Nested groups
  const outer = new THREE.Group();
  const inner = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    inner.add(new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff })));
  }
  outer.add(inner);
  scn.add(outer);
}

function buildExtreme(scn) {
  buildHeavy(scn);

  // Many unique geometries in various sizes
  const builders = [
    () => new THREE.TorusKnotGeometry(0.5, 0.15, 64, 16),
    () => new THREE.DodecahedronGeometry(0.6),
    () => new THREE.IcosahedronGeometry(0.5, 2),
    () => new THREE.CylinderGeometry(0.3, 0.8, 1.5, 12),
    () => new THREE.RingGeometry(0.3, 0.8, 24),
    () => new THREE.CircleGeometry(0.5, 32),
  ];

  for (let i = 0; i < 30; i++) {
    const geoFn = builders[i % builders.length];
    const geo = geoFn();
    const color = new THREE.Color().setHSL(Math.random(), 0.7, 0.5);
    const hasTex = Math.random() > 0.3;
    const mat = new THREE.MeshStandardMaterial({
      color,
      ...(hasTex ? {
        map: noiseTexture(
          Math.floor(Math.random() * 255),
          Math.floor(Math.random() * 200),
          Math.floor(Math.random() * 150)
        ),
      } : {}),
      wireframe: i % 5 === 0,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      (Math.random() - 0.5) * 12,
      (Math.random() - 0.5) * 8,
      (Math.random() - 0.5) * 12
    );
    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    mesh.castShadow = true;
    scn.add(mesh);
  }

  // Extra lights
  for (let i = 0; i < 5; i++) {
    const sl = new THREE.SpotLight([0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff][i], 0.4, 20, Math.PI / 6);
    sl.position.set((Math.random() - 0.5) * 10, 8, (Math.random() - 0.5) * 10);
    sl.castShadow = true;
    scn.add(sl);
  }
}

const scenarioBuilders = { basic: buildBasic, medium: buildMedium, heavy: buildHeavy, extreme: buildExtreme };

// ─── Main actions ─────────────────────────

function buildScene() {
  if (!selectedScenario) {
    setStatus('⚠ Please select a scenario first', 'idle');
    log('No scenario selected!', 'error');
    return;
  }
  if (isBuilt) {
    setStatus('Already built — click Destroy first', 'idle');
    log('Scene already built. Destroy it first.', 'warn');
    return;
  }

  log(`Building "${selectedScenario}" scenario…`, 'info');
  setStatus('Building…');

  // Init renderer
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  container.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0f);

  camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(0, 4, 10);
  camera.lookAt(0, 0, 0);

  clock = new THREE.Clock();

  // Sample initial
  const s0 = sample('Initial (empty renderer)');
  log(`Empty renderer baseline: ${s0.geometries} geo, ${s0.textures} tex`, 'info');

  // Build
  const builder = scenarioBuilders[selectedScenario];
  builder(scene);

  const s1 = sample(`After build (${selectedScenario})`);
  log(`Built: ${s1.geometries} geo, ${s1.textures} tex`, 'ok');
  isBuilt = true;

  btnBuild.disabled = true;
  btnDestroy.disabled = false;
  setStatus(`${selectedScenario.toUpperCase()} built — ready to destroy`);
}

async function destroySceneAction() {
  if (!isBuilt || !scene || !renderer) return;

  log('Destroying scene & disposing renderer…', 'warn');
  setStatus('Destroying…');

  const before = CleanupUtil.destroyScene(scene, renderer);
  const s2 = sample('After destroyScene');
  log(`Destroyed — ${s2.geometries} geo, ${s2.textures} tex`, 'ok');

  isBuilt = false;
  btnBuild.disabled = false;
  btnDestroy.disabled = true;
  btnGC.disabled = false;
  setStatus('Destroyed — run GC to reclaim memory');
}

async function runGC() {
  log('Forcing garbage collection…', 'info');
  setStatus('Running GC…');
  await new Promise(r => setTimeout(r, 300));

  // In browsers we can't truly force GC, so we sample again after a pause
  // If running Chrome --expose-gc, this would work:
  try {
    if (window.gc) window.gc();
    log('Called window.gc()', 'info');
  } catch {
    log('window.gc() not available — run Chrome with --expose-gc flag', 'warn');
  }

  await new Promise(r => setTimeout(r, 200));
  const s3 = sample('After forced GC');
  log(`GC complete — ${s3.geometries} geo, ${s3.textures} tex`, 'ok');

  btnGC.disabled = true;
  updateDelta();

  // Report
  const firstBuilt = trackerSnapshots.find(s => s.label.includes('After build'));
  if (firstBuilt && s3.geometries <= firstBuilt.geometries && s3.textures <= firstBuilt.textures) {
    log('✅ All WebGL resources successfully released!', 'ok');
    setStatus('Clean — all resources freed ✓', 'idle');
  } else {
    log('⚠ Some resources may remain unreleased. Review above.', 'warn');
    setStatus('Review required — possible leak detected', 'idle');
  }
}

// Bind global functions
window.selectScenario = selectScenario;
window.buildScene = buildScene;
window.destroyScene = destroySceneAction;
window.runGC = runGC;

// Handle resize
window.addEventListener('resize', () => {
  if (renderer && camera) {
    renderer.setSize(container.clientWidth, container.clientHeight);
    camera.aspect = container.clientWidth / container.innerHeight;
    camera.updateProjectionMatrix();
  }
});

setStatus('Idle — select a scenario to begin', 'idle');
</script>
