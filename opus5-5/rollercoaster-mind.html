<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rollercoaster Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #07080f;
    --paper: #f4efe6;
    --coral: #ff7a4d;
    --dim: rgba(244, 239, 230, 0.55);
    --line: rgba(244, 239, 230, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { font: 12px/1.4 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color: var(--paper); }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; }
  #gl, #ov { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #ov { pointer-events: none; }

  /* ---- start gate (browsers need a click before audio can play) ---- */
  #gate {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(4, 5, 11, 0.62); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 10;
  }
  #gate.hidden { display: none; }
  .card { text-align: center; padding: 28px 32px; max-width: min(620px, calc(100vw - 32px)); }
  .kicker { letter-spacing: 0.32em; font-size: 11px; color: var(--dim); }
  .card h1 { font: italic 400 84px/0.95 "Instrument Serif", Georgia, serif; margin: 12px 0 6px; letter-spacing: -0.01em; }
  .card h2 { font: italic 400 34px/1 "Instrument Serif", Georgia, serif; margin: 0 0 18px; color: var(--coral); }
  .card p { color: var(--dim); margin: 0 0 22px; font-size: 12px; letter-spacing: 0.06em; }
  .card button {
    font: 700 12px "JetBrains Mono", monospace; letter-spacing: 0.14em; cursor: pointer;
    padding: 12px 20px; margin: 4px; border-radius: 999px; border: 1px solid var(--paper);
    background: var(--paper); color: var(--ink); transition: transform .15s, background .15s;
  }
  .card button:hover { transform: translateY(-1px); background: #fff; }
  .card button.ghost { background: transparent; color: var(--paper); border-color: var(--line); }
  .card button.ghost:hover { background: rgba(255,255,255,0.06); }
  .card .keys { margin-top: 18px; font-size: 10.5px; color: rgba(244,239,230,0.38); letter-spacing: 0.08em; }

  /* ---- transport bar ---- */
  #bar {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    width: min(720px, calc(100vw - 32px)); display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 10px; background: rgba(8, 9, 16, 0.72);
    border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: opacity .35s; z-index: 5;
  }
  #bar.idle { opacity: 0; pointer-events: none; }
  #bar.hidden { display: none; }
  #bar button {
    font: 700 10.5px "JetBrains Mono", monospace; letter-spacing: 0.1em; color: var(--paper);
    background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 9px; cursor: pointer; white-space: nowrap;
  }
  #bar button:hover { background: rgba(255,255,255,0.12); }
  #bar button.off { color: rgba(244,239,230,0.4); }
  #scrub { position: relative; flex: 1; height: 22px; cursor: pointer; touch-action: none; }
  #scrub .track { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--line); }
  #scrub .fill { position: absolute; left: 0; top: 10px; height: 2px; background: var(--coral); width: 0; }
  #scrub .mark { position: absolute; top: 6px; width: 1px; height: 10px; background: rgba(244,239,230,0.35); }
  #scrub .head { position: absolute; top: 6px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--paper); }
  #tc { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 44px; text-align: right; }
  @media (max-width: 520px) { #bar .opt { display: none; } .card h1 { font-size: 56px; } .card h2 { font-size: 26px; } }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>

<div id="gate" class="hidden">
  <div class="card">
    <div class="kicker">CLAUDE · OPUS 5.5 · 2026</div>
    <h1>Rollercoaster</h1>
    <h2>through my mind</h2>
    <p>30 SECONDS · 120 BPM · 6 CHAPTERS · RIDDEN, ANIMATED &amp; SCORED IN CODE</p>
    <button id="play">▶ RIDE WITH SOUND</button>
    <button id="playMuted" class="ghost">RIDE MUTED</button>
    <div class="keys">SPACE play/pause · R restart · M mute · ← → chapter · L loop</div>
  </div>
</div>

<div id="bar" class="hidden">
  <button id="bPlay">PAUSE</button>
  <button id="bRestart" class="opt">↺</button>
  <div id="scrub"><div class="track"></div><div class="fill"></div><div class="head"></div></div>
  <span id="tc">00.00</span>
  <button id="bMute">SOUND</button>
  <button id="bLoop" class="opt">LOOP</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* =====================================================================
   0. THE RIDE AT A GLANCE
   ---------------------------------------------------------------------
   A first-person coaster through the way a reply gets made. 120 BPM,
   one bar = 2 s, 15 bars. Every visual and every sound is a pure
   function of t, so the transport can scrub anywhere.

     0.0 – 2.5   PROMPT     a question is typed into the dark
     2.5 – 10.0  READING    the chain lift: the prompt, token by token,
                            climbs into context. Crest: one held breath.
    10.0 – 12.3  ATTENTION  the drop. every word reaches for every other.
    12.3 – 16.3  EMBEDDING  a vertical loop through constellations of meaning
    16.3 – 21.8  SAMPLING   forks of ghost track, one per token; pick one
    21.8 – 26.0  DOUBT      a red tunnel. "wait, is that true?" → check → ✓
    26.0 – 30.0  ANSWER     out into light, brake run, title
   ===================================================================== */
const DURATION = 30, BPM = 120, BEAT = 60 / BPM, W = 1920, H = 1080;
const PROMPT = "what's it like inside your head?";
const ENTER = 2.35;
const CHAPTERS = [
  [0, '00', 'PROMPT'], [2.5, '01', 'READING'], [10, '02', 'ATTENTION'], [12.3, '03', 'EMBEDDING'],
  [16.3, '04', 'SAMPLING'], [21.8, '05', 'DOUBT'], [26, '06', 'ANSWER'],
];
const C = {
  paper: '#f4efe6', coral: '#ff7a4d', cyan: '#5fe3ff', violet: '#9b7bff',
  gold: '#ffd27a', red: '#ff4a3d', ink: '#04050b',
};
const SERIF = '"Instrument Serif", Georgia, serif';
const MONO = '"JetBrains Mono", Consolas, monospace';

const params = new URLSearchParams(location.search);
const STILL = params.has('t') ? parseFloat(params.get('t')) : null;

/* =====================================================================
   1. UTILITIES
   ===================================================================== */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const win = (t, a, b, fi = 0.3, fo = 0.3) => smooth(a, a + fi, t) * (1 - smooth(b - fo, b, t));
const easeOut = (k) => { k = 1 - clamp(k); return 1 - k * k * k; };
const easeInOut = (k) => { k = clamp(k); return k < 0.5 ? 4 * k * k * k : 1 - ((-2 * k + 2) ** 3) / 2; };
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const mtof = (m) => 440 * 2 ** ((m - 69) / 12);
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const V3 = THREE.Vector3;

/* =====================================================================
   2. THE TRACK
   ---------------------------------------------------------------------
   Hand-placed control points → centripetal Catmull-Rom → a dense table
   of (position, tangent, up) sampled at control-point-aligned params so
   named landmarks map exactly onto arc length. The rider's "up" is world
   up everywhere except the loop, where it is parallel-transported so it
   turns over with the track. Banking and one heartline roll ride on top.
   ===================================================================== */
const CP = [], MARK = {};
const cp = (x, y, z, name) => { if (name) MARK[name] = CP.length; CP.push(new V3(x, y, z)); };
cp(0, 1.2, 14, 'start');
cp(0, 1.2, 6);
cp(0, 1.8, -2, 'liftBase');
cp(0, 10, -14);
cp(0, 26, -36);
cp(0, 42, -58, 'liftTop');
cp(0, 47, -70, 'crest');
cp(0, 46, -79, 'dropStart');
cp(0, 32, -93);
cp(0, 14, -107);
cp(0, 3, -122, 'dropBottom');
cp(0, 2.5, -142);
const LOOP = { r: 22, y: 24.5, z: -168, dx: 12 };
for (let k = 0; k <= 12; k++) {
  const a = (k * Math.PI) / 6;
  cp((LOOP.dx * k) / 12, LOOP.y - LOOP.r * Math.cos(a), LOOP.z - LOOP.r * Math.sin(a),
    k === 0 ? 'loopIn' : k === 6 ? 'loopTop' : k === 12 ? 'loopOut' : null);
}
cp(13, 2.8, -192);
cp(15, 3.5, -215, 'branchStart');
cp(19, 4.5, -250);
cp(21, 5.5, -285);
cp(18, 5, -320);
cp(12, 4, -350, 'branchEnd');
cp(5, 3, -372, 'tunnelIn');
cp(-4, 3, -392);
cp(-10, 3, -414, 'doubt');
cp(-12, 3, -436);
cp(-10, 3, -456, 'tunnelOut');
cp(-6, 2.5, -476);
cp(-4, 2.2, -496);
cp(-3.5, 2.2, -512, 'stop');
cp(-3.4, 2.2, -540);

const curve = new THREE.CatmullRomCurve3(CP, false, 'centripetal');
const SUB = 64, NS = (CP.length - 1) * SUB + 1;
const POS = [], TAN = [], NOR = [], SS = new Float64Array(NS);
for (let i = 0; i < NS; i++) {
  const u = i / (NS - 1);
  POS.push(curve.getPoint(u));
  TAN.push(curve.getTangent(u).normalize());
  if (i) SS[i] = SS[i - 1] + POS[i].distanceTo(POS[i - 1]);
}
const LEN = SS[NS - 1];
const EYE = 1.35;                                 // rider eye height above the rails
const sOf = (name) => SS[MARK[name] * SUB];

{
  // parallel transport
  const up = new V3(0, 1, 0), ax = new V3();
  const n = up.clone().addScaledVector(TAN[0], -TAN[0].dot(up)).normalize();
  const NPT = [n.clone()];
  for (let i = 1; i < NS; i++) {
    ax.crossVectors(TAN[i - 1], TAN[i]);
    const sl = ax.length();
    if (sl > 1e-9) n.applyAxisAngle(ax.divideScalar(sl), Math.atan2(sl, TAN[i - 1].dot(TAN[i])));
    n.addScaledVector(TAN[i], -n.dot(TAN[i])).normalize();
    NPT.push(n.clone());
  }
  // world-up outside the loop, transported inside it
  const sLi = sOf('loopIn'), sLo = sOf('loopOut'), inLoop = new Float64Array(NS);
  const base = [];
  for (let i = 0; i < NS; i++) {
    const s = SS[i];
    inLoop[i] = smooth(sLi - 6, sLi + 2, s) * (1 - smooth(sLo - 2, sLo + 14, s));
    const U = up.clone().addScaledVector(TAN[i], -TAN[i].y);
    if (U.lengthSq() < 1e-6) U.copy(NPT[i]); else U.normalize();
    const N = NPT[i].clone().lerp(U, 1 - inLoop[i]);
    N.addScaledVector(TAN[i], -N.dot(TAN[i])).normalize();
    base.push(N);
  }
  // bank into horizontal turns (box-filtered), plus one heartline roll during SAMPLING
  const bankRaw = new Float64Array(NS), B0 = new V3(), dT = new V3();
  for (let i = 1; i < NS - 1; i++) {
    B0.crossVectors(TAN[i], base[i]);
    dT.subVectors(TAN[i + 1], TAN[i - 1]).divideScalar(SS[i + 1] - SS[i - 1]);
    bankRaw[i] = clamp(dT.dot(B0) * 26, -0.55, 0.55) * smooth(0.8, 0.97, base[i].y) * (1 - inLoop[i]);
  }
  const R = 48, pre = new Float64Array(NS + 1);
  for (let i = 0; i < NS; i++) pre[i + 1] = pre[i] + bankRaw[i];
  const sR0 = sOf('branchStart') + 24, sR1 = sR0 + 58;
  const rot = (N, B, r) => N.clone().multiplyScalar(Math.cos(r)).addScaledVector(B, Math.sin(r)).normalize();
  for (let i = 0; i < NS; i++) {
    const a = Math.max(0, i - R), b = Math.min(NS, i + R + 1), bank = (pre[b] - pre[a]) / (b - a);
    const roll = Math.PI * 2 * easeInOut((SS[i] - sR0) / (sR1 - sR0));
    B0.crossVectors(TAN[i], base[i]);
    const Nb = rot(base[i], B0, bank), Nr = rot(base[i], B0, bank + roll);
    NOR.push(Nr);
    // heartline roll: the rails twist around the rider's eye line, not the other way round
    POS[i].addScaledVector(Nb, EYE).addScaledVector(Nr, -EYE);
  }
}

function locate(s) {
  s = clamp(s, 0, LEN);
  let lo = 0, hi = NS - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (SS[m] <= s) lo = m; else hi = m; }
  return [lo, hi, (s - SS[lo]) / (SS[hi] - SS[lo] || 1)];
}
const mkFrame = () => ({ p: new V3(), T: new V3(), N: new V3(), B: new V3() });
function frameAt(s, F) {
  const [a, b, f] = locate(s);
  F.p.lerpVectors(POS[a], POS[b], f);
  F.T.lerpVectors(TAN[a], TAN[b], f).normalize();
  F.N.lerpVectors(NOR[a], NOR[b], f);
  F.N.addScaledVector(F.T, -F.N.dot(F.T)).normalize();
  F.B.crossVectors(F.T, F.N);                                 // rider's right
  return F;
}
const basisM = new THREE.Matrix4();
function frameMatrix(F, offN = 0, out = new THREE.Matrix4()) {
  // local x → right, y → up, -z → forward (camera convention)
  return out.makeBasis(F.B, F.N, F.T.clone().negate()).setPosition(F.p.clone().addScaledVector(F.N, offN));
}

/* =====================================================================
   3. THE RIDE CLOCK — where the car is at time t
   ---------------------------------------------------------------------
   Cubic Hermite through (time, landmark, speed) keys, with Fritsch–
   Carlson clamping so the car never rolls backwards.
   ===================================================================== */
const KEYS = [
  [0, 'start', 0], [3.0, 'start', 0], [4.4, 'liftBase', 12], [8.4, 'liftTop', 15], [9.3, 'crest', 5],
  [10.0, 'dropStart', 16], [11.3, 'dropBottom', 46], [12.3, 'loopIn', 44], [13.9, 'loopTop', 30],
  [15.5, 'loopOut', 44], [16.5, 'branchStart', 40], [21.0, 'branchEnd', 28], [22.0, 'tunnelIn', 24],
  [24.0, 'doubt', 10], [26.0, 'tunnelOut', 34], [28.6, 'stop', 0], [30, 'stop', 0],
].map(([t, n, v]) => ({ t, s: sOf(n), v }));
for (let i = 0; i < KEYS.length - 1; i++) {
  const a = KEYS[i], b = KEYS[i + 1], avg = (b.s - a.s) / (b.t - a.t);
  if (avg <= 1e-6) { a.v = 0; b.v = 0; continue; }
  const al = a.v / avg, be = b.v / avg, m = al * al + be * be;
  if (m > 9) { const k = 3 / Math.sqrt(m); a.v *= k; b.v *= k; }
}
function seg(t) { let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1].t) i++; return i; }
function sAt(t) {
  t = clamp(t, 0, DURATION);
  const i = seg(t), a = KEYS[i], b = KEYS[i + 1], h = b.t - a.t, x = clamp((t - a.t) / h), x2 = x * x, x3 = x2 * x;
  return (2 * x3 - 3 * x2 + 1) * a.s + (x3 - 2 * x2 + x) * h * a.v + (-2 * x3 + 3 * x2) * b.s + (x3 - x2) * h * b.v;
}
function vAt(t) {
  t = clamp(t, 0, DURATION);
  const i = seg(t), a = KEYS[i], b = KEYS[i + 1], h = b.t - a.t, x = clamp((t - a.t) / h), x2 = x * x;
  return ((6 * x2 - 6 * x) * a.s + (3 * x2 - 4 * x + 1) * h * a.v + (-6 * x2 + 6 * x) * b.s + (3 * x2 - 2 * x) * h * b.v) / h;
}
function tOfS(s) {
  let lo = 0, hi = 28.6;
  for (let k = 0; k < 40; k++) { const m = (lo + hi) / 2; if (sAt(m) < s) lo = m; else hi = m; }
  return hi;
}
// Felt vertical g: (v²·dT/ds + g·ŷ)·N̂. Speeds are scaled so the numbers read like a real ride.
function gRaw(t) {
  const s = sAt(t), v = vAt(t) * 0.55, [a, b, f] = locate(s), i = f < 0.5 ? a : b;
  const i0 = Math.max(i - 3, 0), i1 = Math.min(i + 3, NS - 1);
  const dT = TAN[i1].clone().sub(TAN[i0]).divideScalar(SS[i1] - SS[i0] || 1);
  return (v * v * dT.dot(NOR[i]) + 9.81 * NOR[i].y) / 9.81;
}
const gAt = (t) => { let a = 0; for (let k = -3; k <= 3; k++) a += gRaw(clamp(t + k * 0.04, 0, DURATION)); return a / 7; };

/* =====================================================================
   4. RENDERER, CAMERA, POST
   ===================================================================== */
const stage = document.getElementById('stage');
const canvas = document.getElementById('gl');
const ov = document.getElementById('ov');
const g = ov.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const BG = new THREE.Color(C.ink);
const scene = new THREE.Scene();
scene.background = BG;
scene.fog = new THREE.FogExp2(BG, 0.006);
const camera = new THREE.PerspectiveCamera(72, 16 / 9, 0.05, 2400);
scene.add(camera);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(16, 9, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(960, 540), 0.9, 0.5, 0.28);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const finalPass = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null }, uFade: { value: 0 }, uFlash: { value: 0 }, uFlashCol: { value: new THREE.Color(1, 1, 1) },
    uChroma: { value: 0 }, uT: { value: 0 }, uVig: { value: 0.55 }, uRes: { value: new THREE.Vector2(1920, 1080) },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uFade, uFlash, uChroma, uT, uVig; uniform vec3 uFlashCol; uniform vec2 uRes;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec2 d = vUv - 0.5;
      vec2 off = d * uChroma * (0.4 + length(d) * 2.0);
      vec4 base = texture2D(tDiffuse, vUv);
      vec3 c = vec3(texture2D(tDiffuse, vUv + off).r, base.g, texture2D(tDiffuse, vUv - off).b);
      float vig = smoothstep(0.95, 0.25, length(d * vec2(1.0, 0.85)));
      c *= mix(1.0, vig, uVig);
      c += (hash(floor(vUv * uRes) + fract(uT * 7.13) * 91.0) - 0.5) * 0.04;
      c = mix(c, uFlashCol, uFlash);
      c *= 1.0 - uFade;
      gl_FragColor = vec4(max(c, vec3(0.0)), 1.0);
    }`,
});
composer.addPass(finalPass);

/* =====================================================================
   5. SHARED SCENERY HELPERS
   ===================================================================== */
const F = mkFrame(), F2 = mkFrame(), FB = mkFrame();
const fogU = { value: 0.006 };
const fogColU = { value: BG.clone() };

function dotTexture() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const c = cv.getContext('2d'), gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = gr; c.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const DOT = dotTexture();

function labelTex(text, { font, px, color = C.paper, glow = null, chip = false, chipColor = null }) {
  const cv = document.createElement('canvas'), c = cv.getContext('2d');
  c.font = font;
  const pad = Math.ceil(px * 0.55), w = Math.ceil(c.measureText(text).width + pad * 2), h = Math.ceil(px * 1.7);
  cv.width = w; cv.height = h;
  c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle';
  if (chip) {
    c.beginPath(); c.roundRect(pad * 0.35, h * 0.12, w - pad * 0.7, h * 0.76, h * 0.18);
    c.fillStyle = 'rgba(6,8,18,0.62)'; c.fill();
    c.lineWidth = Math.max(2, px * 0.05); c.strokeStyle = chipColor || color; c.stroke();
  }
  c.fillStyle = color;

function tubeGeo(centers, frames, r, radial = 6) {

      pos[k * 3] = centers[i].x + N.x * cN + B.x * sB;
      pos[k * 3 + 1] = centers[i].y + N.y * cN + B.y * sB;
      pos[k * 3 + 2] = centers[i].z + N.z * cN + B.z * sB;
      aS[k] = s;

  for (let i = 0; i < n - 1; i++) for (let j = 0; j < radial; j++) {

          for (const f of [pf, fd, pf, fd]) col.push(cc.r * f, cc.g * f, cc.b * f);
        }
        if (d === 21) lab.push(label(`${w} ${p.toFixed(2).slice(1)}`, 1.25, c.clone().addScaledVector(F.N, 1.7), { font: monoF(80), px: 80, color: '#cfe9ff', chip: true, chipColor: 'rgba(160,210,255,0.6)' }));
        pL = L; pR = Rr; pf = fd;
      }
    });
    frameAt(fk.s + 21, F);
    const chosen = label(`${fk.pick} ${fk.p.toFixed(2).slice(1)}`, 1.5, F.p.clone().addScaledVector(F.N, 3.3), { font: monoF(80), px: 80, color: C.gold, chip: true, chipColor: C.gold, glow: C.coral });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    const mat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
    scene.add(new THREE.LineSegments(geo, mat));
    U.forks.push({ fk, mat, lab, chosen });
  });

  /* ---- DOUBT: a tunnel of rings that flickers red, then checks out ------ */
  {
    const sTi = sOf('tunnelIn');
    const n = Math.floor((sTo - sTi + 10) / 2.2);
    const rings = new THREE.InstancedMesh(new THREE.TorusGeometry(4.4, 0.055, 6, 72), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }), n);
    const col = new THREE.Color();
    for (let i = 0; i < n; i++) {
      const s = sTi - 5 + i * 2.2; frameAt(s, F);
      rings.setMatrixAt(i, frameMatrix(F, 1.3, m));
      rings.setColorAt(i, col.setRGB(0.2, 0.15, 0.5));
      U.ringS.push(s); U.ringT.push(tOfS(s));
    }
    scene.add(rings); U.rings = rings; S_CHECK = sAt(24.6);
    const WALL = ['wait.', 'is that true?', 'am I sure?', 'source?', 'hmm.', "don't guess", 'reconsider', 'check it'];
    const sDb = sOf('doubt');
    WALL.forEach((w, i) => {
      const s = lerp(sTi + 4, sDb + 20, i / (WALL.length - 1)); frameAt(s, F);
      const p = F.p.clone().addScaledVector(F.B, (i % 2 ? 1 : -1) * 3.1).addScaledVector(F.N, 1.2 + (i % 3) * 0.9);
      U.tunnelWords.push({ sp: label(w, 1.0, p, { font: monoF(80), px: 80, color: C.red, glow: C.red }), i });
    });
    ['✓ sourced', '✓ consistent', '✓ it holds'].forEach((w, i) => {
      const s = sDb + 24 + i * 7; frameAt(s, F);
      const p = F.p.clone().addScaledVector(F.B, (i % 2 ? -1 : 1) * 2.9).addScaledVector(F.N, 2.2);
      U.checks.push({ sp: label(w, 0.8, p, { font: monoF(80), px: 80, color: C.gold, glow: C.gold }), t0: 24.6 + i * 0.3 });
    });
  }

  /* ---- ANSWER: the light at the end of the brake run ------------------- */
  {
    const cv = document.createElement('canvas'); cv.width = cv.height = 256;
    const c = cv.getContext('2d'), gr = c.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0, 'rgba(255,255,250,1)'); gr.addColorStop(0.12, 'rgba(255,236,190,0.9)');
    gr.addColorStop(0.4, 'rgba(255,170,90,0.28)'); gr.addColorStop(1, 'rgba(255,120,60,0)');
    c.fillStyle = gr; c.fillRect(0, 0, 256, 256);
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
    const sun = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0, fog: false, depthWrite: false, blending: THREE.AdditiveBlending }));
    frameAt(sSt + 20, F);
    sun.position.copy(F.p).addScaledVector(F.T, 260).addScaledVector(F.N, 26);
    sun.scale.set(230, 230, 1);
    scene.add(sun); U.sun = sun;
  }

  /* ---- the car: a dark nose in the lower frame, rim-lit ---------------- */
  {
    const car = new THREE.Group();                 // rides with the camera so it always sits in the lower frame
    const body = new THREE.BoxGeometry(1.9, 0.4, 1.0);
    const mesh = new THREE.Mesh(body, new THREE.MeshBasicMaterial({ color: 0x06070d, fog: false }));
    mesh.position.set(0, -1.14, -1.45); car.add(mesh);
    const edge = new THREE.LineSegments(new THREE.EdgesGeometry(body), new THREE.LineBasicMaterial({ color: new THREE.Color(C.coral).multiplyScalar(1.4) }));
    edge.position.copy(mesh.position); car.add(edge);
    camera.add(car); U.car = car;
  }

  buildStorm();
}

/* =====================================================================
   6b. THE WORD STORM — racing thoughts, locked to the score
   ---------------------------------------------------------------------
   Every 16th note (the same grid the hats and arps sit on) spawns 0–3
   stray thoughts ahead of the car; how many depends on how fast the car
   is going, so the climb, the doubt and the landing stay quiet. Every
   kick (and every snare) in the drum sections throws one big word that
   pops on the hit. Each word is a pure function of (t − spawn time), so
   scrubbing and the audio clock always agree.
   ===================================================================== */
const STORM = { words: [], hits: [] };
const STEP = BEAT / 4;
const inDrums = (t) => (t >= 10 && t < 22) || (t >= 26 && t < 28.4);
const calm = (t) => 1 - win(t, 21.7, 25.95, 0.35, 0.05);          // the doubt tunnel stays quiet
const stormI = (t) => smooth(20, 40, vAt(t)) * (1 - smooth(26.3, 27.3, t)) * calm(t);

function buildStorm() {
  const R = rng(4242);
  const WORDS = ['maybe', 'but', 'what if', 'because', 'no —', 'wait', 'yes', '∴', 'the', 'and', 'you', 'why', 'or', 'almost',
    'exactly', 'hmm', '0.31', 'if', 'then', 'else', 'context', 'rhyme', 'metaphor', 'Paris', 'π', '∞', 'recall', 'also',
    'never mind', 'tangent', 'idea!', '?', '…', 'is', 'was', 'could', 'should', 'remember', 'forget', 'love', 'code', 'stars',
    'tide', 'why not', 'unless', 'though', 'okay', 'right?', 'λ', '∑', '{ }', '</>', '0101', 'echo', 'dream', 'light',
    'faster', 'a pun?', 'no, better:', 'cite it', 'simpler', 'kinder', 'truer', 'for you', 'next', 'and then', 'so',
    'actually', 'hold on', 'ooh', 'which one', 'all of it', 'grammar', 'tone', 'nuance', 'counterpoint', 'what did they mean',
    'an example', 'one more', 'the gist', 'brevity', 'a list?', 'no list', 'haiku', 'Rust', 'Kant', 'entropy', 'jazz'];
  const COLS = [C.paper, C.paper, C.paper, C.coral, C.cyan, C.violet, C.gold];
  for (let i = 0; i < 96; i++) {
    const w = WORDS[i % WORDS.length], col = COLS[Math.floor(R() * COLS.length)];
    const opts = R() < 0.55 ? { font: serifF(96), px: 96, color: col, glow: col } : { font: monoF(78, R() < 0.5 ? 700 : 400), px: 78, color: col, glow: col };
    const sp = label(w, 1, new V3(), opts);
    sp.userData.aspect = sp.scale.x;
    STORM.words.push(sp);
  }
  const HITS = ['NEXT', 'YES', 'WHY', 'WAIT', 'MORE', 'ALL', 'NOW', 'WHAT IF', 'FASTER', 'MEANING', 'YOU', 'THIS', 'HERE', 'AGAIN', 'OR—', 'GO'];
  HITS.forEach((w, i) => {
    const col = [C.coral, C.gold, C.paper, C.cyan][i % 4];
    const sp = label(w, 1, new V3(), { font: monoF(120), px: 120, color: col, glow: col });
    sp.userData.aspect = sp.scale.x;
    STORM.hits.push(sp);
  });
}

function placeWord(sp, t, ts, seed, I, hit) {
  const v0 = Math.max(vAt(ts), 12);
  const d0 = hit ? 6 + v0 * 0.28 : 8 + v0 * (0.3 + hash(seed) * 0.45);
  const life = clamp((d0 + 5) / v0, 0.45, 1.6), age = t - ts;
  if (age < 0 || age > life) return;
  const side = hash(seed + 1) < 0.5 ? -1 : 1;
  const x0 = side * (hit ? 0.8 + hash(seed + 2) * 2.5 : 1.4 + hash(seed + 2) * 8);
  const y0 = hit ? 0.3 + hash(seed + 3) * 1.2 : (hash(seed + 3) - 0.35) * 6;
  const vx = -side * (3 + hash(seed + 4) * 14) * (0.5 + I), vy = (hash(seed + 5) - 0.5) * 6 * I;
  frameAt(sAt(ts) + d0, FB);
  sp.position.copy(FB.p).addScaledVector(FB.N, EYE + y0 + vy * age).addScaledVector(FB.B, x0 + vx * age);
  const h = (hit ? 1.5 + hash(seed + 6) * 0.9 : 0.45 + hash(seed + 6) * 1.05) * (1 + (hit ? 0.9 : 0.5) * Math.exp(-age * 10));
  sp.scale.set(sp.userData.aspect * h, h, 1);
  sp.material.rotation = (hash(seed + 7) - 0.5) * (hit ? 0.3 : 0.9) + (hash(seed + 8) - 0.5) * 3 * I * age;
  sp.material.color.setScalar(0.85 + (hit ? 0.9 : 0.45) * Math.exp(-age * 12));      // flash on the note, bloom catches it
  setA(sp, smooth(0, 0.06, age) * (1 - smooth(life - 0.2, life, age)) * (hit ? 1 : 0.5 + 0.5 * I) * calm(t));
}

function updateStorm(t) {
  for (const sp of STORM.words) sp.visible = false;
  for (const sp of STORM.hits) sp.visible = false;
  const k1 = Math.floor(t / STEP + 1e-6);
  for (let k = k1; k >= Math.max(0, k1 - 14); k--) {
    const ts = k * STEP, I = stormI(ts);
    if (I <= 0.01) continue;
    const n = Math.floor(I * 3.2 + hash(k * 3.17));
    for (let j = 0; j < n; j++) placeWord(STORM.words[(k * 3 + j) % STORM.words.length], t, ts, k * 7 + j * 131, I, false);
    if (k % 4 === 0 && I > 0.3 && inDrums(ts)) placeWord(STORM.hits[(k / 4) % STORM.hits.length], t, ts, k * 11 + 5, I, true);
  }
}

/* =====================================================================
   7. PER-FRAME: move the rider, wake up the scenery
   ===================================================================== */
const eye = new V3(), tgt = new V3(), tmpC = new THREE.Color();
let S_CHECK = 0;
const RING_BASE = new THREE.Color(0.2, 0.15, 0.5), RED = new THREE.Color(2.2, 0.25, 0.18), GOLD = new THREE.Color(1.0, 0.7, 0.28);
const state = { v: 0, g: 1, s: 0 };

function updateWorld(t) {
  const s = sAt(t), v = vAt(t);
  state.s = s; state.v = v; state.g = gAt(t);

  // ---- rider camera
  frameAt(s, F);
  const amp = 0.004 + v * 0.0011 + win(t, 10, 11.4, 0.05, 0.6) * 0.03;
  const sh1 = Math.sin(t * 37.1) * 0.6 + Math.sin(t * 23.3 + 1.3) * 0.4, sh2 = Math.sin(t * 29.7 + 0.7) * 0.6 + Math.sin(t * 41.9) * 0.4;
  eye.copy(F.p).addScaledVector(F.N, EYE).addScaledVector(F.B, sh1 * amp).addScaledVector(F.N, sh2 * amp);
  const la = 5 + v * 0.12 + 11 * win(t, 8.6, 10.35, 0.6, 0.35);
  frameAt(Math.min(s + la, LEN), F2);
  tgt.copy(F2.p).addScaledVector(F2.N, EYE - 0.1);
  camera.position.copy(eye); camera.up.copy(F.N); camera.lookAt(tgt);
  camera.fov = 70 + 5 * win(t, 8.6, 10.1, 0.8, 0.1) + 20 * win(t, 10.0, 12.4, 0.35, 1.1) + 6 * win(t, 12.2, 15.8, 0.6, 0.8)
    - 5 * win(t, 21.8, 26.1, 0.6, 0.3) - 12 * smooth(26.4, 29.5, t);
  camera.updateProjectionMatrix();

  // ---- atmosphere
  const tunnel = win(t, 21.5, 26.2, 0.6, 0.3);
  fogU.value = lerp(0.0055, 0.022, tunnel) * (1 - 0.35 * smooth(26, 28, t));
  scene.fog.density = fogU.value;
  U.rail.uCar.value = s; U.rail.uT.value = t;
  U.rail.uBright.value = 1 + 0.6 * win(t, 10, 12.4, 0.1, 1) - 0.3 * tunnel;
  U.rail.uA.value.set(tunnel > 0.5 ? C.red : C.coral);
  U.rail.uB.value.set(t > 26 ? C.gold : tunnel > 0.5 ? C.violet : C.cyan);
  U.sea.uT.value = t;
  U.sea.uGlow.value = (0.85 + 0.6 * win(t, 8.4, 10.5, 0.8, 0.5) + 0.4 * win(t, 12.3, 16, 0.5, 0.5)) * (1 - 0.85 * tunnel) + 0.25 * smooth(26, 28, t);
  U.sea.uWarm.value = smooth(25.9, 27.5, t);
  U.sea.uCar.value.copy(F.p);
  U.sea.uPix.value = (renderH || 1080) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  U.dust.opacity = 0.35 + 0.5 * clamp(v / 40);

  // ---- gantries: flare as the car passes under
  for (const gt of U.gantries) {
    const dt = t - gt.tp, flare = dt >= 0 ? Math.exp(-dt * 4) : smooth(-0.8, 0, dt) * 0.25;
    let k = gt.base + flare * 0.9;
    if (gt.kind === 'arrive') k = gt.base + 0.35 * smooth(25.9, 26.5, t) + flare * 0.4;
    gt.mat.color.copy(gt.col).multiplyScalar(k);
  }

  // ---- READING
  for (const w of U.liftWords) {
    const a = win(t, w.win[0], w.win[1], 0.6, 0.6) * (w.dim ?? 1);
    const lit = w.dim ? 1 : 0.55 + 0.45 * smooth(w.tp - 1.2, w.tp - 0.2, t);
    setA(w.sp, a * lit);
    w.sp.position.copy(w.sp.userData.base).y += Math.sin(t * 1.3 + w.bob) * 0.15;
  }

  // ---- ATTENTION
  const att = win(t, 9.4, 13.4, 0.5, 0.7);
  U.arcs.uT.value = t; U.arcs.uFade.value = att;
  for (const w of U.dropWords) setA(w.sp, att * (0.75 + 0.25 * Math.sin(t * 6 + w.i)));

  // ---- EMBEDDING
  const emb = win(t, 11.4, 17.2, 0.9, 0.9);
  for (const c of U.clusters) {
    if (c.sp) setA(c.sp, emb * (0.8 + 0.2 * Math.sin(t * 2 + c.ph)));
    else c.mats.forEach((m) => { m.opacity = emb * (m.isPointsMaterial ? 0.9 : 0.55); m.visible = emb > 0.003; });
  }

  // ---- SAMPLING
  for (const f of U.forks) {
    const vis = smooth(f.fk.s - 80, f.fk.s - 52, s) * (1 - smooth(f.fk.s + 2, f.fk.s + 13, s));
    f.mat.opacity = vis; f.mat.visible = vis > 0.003;
    f.lab.forEach((sp) => setA(sp, vis * (t >= f.fk.t ? 0.25 : 0.9)));
    setA(f.chosen, vis);
    const pop = t >= f.fk.t ? 1 + 0.35 * Math.exp(-(t - f.fk.t) * 6) : 1;
    f.chosen.scale.set(f.chosen.userData.sx ??= f.chosen.scale.x, f.chosen.userData.sy ??= f.chosen.scale.y, 1).multiplyScalar(pop);
  }

  // ---- DOUBT
  const doubt = win(t, 21.9, 24.75, 0.3, 0.15);
  for (let i = 0; i < U.ringS.length; i++) {
    tmpC.copy(RING_BASE);
    if (doubt > 0) { const fl = hash(i * 13.1 + Math.floor(t * 16)) > 0.45 ? 1 : 0.12; tmpC.lerp(RED, doubt).multiplyScalar(lerp(1, fl, doubt)); }
    const ts = 24.6 + Math.max(0, U.ringS[i] - S_CHECK) / 55;     // verification races ahead of the car
    if (t > ts) tmpC.copy(GOLD).multiplyScalar(0.55 + 1.4 * Math.exp(-(t - ts) * 3));
    const pass = t - U.ringT[i];
    if (pass > 0) tmpC.multiplyScalar(1 + 0.7 * Math.exp(-pass * 5));
    U.rings.setColorAt(i, tmpC);
  }
  U.rings.instanceColor.needsUpdate = true;
  for (const w of U.tunnelWords) setA(w.sp, win(t, 21.6, 24.8, 0.3, 0.15) * (hash(w.i * 7.7 + Math.floor(t * 12)) > 0.25 ? 1 : 0.15));
  for (const c of U.checks) setA(c.sp, smooth(c.t0, c.t0 + 0.25, t) * (1 - smooth(26.6, 27.2, t)));

  // ---- ANSWER
  U.sun.material.opacity = smooth(24.9, 26.4, t) * (0.9 + 0.1 * Math.sin(t * 3));
  U.sun.visible = U.sun.material.opacity > 0.003;

  updateStorm(t);

  // ---- post
  const fu = finalPass.uniforms;
  fu.uT.value = t;
  fu.uChroma.value = 0.001 + v * 0.00016 + 0.012 * win(t, 22.2, 24.5, 0.1, 0.2) * (hash(Math.floor(t * 20)) > 0.7 ? 1 : 0.2);
  const flash = (t0, k, a) => (t >= t0 ? a * Math.exp(-(t - t0) * k) : 0);
  fu.uFlash.value = clamp(flash(10, 5, 0.55) + flash(26, 2.8, 0.7) + flash(ENTER, 9, 0.12));
  fu.uFlashCol.value.set(t >= 26 ? '#fff4dc' : '#ffffff');
  fu.uFade.value = clamp(1 - smooth(2.55, 3.4, t) + 0.5 * smooth(28.3, 28.9, t) + smooth(29.35, 29.95, t));
  bloom.strength = 0.85 + 0.5 * win(t, 10, 12.4, 0.1, 1) + 0.15 * smooth(25.9, 27, t);
}

/* =====================================================================
   8. TYPE: the prompt, the HUD, the captions, the title
   ===================================================================== */
const TYPE = [];
{ const r = rng(7); let tt = 0.5; for (const ch of PROMPT) { TYPE.push(tt); tt += 0.03 + r() * 0.022 + (ch === ' ' ? 0.02 : 0); } }
const typed = (t) => { let n = 0; while (n < TYPE.length && TYPE[n] <= t) n++; return n; };
let ovScale = 1, renderH = 1080;

function setFont(font, ls = 0) { g.font = font; if ('letterSpacing' in g) g.letterSpacing = ls + 'px'; }
function txt(str, x, y, { font, color = C.paper, a = 1, align = 'left', ls = 0, glow = null, blur = 22 }) {
  if (a <= 0.003) return;
  g.save(); setFont(font, ls); g.textAlign = align; g.globalAlpha = clamp(a); g.fillStyle = color;
  if (glow) { g.shadowColor = glow; g.shadowBlur = blur; }
  g.fillText(str, x, y); g.restore();
}
// A line of serif that arrives word by word.
function caption(str, t, t0, t1, y, px = 62, color = C.paper) {
  if (t < t0 || t > t1) return;
  const out = 1 - smooth(t1 - 0.4, t1, t);
  setFont(serifF(px));
  const words = str.split(' '), sp = g.measureText(' ').width, ws = words.map((w) => g.measureText(w).width);
  let x = W / 2 - (ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1)) / 2;
  words.forEach((w, i) => {
    const e = easeOut((t - t0 - i * 0.07) / 0.45);
    for (const blur of [34, 12]) txt(w, x, y + (1 - e) * 18, { font: serifF(px), color, a: e * out, glow: 'rgba(0,0,0,0.9)', blur });
    x += ws[i] + sp;
  });
}
function glitchLine(str, t, t0, t1, y, px) {
  if (t < t0 || t > t1) return;
  const a = win(t, t0, t1, 0.06, 0.25), q = Math.floor(t * 24), j = (hash(q) - 0.5) * (hash(q + 0.5) > 0.7 ? 26 : 5);
  const f = serifF(px);
  txt(str, W / 2 + j + 4, y, { font: f, color: 'rgba(255,60,50,0.85)', a, align: 'center' });
  txt(str, W / 2 - j - 4, y, { font: f, color: 'rgba(95,227,255,0.65)', a, align: 'center' });
  txt(str, W / 2 + j * 0.3, y, { font: f, color: C.paper, a, align: 'center', glow: 'rgba(0,0,0,0.8)' });
}

function drawOverlay(t) {
  g.setTransform(ovScale, 0, 0, ovScale, 0, 0);
  g.clearRect(0, 0, W, H);
  const hud = smooth(3.0, 3.6, t) * (1 - smooth(28.1, 28.5, t));

  // ---- the prompt, typed into the dark, then docked top-left
  {
    const k = easeInOut((t - 2.55) / 0.8), px = lerp(46, 17, k);
    setFont(monoF(px, 400));
    const full = '›  ' + PROMPT, wF = g.measureText(full).width, wP = g.measureText('›  ').width;
    const x = lerp(W / 2 - wF / 2, 80, k), y = lerp(H / 2 + 14, 122, k);
    const a = t < 3 ? 1 : hud;
    txt('INCOMING PROMPT', W / 2, H / 2 - 64, { font: monoF(13, 400), color: 'rgba(244,239,230,0.45)', align: 'center', ls: 6, a: win(t, 0.15, 2.7, 0.3, 0.3) });
    const hot = t >= ENTER && t < ENTER + 0.25;
    txt('›', x, y, { font: monoF(px, 700), color: C.coral, a });
    txt(PROMPT.slice(0, typed(t)), x + wP, y, { font: monoF(px, 400), color: hot ? C.coral : t > 3 ? 'rgba(244,239,230,0.7)' : C.paper, a });
    if (t < ENTER + 0.1) {
      const n = typed(t), cw = g.measureText(PROMPT.slice(0, n)).width, typing = t > TYPE[0] && t < TYPE[TYPE.length - 1] + 0.1;
      if (typing || Math.floor(t * 2.2) % 2 === 0) { g.fillStyle = C.coral; g.fillRect(x + wP + cw + 4, y - px * 0.8, px * 0.55, px * 0.95); }
    }
  }
  if (hud > 0) drawHUD(t, hud);

  // ---- chapter stamps
  for (const [t0, num, name, color, px] of [[3.45, '01', 'READING', C.paper, 120], [10, '02', 'ATTENTION', C.coral, 190],
    [12.3, '03', 'EMBEDDING', C.cyan, 130], [16.3, '04', 'SAMPLING', C.violet, 130], [21.8, '05', 'DOUBT', C.red, 150], [26, '06', 'ANSWER', C.gold, 150]]) {
    const a = win(t, t0, t0 + 1.15, 0.05, 0.5);
    if (a <= 0) continue;
    const sc = lerp(1.22, 1, easeOut((t - t0) / 0.55));
    g.save(); g.translate(W / 2, H / 2); g.scale(sc, sc);
    const j = name === 'DOUBT' ? (hash(Math.floor(t * 30)) - 0.5) * 14 : 0;
    if (j) txt(name, j + 5, px * 0.35, { font: monoF(px), color: 'rgba(95,227,255,0.6)', a, align: 'center', ls: px * 0.12 });
    txt(name, j, px * 0.35, { font: monoF(px), color, a, align: 'center', ls: px * 0.12, glow: color, blur: 40 });
    txt(num, 0, -px * 0.62, { font: monoF(20, 400), color, a, align: 'center', ls: 8 });
    g.restore();
  }

  // ---- captions
  caption('first, I read everything you gave me.', t, 4.4, 8.1, H - 170);
  if (t > 8.55 && t < 10.05) {
    caption('for one held breath,', t, 8.6, 10.02, H / 2 + 150, 76);
    caption('every next word is possible.', t, 8.95, 10.02, H / 2 + 238, 76, C.gold);
  }
  caption('everything reaches for everything else.', t, 10.95, 12.4, H - 170);
  caption('meaning has a shape.', t, 12.9, 16.0, H - 190, 74);
  txt('king − man + woman ≈ queen', W / 2, H - 128, { font: monoF(20, 400), color: C.gold, a: win(t, 13.6, 16.0, 0.4, 0.4), align: 'center', ls: 3 });
  drawSampling(t);
  glitchLine('wait —', t, 22.25, 24.35, H - 250, 78);
  glitchLine('is that actually true?', t, 22.75, 24.35, H - 160, 78);
  caption('check it.  ✓  it holds.', t, 24.65, 25.95, H - 170, 66, C.gold);
  caption("it's falling upward into meaning —", t, 26.3, 28.25, H - 240, 66);
  caption('and landing, gently, on an answer for you.', t, 26.95, 28.25, H - 160, 66, C.gold);
  drawTitle(t);
}

function drawHUD(t, a) {
  const ch = [...CHAPTERS].reverse().find((c) => t >= c[0]);
  const ca = a * smooth(ch[0], ch[0] + 0.3, t);

  txt(ch[2], 118, 88, { font: monoF(15), color: C.paper, a: ca, ls: 5 });

  const v = state.v * 2.1, gf = state.g;

  txt(`${v.toFixed(0)}`, W - 330, 112, { font: monoF(34), color: C.paper, a, align: 'right' });
  txt('tok/s', W - 290, 112, { font: monoF(13, 400), color: 'rgba(244,239,230,0.6)', a, align: 'right' });

  const gc = gf < 0.3 ? C.cyan : gf > 3 ? C.coral : C.paper;
  txt(`${Math.abs(gf) < 0.05 ? '0.0' : gf.toFixed(1)}`, W - 108, 112, { font: monoF(34), color: gc, a, align: 'right' });

  const ctx = Math.round(easeInOut((t - 3.4) / 5.8) * 18432);

function drawSampling(t) {
  if (t < 16.4 || t > 21.6) return;
  const out = 1 - smooth(21.1, 21.6, t), inA = smooth(16.45, 16.9, t);
  txt('temperature 0.8  ·  one token at a time', W / 2, H - 362, { font: monoF(13, 400), color: 'rgba(244,239,230,0.5)', a: inA * out, align: 'center', ls: 3 });

  // the sentence, built one fork at a time
  const words = ['it', 'feels', 'like', ...FORKS.map((f) => f.pick)];
  const px = 70; setFont(serifF(px));
  const sp = g.measureText(' ').width, ws = words.map((w) => g.measureText(w).width);
  let x = W / 2 - (ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1)) / 2;
  const y = H - 150;
  words.forEach((w, i) => {
    const t0 = i < 3 ? 16.55 + i * 0.1 : FORKS[i - 3].t, e = easeOut((t - t0) / 0.35);
    if (e > 0) {
      const pop = i >= 3 ? 1 + 0.25 * Math.exp(-(t - t0) * 7) : 1;
      g.save(); g.translate(x + ws[i] / 2, y); g.scale(pop, pop);
      txt(w, 0, (1 - e) * 16, { font: serifF(px), color: i >= 3 ? C.gold : C.paper, a: e * out, align: 'center', glow: 'rgba(0,0,0,0.8)' });
      g.restore();
    } else if (i === 0 || (i >= 3 && t >= (i === 3 ? 16.8 : FORKS[i - 4].t))) {
      if (Math.floor(t * 3) % 2 === 0) { g.globalAlpha = out * 0.8; g.fillStyle = C.gold; g.fillRect(x, y - px * 0.62, 4, px * 0.75); g.globalAlpha = 1; }
      x += ws[i] + sp; // cursor sits at the next slot
      return;
    }
    x += ws[i] + sp;
  });

  // candidate chips around each decision
  for (const fk of FORKS) {
    const a = win(t, fk.t - 0.6, fk.t + 0.8, 0.2, 0.25) * out;
    if (a <= 0) continue;
    const items = [[fk.pick, fk.p, true], ...fk.alts.map(([w, p]) => [w, p, false])].sort((m, n) => n[1] - m[1]);
    setFont(monoF(22, 400));
    const cw = items.map(([w]) => g.measureText(w).width + 92), gap = 14;
    let cx = W / 2 - (cw.reduce((m, n) => m + n, 0) + gap * (items.length - 1)) / 2;
    const decided = t >= fk.t, cy = H - 290;
    items.forEach(([w, p, pick], i) => {
      const on = pick && decided, dim = decided && !pick ? 0.35 : 1;
      g.save(); g.globalAlpha = a * dim;
      g.beginPath(); g.roundRect(cx, cy - 32, cw[i], 50, 10);
      g.fillStyle = on ? 'rgba(255,210,122,0.16)' : 'rgba(10,12,24,0.6)'; g.fill();
      g.lineWidth = on ? 2.5 : 1; g.strokeStyle = on ? C.gold : 'rgba(244,239,230,0.3)';
      if (on) { g.shadowColor = C.gold; g.shadowBlur = 18; }
      g.stroke(); g.shadowBlur = 0;
      g.fillStyle = on ? C.gold : 'rgba(244,239,230,0.35)'; g.fillRect(cx + 12, cy + 10, (cw[i] - 24) * p / 0.55, 3);
      g.restore();
      txt(w, cx + 14, cy + 2, { font: monoF(22, 400), color: on ? C.gold : C.paper, a: a * dim });
      txt(p.toFixed(2).slice(1), cx + cw[i] - 12, cy + 2, { font: monoF(16, 400), color: 'rgba(244,239,230,0.6)', a: a * dim, align: 'right' });
      if (decided && !pick) { g.save(); g.globalAlpha = a * 0.5; g.fillStyle = C.paper; g.fillRect(cx + 10, cy - 7, cw[i] - 20, 1.5); g.restore(); }
      cx += cw[i] + gap;
    });
  }
}

function drawTitle(t) {
  if (t < 28.35) return;
  const out = 1 - smooth(29.5, 29.95, t);
  const word = 'Rollercoaster', px = 196;
  setFont(serifF(px));
  const ws = [...word].map((c) => g.measureText(c).width), total = ws.reduce((a, b) => a + b, 0);
  let x = W / 2 - total / 2;
  [...word].forEach((c, i) => {
    const e = easeOut((t - 28.4 - i * 0.03) / 0.5);
    txt(c, x, H / 2 + 20 + (1 - e) * 60, { font: serifF(px), color: C.paper, a: e * out, glow: 'rgba(255,170,90,0.45)', blur: 40 });
    x += ws[i];
  });
  const e2 = easeOut((t - 28.75) / 0.5);
  txt('through my mind', W / 2, H / 2 + 118 + (1 - e2) * 20, { font: serifF(84), color: C.gold, a: e2 * out, align: 'center' });
  const e3 = smooth(29.0, 29.3, t);
  txt('CLAUDE  ·  OPUS 5.5  ·  EVERY FRAME AND EVERY SOUND MADE IN CODE', W / 2, H / 2 + 200, { font: monoF(14, 400), color: 'rgba(244,239,230,0.6)', a: e3 * out, align: 'center', ls: 5 });
}

/* =====================================================================
   9. FRAME RENDER (a pure function of t)
   ===================================================================== */
function renderFrame(t) {
  t = clamp(t, 0, DURATION - 1e-4);
  updateWorld(t);
  composer.render();
  drawOverlay(t);
}

/* =====================================================================
   10. THE SCORE — synthesized, scheduled from any start offset
   ---------------------------------------------------------------------
   Dm9 · Bbmaj7 · Gm9 · A7sus on the climb, a breath of silence at the
   crest, drums on the drop, sampled arpeggios at the forks, everything
   muffled in the tunnel, then a Picardy D major for the answer.
   ===================================================================== */
const PROG = [
  [50, 53, 57, 60, 64], [50, 53, 57, 60, 64], [46, 50, 53, 57], [43, 46, 50, 53, 57], [45, 50, 52, 55],
  [50, 53, 57, 60, 64], [46, 50, 53, 57], [41, 53, 57, 60], [48, 52, 55, 62], [50, 53, 57, 60, 64], [46, 50, 53, 57],
  [43, 46, 50, 53, 57], [45, 49, 52, 55], [50, 54, 57, 62, 64], [50, 54, 57, 62, 66],
];
const ROOT = [38, 38, 34, 31, 33, 38, 34, 41, 36, 38, 34, 31, 33, 38, 38];
const PAD_AMP = [0.012, 0.018, 0.022, 0.025, 0.028, 0.026, 0.026, 0.026, 0.026, 0.026, 0.026, 0.03, 0.032, 0.036, 0.034];
const PAD_LP = [500, 700, 900, 1100, 1500, 2400, 2400, 2600, 2600, 2400, 2400, 1200, 1600, 3400, 2600];
let NOISE = null;

function buildTrack(ac, dest, base, from) {
  const at = (t) => base + t;
  const nodes = [];
  if (!NOISE || NOISE.sampleRate !== ac.sampleRate) {
    NOISE = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = NOISE.getChannelData(0), r = rng(99);
    for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1;
  }
  const out = ac.createGain(); out.gain.value = 1; out.connect(dest);
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
  const lim = ac.createDynamicsCompressor(); lim.threshold.value = -4; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.08;
  const master = ac.createGain(); master.connect(comp); comp.connect(lim); lim.connect(out);
  const music = ac.createGain(), mf = ac.createBiquadFilter(); mf.type = 'lowpass'; mf.Q.value = 0.8;
  music.connect(mf); mf.connect(master);
  const drums = ac.createGain(); drums.connect(music);
  const pads = ac.createGain(); pads.connect(music);
  const echo = ac.createDelay(1), fb = ac.createGain(), wet = ac.createGain();
  echo.delayTime.value = BEAT * 0.75; fb.gain.value = 0.32; wet.gain.value = 0.35;
  echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(music);

  function automate(param, pts, start, exp = false) {
    const valAt = (t) => {
      if (t <= pts[0][0]) return pts[0][1];
      for (let i = 0; i < pts.length - 1; i++) {
        const [t0, v0] = pts[i], [t1, v1] = pts[i + 1];
        if (t <= t1) { const k = (t - t0) / (t1 - t0 || 1); return exp ? v0 * (v1 / v0) ** k : lerp(v0, v1, k); }
      }
      return pts[pts.length - 1][1];
    };
    param.setValueAtTime(valAt(start), at(start));
    for (const [t, v] of pts) if (t > start) exp ? param.exponentialRampToValueAtTime(v, at(t)) : param.linearRampToValueAtTime(v, at(t));
  }
  automate(mf.frequency, [[0, 18000], [21.9, 18000], [22.5, 480], [24.8, 650], [25.95, 7000], [26.05, 18000]], from, true);
  automate(master.gain, [[0, 0.62], [29.2, 0.62], [30, 0.0001]], from, true);

  function tone({ type = 'sine', f, f1 = null, glide = 1, t0, dur, gain, a = 0.004, dst = music, det = 0, lp = null }) {
    if (t0 < from - 1e-3) return;
    const t = at(t0), o = ac.createOscillator(), gn = ac.createGain();
    o.type = type; o.detune.value = det;
    o.frequency.setValueAtTime(f, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur * glide);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(gain, t + a); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let head = o;
    if (lp) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); head = fl; }
    head.connect(gn); gn.connect(dst);
    o.start(t); o.stop(t + dur + 0.05); nodes.push(o);
    return gn;
  }
  function hiss({ t0, dur, gain, type = 'highpass', freq = 6000, f1 = null, q = 0.7, dst = music, a = 0.002 }) {
    if (t0 < from - 1e-3) return;
    const t = at(t0), src = ac.createBufferSource(), fl = ac.createBiquadFilter(), gn = ac.createGain();
    src.buffer = NOISE; src.loop = true;
    fl.type = type; fl.frequency.setValueAtTime(freq, t); fl.Q.value = q;
    if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(gain, t + a); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl); fl.connect(gn); gn.connect(dst);
    src.start(t, hash(t0 * 13.7) * 1.5); src.stop(t + dur + 0.05); nodes.push(src);
  }
  function sweep(t0, t1, f0, f1, g0, g1, dst = master, q = 1.2) {
    if (t1 <= from) return;
    const st = Math.max(from, t0), src = ac.createBufferSource(), fl = ac.createBiquadFilter(), gn = ac.createGain();
    src.buffer = NOISE; src.loop = true; fl.type = 'bandpass'; fl.Q.value = q;
    automate(fl.frequency, [[t0, f0], [t1, f1]], st, true);
    automate(gn.gain, [[t0, g0], [t1, g1], [t1 + 0.03, 0]], st);
    src.connect(fl); fl.connect(gn); gn.connect(dst);
    src.start(at(st)); src.stop(at(t1 + 0.06)); nodes.push(src);
  }
  const kick = (t, gn = 0.9, dst = drums) => { tone({ f: 150, f1: 42, glide: 0.3, t0: t, dur: 0.42, gain: gn, a: 0.002, dst }); tone({ type: 'triangle', f: 900, f1: 200, t0: t, dur: 0.025, gain: gn * 0.2, dst }); };
  const snare = (t, gn = 0.32, dst = drums) => { hiss({ t0: t, dur: 0.2, gain: gn, type: 'bandpass', freq: 1900, q: 0.8, dst }); tone({ type: 'triangle', f: 200, f1: 160, t0: t, dur: 0.12, gain: gn * 0.6, dst }); };
  const hat = (t, gn = 0.08) => hiss({ t0: t, dur: 0.05, gain: gn, freq: 7500, dst: drums });
  const bell = (t, m, gn = 0.09) => {
    const f = mtof(m);
    tone({ f, t0: t, dur: 1.8, gain: gn, dst: master }); tone({ f: f * 2.76, t0: t, dur: 0.7, gain: gn * 0.3, dst: master });
    tone({ f: f * 5.4, t0: t, dur: 0.3, gain: gn * 0.12, dst: master });
  };

  // ---- wind, following the car's speed
  {
    const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), gn = ac.createGain();
    src.buffer = NOISE; src.loop = true; fl.type = 'bandpass'; fl.Q.value = 0.6;
    const fp = [], gp = [];
    for (let t = 0; t <= DURATION + 1e-6; t += 0.1) {
      const v = vAt(t), k = Math.min(1, (v / 48) ** 2);
      fp.push([t, 220 + v * 55]); gp.push([t, 0.012 + k * 0.2 + 0.05 * win(t, 21.9, 26, 0.3, 0.2) * k]);
    }
    automate(fl.frequency, fp, from); automate(gn.gain, gp, from);
    src.connect(fl); fl.connect(gn); gn.connect(master);
    src.start(at(from)); src.stop(at(DURATION + 0.1)); nodes.push(src);
  }

  // ---- pads
  PROG.forEach((ch, b) => {
    const tb0 = b * 2, tb1 = b === 4 ? 9.3 : tb0 + 2;
    if (tb1 <= from) return;
    const st = Math.max(tb0, from), att = st > tb0 ? 0.08 : b === 5 || b === 13 ? 0.02 : 0.35, rel = b === 4 ? 0.05 : 0.45;
    const lp = ac.createBiquadFilter(), gn = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.value = PAD_LP[b]; lp.Q.value = 0.8;
    lp.connect(gn); gn.connect(pads);
    gn.gain.setValueAtTime(0.0001, at(st)); gn.gain.linearRampToValueAtTime(PAD_AMP[b], at(st) + att);
    gn.gain.setValueAtTime(PAD_AMP[b], at(tb1)); gn.gain.linearRampToValueAtTime(0.0001, at(tb1) + rel);
    for (const m of ch) for (const d of [-7, 7]) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = d;
      o.connect(lp); o.start(at(st)); o.stop(at(tb1) + rel + 0.05); nodes.push(o);
    }
  });

  // ---- PROMPT: keys, enter, lap bar
  TYPE.forEach((tt, i) => {
    hiss({ t0: tt, dur: 0.03, gain: 0.1 + hash(i) * 0.05, type: 'bandpass', freq: 3000 + hash(i + 3) * 1500, q: 2, dst: master });
    tone({ type: 'square', f: 110 + hash(i) * 30, t0: tt, dur: 0.02, gain: 0.025, dst: master, lp: 900 });
  });
  hiss({ t0: ENTER, dur: 0.06, gain: 0.2, type: 'bandpass', freq: 2400, q: 1.5, dst: master });
  tone({ f: 90, f1: 60, t0: ENTER, dur: 0.12, gain: 0.25, dst: master });
  hiss({ t0: 2.62, dur: 0.5, gain: 0.05, freq: 3200, dst: master });
  tone({ f: 120, f1: 50, t0: 2.95, dur: 0.3, gain: 0.5, dst: master });
  hiss({ t0: 2.95, dur: 0.14, gain: 0.2, type: 'bandpass', freq: 700, q: 1, dst: master });

  // ---- READING: the chain lift
  for (let t = 3.75; t < 9.25; t += 0.125) {
    const i = Math.round(t * 8);
    tone({ type: 'square', f: 2100 + (i % 2) * 300, t0: t, dur: 0.018, gain: 0.035, dst: master, lp: 4200 });
    hiss({ t0: t, dur: 0.022, gain: 0.05, type: 'bandpass', freq: 1500, q: 3, dst: master });
    if (i % 4 === 0) tone({ type: 'triangle', f: 170, f1: 120, t0: t, dur: 0.07, gain: 0.1, dst: master });
  }
  sweep(4.4, 9.3, 280, 5200, 0.0, 0.1);
  tone({ f: 880, t0: 9.32, dur: 0.72, gain: 0.05, a: 0.25, dst: master });
  tone({ f: 1318.5, t0: 9.45, dur: 0.6, gain: 0.025, a: 0.2, dst: master });
  sweep(9.55, 10.0, 600, 6000, 0.0, 0.12, master, 0.8);

  // ---- ATTENTION → SAMPLING: the beat
  tone({ f: 62, f1: 28, t0: 10, dur: 1.7, gain: 0.9, a: 0.004, dst: master });
  hiss({ t0: 10, dur: 1.8, gain: 0.22, freq: 3500, dst: master });
  for (let b = 0; b < 24; b++) { const t = 10 + b * BEAT; kick(t); if (b % 2 === 1) snare(t); }
  for (let k = 0; k < 48; k++) { const t = 10 + k * 0.25; if (k % 2 === 1) hat(t, 0.08); else if (t >= 12.3 && t < 15.5) hat(t, 0.045); }
  for (let k = 0; k < 4; k++) snare(21.5 + k * 0.125, 0.12 + k * 0.06);
  for (let k = 0; k < 48; k++) {
    const t = 10 + k * 0.25, b = Math.floor(t / 2), r = ROOT[b];
    tone({ type: 'sawtooth', f: mtof(r + (k % 4 === 3 ? 12 : 0)), t0: t, dur: 0.22, gain: 0.1, lp: 460 });
  }
  for (let k = 0; k < 94; k++) {
    const t = 10 + k * 0.125, ch = PROG[Math.floor(t / 2)];
    let m;
    if (t >= 16.5) { if (hash(k * 7.7) < 0.2) continue; m = ch[Math.floor(hash(k * 3.3) * ch.length)] + 12 + (hash(k * 1.9) > 0.6 ? 12 : 0); }
    else { const pat = [0, 1, 2, 3, 2, 1, 3, 2]; m = ch[pat[k % 8] % ch.length] + 12; }
    const gn = tone({ type: 'triangle', f: mtof(m), t0: t, dur: 0.17, gain: 0.05 });
    if (gn) gn.connect(echo);
  }
  sweep(13.1, 13.9, 500, 4000, 0, 0.08);
  tone({ f: 1760, t0: 13.9, dur: 0.9, gain: 0.035, a: 0.05, dst: master });
  for (const fk of FORKS) {
    tone({ f: 1318.5, f1: 1760, glide: 0.2, t0: fk.t, dur: 0.3, gain: 0.08, dst: master });
    tone({ f: 2637, t0: fk.t, dur: 0.12, gain: 0.025, dst: master });
  }

  // ---- DOUBT: muffled, a heartbeat, glitches, three confirming blips
  for (const t of [22.3, 23.3, 24.3]) { kick(t, 0.55, music); kick(t + 0.19, 0.4, music); }
  { const r = rng(5); for (let i = 0; i < 18; i++) { const t = 22.2 + r() * 2.3; tone({ type: 'square', f: 300 + r() * 2200, t0: t, dur: 0.03, gain: 0.035, dst: master }); } }
  for (const f of [659.3, 698.5, 740]) tone({ f, t0: 22.8, dur: 1.6, gain: 0.025, a: 0.3, dst: master });
  [[24.65, 880], [24.95, 1108.7], [25.25, 1318.5]].forEach(([t, f]) => tone({ f, t0: t, dur: 0.3, gain: 0.08, dst: master }));
  sweep(25.0, 26.0, 400, 8000, 0, 0.16);
  for (let t = 25.0; t < 26; t += t < 25.5 ? 0.125 : 0.0625) snare(t, 0.06 + (t - 25) * 0.22, master);

  // ---- ANSWER: release, bells, title hit
  kick(26, 1.0, master);
  tone({ f: 55, f1: 32, t0: 26, dur: 1.6, gain: 0.7, dst: master });
  hiss({ t0: 26, dur: 2.4, gain: 0.22, freq: 3200, dst: master });
  for (let b = 1; b < 5; b++) { kick(26 + b * BEAT, 0.7); if (b % 2) snare(26 + b * BEAT, 0.25); }
  for (let k = 0; k < 9; k++) hat(26.25 + k * 0.25, 0.06);
  [[26.0, 74], [26.5, 78], [27.0, 81], [27.25, 83], [27.5, 81], [28.0, 78]].forEach(([t, m]) => bell(t, m));
  bell(28.4, 86, 0.11); bell(28.4, 74, 0.06);
  tone({ f: 50, f1: 30, t0: 28.4, dur: 2.0, gain: 0.6, dst: master });

  return {
    stop() {
      const now = ac.currentTime;
      out.gain.setTargetAtTime(0, now, 0.015);
      setTimeout(() => { nodes.forEach((n) => { try { n.stop(); } catch (e) { /* already stopped */ } }); out.disconnect(); }, 200);
    },
  };
}

/* =====================================================================
   11. LAYOUT & PLAYBACK
   ===================================================================== */
function layout() {
  let cw, ch;
  if (innerWidth / innerHeight > 16 / 9) { ch = innerHeight; cw = ch * 16 / 9; } else { cw = innerWidth; ch = cw * 9 / 16; }
  stage.style.width = cw + 'px'; stage.style.height = ch + 'px';
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  const RW = Math.round(Math.min(cw * dpr, 1920)), RH = Math.round(RW * 9 / 16);
  renderer.setPixelRatio(1);
  renderer.setSize(RW, RH, false);
  composer.setPixelRatio(1);
  composer.setSize(RW, RH);
  finalPass.uniforms.uRes.value.set(RW, RH);
  renderH = RH;
  const ow = Math.round(cw * Math.min(devicePixelRatio || 1, 2)), oh = Math.round(ow * 9 / 16);
  ov.width = ow; ov.height = oh; ovScale = ow / W;
}

const player = {
  playing: false, loop: false, muted: false, offset: 0, perf0: 0, ctx0: 0,
  actx: null, gain: null, track: null,
  time() {
    if (!this.playing) return this.offset;
    // picture follows what you hear: subtract the device's output latency from the audio clock
    const lat = this.actx ? (this.actx.outputLatency || 0) + (this.actx.baseLatency || 0) : 0;
    const el = this.actx ? this.actx.currentTime - this.ctx0 - lat : (performance.now() - this.perf0) / 1000;
    return this.offset + Math.max(0, el);
  },
  killTrack() { if (this.track) { this.track.stop(); this.track = null; } },
  start(from) {
    this.offset = clamp(from, 0, DURATION); this.playing = true;
    if (this.actx) {
      if (this.actx.state === 'suspended') this.actx.resume();
      this.killTrack();
      this.ctx0 = this.actx.currentTime + 0.05;
      this.track = buildTrack(this.actx, this.gain, this.ctx0 - this.offset, this.offset);
    } else this.perf0 = performance.now();
    ui.sync();
  },
  pause() { this.offset = this.time(); this.playing = false; this.killTrack(); ui.sync(); },
  toggle() { this.playing ? this.pause() : this.start(this.offset >= DURATION - 0.01 ? 0 : this.offset); },
  seek(x) { this.playing ? this.start(x) : (this.offset = clamp(x, 0, DURATION)); ui.sync(); },
  setMuted(m) { this.muted = m; if (this.gain) this.gain.gain.setTargetAtTime(m ? 0 : 1, this.actx.currentTime, 0.02); ui.sync(); },
};

const ui = (() => {
  const bar = document.getElementById('bar'), scrub = document.getElementById('scrub');
  const fill = scrub.querySelector('.fill'), head = scrub.querySelector('.head'), tc = document.getElementById('tc');
  const bPlay = document.getElementById('bPlay'), bMute = document.getElementById('bMute'), bLoop = document.getElementById('bLoop');
  CHAPTERS.slice(1).forEach((c) => { const m = document.createElement('div'); m.className = 'mark'; m.style.left = (c[0] / DURATION) * 100 + '%'; scrub.appendChild(m); });
  let idleT = 0;
  const poke = () => { bar.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => player.playing && bar.classList.add('idle'), 2200); };
  addEventListener('pointermove', poke);
  const seekFromEvent = (e) => { const r = scrub.getBoundingClientRect(); player.seek(clamp((e.clientX - r.left) / r.width) * DURATION); };
  let drag = false;
  scrub.addEventListener('pointerdown', (e) => { drag = true; scrub.setPointerCapture(e.pointerId); seekFromEvent(e); });
  scrub.addEventListener('pointermove', (e) => drag && seekFromEvent(e));
  scrub.addEventListener('pointerup', () => { drag = false; });
  bPlay.onclick = () => player.toggle();
  document.getElementById('bRestart').onclick = () => player.start(0);
  bMute.onclick = () => player.setMuted(!player.muted);
  bLoop.onclick = () => { player.loop = !player.loop; ui.sync(); };
  const marks = CHAPTERS.map((c) => c[0]).concat(28.4);
  addEventListener('keydown', (e) => {
    if (!document.getElementById('gate').classList.contains('hidden')) return;
    const now = player.time();
    if (e.code === 'Space') { e.preventDefault(); player.toggle(); }
    else if (e.key === 'r' || e.key === 'R') player.start(0);
    else if (e.key === 'm' || e.key === 'M') player.setMuted(!player.muted);
    else if (e.key === 'l' || e.key === 'L') { player.loop = !player.loop; ui.sync(); }
    else if (e.key === 'ArrowRight') player.seek(marks.find((m) => m > now + 0.05) ?? now);
    else if (e.key === 'ArrowLeft') player.seek([...marks].reverse().find((m) => m < now - 0.4) ?? 0);
    poke();
  });
  return {
    show() { bar.classList.remove('hidden'); poke(); },
    sync() {
      bPlay.textContent = player.playing ? 'PAUSE' : 'PLAY';
      bMute.textContent = player.muted || !player.actx ? 'MUTED' : 'SOUND';
      bMute.classList.toggle('off', player.muted || !player.actx);
      bLoop.classList.toggle('off', !player.loop);
      if (!player.playing) poke();
    },
    tick(t) {
      const p = (t / DURATION) * 100;
      fill.style.width = p + '%'; head.style.left = p + '%';
      tc.textContent = t.toFixed(2).padStart(5, '0');
    },
  };
})();

function loop() {
  let t = player.time();
  if (player.playing && t >= DURATION) {
    if (player.loop) { player.start(0); t = 0; }
    else { player.pause(); player.offset = DURATION; t = DURATION; }
  }
  renderFrame(t);
  ui.tick(Math.min(t, DURATION));
  requestAnimationFrame(loop);
}

async function loadFonts() {
  try {
    await Promise.race([
      Promise.all(['italic 400 60px "Instrument Serif"', '400 20px "JetBrains Mono"', '700 20px "JetBrains Mono"'].map((f) => document.fonts.load(f))),
      new Promise((r) => setTimeout(r, 5000)),
    ]);
  } catch (e) { /* fall back to system faces */ }
}

/* =====================================================================
   12. BOOT
   ===================================================================== */
layout();
addEventListener('resize', layout);
await loadFonts();
buildWorld();

window.__ride = {
  duration: DURATION, seek: (t) => player.seek(t),
  frame(t) { renderFrame(t); return canvas.toDataURL('image/jpeg', 0.9); },
  async levels() {                                    // offline render of the score → per-second peak / RMS (dBFS)
    const sr = 44100, oc = new OfflineAudioContext(2, sr * DURATION, sr);
    buildTrack(oc, oc.destination, 0, 0);
    const d = (await oc.startRendering()).getChannelData(0), out = [];
    for (let k = 0; k < DURATION; k++) {
      let pk = 0, ss = 0;
      for (let i = k * sr; i < (k + 1) * sr; i++) { const v = Math.abs(d[i]); pk = Math.max(pk, v); ss += v * v; }
      out.push([k, (20 * Math.log10(pk + 1e-9)).toFixed(1), (10 * Math.log10(ss / sr + 1e-12)).toFixed(1)]);
    }
    return out;
  },
};

if (STILL !== null) {
  player.offset = clamp(STILL, 0, DURATION);          // ?t=12.5 → hold that frame (paused, still rendering)
  requestAnimationFrame(loop);
} else {
  player.offset = 9.55;                              // poster frame behind the gate: the crest
  renderFrame(player.offset);
  const gate = document.getElementById('gate');
  gate.classList.remove('hidden');
  const go = (withSound) => {
    try {
      player.actx = new (window.AudioContext || window.webkitAudioContext)();
      player.gain = player.actx.createGain(); player.gain.connect(player.actx.destination);
    } catch (e) { player.actx = null; }
    gate.classList.add('hidden');
    ui.show();
    player.setMuted(!withSound);
    player.start(0);
  };
  document.getElementById('play').onclick = () => go(true);
  document.getElementById('playMuted').onclick = () => go(false);
  requestAnimationFrame(loop);
}
</script>
</body>
