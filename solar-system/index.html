<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar System Live</title>
<style>
:root{color-scheme:dark;--bg:#04060c;--panel:rgba(12,16,28,.78);--line:rgba(255,255,255,.14);--text:#e9edf6;--dim:#9aa6bd;--accent:#ffb84d;--accent2:#6ab7ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#top{top:12px;left:12px;padding:10px 12px;max-width:min(340px,calc(100vw - 24px))}
#top h1{margin:0 0 6px;font-size:15px;font-weight:650;letter-spacing:.2px}
#top .row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px}
#top label{display:flex;gap:5px;align-items:center;color:var(--dim);font-size:12.5px;cursor:pointer}
button,select,input[type=text]{font:inherit;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:34px}
button{cursor:pointer}button:hover{background:rgba(255,255,255,.14)}
button.on{background:var(--accent);color:#161006;border-color:transparent;font-weight:600}
.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
#mode-note{color:var(--dim);font-size:12px;margin-top:6px}
#info{top:12px;right:12px;width:310px;max-height:calc(100vh - 150px);overflow:auto;padding:12px 14px}
#info h2{margin:0;font-size:18px}#info .kind{color:var(--dim);font-size:12px;margin-bottom:8px}
#info table{width:100%;border-collapse:collapse;font-size:12.5px}#info td{padding:3px 0;vertical-align:top}#info td:first-child{color:var(--dim);padding-right:10px;white-space:nowrap}#info td:last-child{text-align:right;font-variant-numeric:tabular-nums}
#info .chk{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
#info .chk b{color:var(--accent2);font-weight:600}
#info-toggle{display:none}
#bottom{left:50%;transform:translateX(-50%);bottom:12px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(880px,calc(100vw - 24px))}
#bodies{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
#bodies button{padding:4px 9px;min-height:30px;font-size:12.5px}
#time{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
#date{width:190px;font-variant-numeric:tabular-nums;text-align:center}
#datewarn{color:#ff9d80;font-size:12px;min-height:16px}
#status{color:var(--dim);font-size:12px;text-align:center}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;font-size:12px;color:#fff;text-shadow:0 0 4px #000,0 0 2px #000;white-space:nowrap;pointer-events:auto;cursor:pointer;will-change:transform}
.lbl .dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 1px rgba(0,0,0,.6);flex:none;margin-left:-3.5px}
.lbl.moon{font-size:11px;color:#cfd8ea}.lbl.moon .dot{width:5px;height:5px;background:#cfd8ea}
.lbl.sel{color:var(--accent)}.lbl.sel .dot{background:var(--accent)}
.lbl.aps{pointer-events:none;color:#d7e6ff;font-size:11px}.lbl.aps .dot{background:#7dd3a8;width:5px;height:5px}
#scalebar{position:fixed;left:16px;bottom:118px;color:var(--dim);font-size:12px;pointer-events:none;display:none}
#scalebar .bar{height:6px;border:1.5px solid #dfe6f5;border-top:none;margin-bottom:3px}
#credits{position:fixed;right:12px;bottom:12px;max-width:290px;font-size:10.5px;color:var(--dim);text-align:right;line-height:1.35}
#credits a{color:var(--dim)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:var(--bg)}
@media (max-width:900px){#credits{display:none}}
@media (max-width:720px){
 #info{top:auto;right:12px;left:12px;bottom:150px;width:auto;max-height:38vh;display:none}
 #info.show{display:block}
 #info-toggle{display:inline-block;position:fixed;top:12px;right:12px}
 #top{max-width:calc(100vw - 80px)}
 #scalebar{bottom:170px}
 #mode-note{display:none}
 #date{width:160px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="top" class="panel">
  <h1>Solar System &middot; live orbits</h1>
  <div class="seg" role="group" aria-label="Scale mode"><button id="m-ill" class="on">Illustrative</button><button id="m-true">True scale</button></div>
  <div id="mode-note"></div>
  <div class="row">
    <label><input type="checkbox" id="t-orbits" checked>Orbits</label>
    <label><input type="checkbox" id="t-labels" checked>Labels</label>
    <label><input type="checkbox" id="t-moons" checked>Moons</label>
    <label><input type="checkbox" id="t-belts" checked>Belts</label>
  </div>
  <div class="row"><span style="color:var(--dim);font-size:12.5px">Quality</span>
    <select id="quality" aria-label="Quality"><option value="low">Low</option><option value="med">Medium</option><option value="high" selected>High</option></select></div>
</div>
<button id="info-toggle" class="panel" aria-label="Toggle info panel">Info</button>
<div id="info" class="panel"></div>
<div id="scalebar"><div class="bar" id="sb-bar"></div><span id="sb-txt"></span></div>
<div id="bottom" class="panel">
  <div id="bodies"></div>
  <div id="time">
    <button id="rev" title="Reverse time" aria-label="Reverse time">&#9664;&#9664;</button>
    <button id="play" title="Play / pause (space)" aria-label="Play or pause">&#10074;&#10074;</button>
    <select id="speed" aria-label="Time speed"></select>
    <input type="text" id="date" spellcheck="false" aria-label="Date and time in UTC, YYYY-MM-DD HH:MM" title="UTC date, format YYYY-MM-DD HH:MM (negative years allowed). Press Enter.">
    <button id="now">Now</button>
  </div>
  <div id="datewarn"></div>
  <div id="status"></div>
</div>
<div id="credits"></div>
<div id="err"><div><h2>WebGL isn't available</h2><p>This page needs WebGL 2 to draw the solar system.</p></div></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<!--TEXTURES-->
<script type="module" src="./src/app.js"></script>
</body>
</html>
