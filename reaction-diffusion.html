<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gray-Scott Reaction-Diffusion — Torus Knot Skin</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 16px; top: 14px; z-index: 10;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #9fb3d1; letter-spacing: .02em; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }
  #hud b { color: #e9f0ff; font-weight: 600; }
  #hud .dim { color: #5f7193; }
  #fps { color: #79f2c0; }

  #panel {
    position: fixed; right: 14px; top: 14px; z-index: 10; width: 252px;
    background: rgba(10, 14, 24, .82); border: 1px solid rgba(120,150,200,.18);
    border-radius: 10px; padding: 12px 14px 13px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #9fb3d1; user-select: none;
  }
  #panel h2 {
    margin: 0 0 9px; font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: #e9f0ff;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .row label { width: 62px; flex: none; color: #7d90b5; }
  .row output { width: 46px; flex: none; text-align: right; color: #79f2c0; font-variant-numeric: tabular-nums; }
  input[type="range"] { flex: 1; height: 14px; accent-color: #38bdf8; cursor: ew-resize; margin: 0; }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 9px; }
  .btns.wide { grid-template-columns: 1fr 1fr; margin-top: 5px; }
  button {
    font: inherit; letter-spacing: .04em; padding: 4px 0; border-radius: 6px; cursor: pointer;
    background: rgba(56,189,248,.08); border: 1px solid rgba(120,170,230,.25); color: #bcd3ee;
  }
  button:hover { background: rgba(56,189,248,.20); }
  button.active { background: rgba(121,242,192,.16); border-color: rgba(121,242,192,.55); color: #c9ffe6; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div><b>Gray-Scott Reaction-Diffusion</b> &middot; torus knot skin</div>
  <div><span class="dim">sim</span> <b>512&times;512</b> ping-pong GPGPU &middot; albedo + displacement from one field</div>
  <div><span class="dim">fps</span> <span id="fps">&mdash;</span> &middot; <span class="dim"><b>click the knot</b> to inject chemical</span></div>
</div>

<div id="panel">
  <h2>Reaction Parameters</h2>
  <div class="row">
    <label for="feed">feed&nbsp;f</label>
    <input id="feed" type="range" min="0.010" max="0.090" step="0.0005" value="0.0367" />
    <output id="feedVal">0.0367</output>
  </div>
  <div class="row">
    <label for="kill">kill&nbsp;k</label>
    <input id="kill" type="range" min="0.030" max="0.075" step="0.0005" value="0.0649" />
    <output id="killVal">0.0649</output>
  </div>
  <div class="row">
    <label for="disp">displace</label>
    <input id="disp" type="range" min="0" max="0.25" step="0.005" value="0.09" />
    <output id="dispVal">0.09</output>
  </div>
  <div class="row">
    <label for="speed">spin</label>
    <input id="speed" type="range" min="0" max="1.5" step="0.05" value="0.35" />
    <output id="speedVal">0.35</output>
  </div>
  <div class="btns">
    <button id="pMitosis" class="active">mitosis</button>
    <button id="pCoral">coral</button>
    <button id="pWorms">worms</button>
  </div>
  <div class="btns wide">
    <button id="reseed">reseed</button>
    <button id="reset">clear</button>
  </div>
</div>

<!-- Modern ES6 modules via import map -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================================
 *  CONFIG
 * ========================================================================== */
const SIM_SIZE   = 512;                 // reaction-diffusion texture edge (SIM² cells)
const STEPS_FRAME = 12;                 // simulation steps per rendered frame

// Classic parameter regimes (Pearson 1992 naming)
const PRESETS = {
  mitosis: { f: 0.0367, k: 0.0649 },    // dividing cell-like spots
  coral:   { f: 0.0545, k: 0.0620 },    // growing coral fingers
  worms:   { f: 0.0780, k: 0.0610 },    // wriggling worms / solitons
};
const params = {
  feed: PRESETS.mitosis.f,
  kill: PRESETS.mitosis.k,
  displacement: 0.09,
  spin: 0.35,
};

/* ============================================================================
 *  RENDERER / SCENE
 * ========================================================================== */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

// make half-float render targets renderable where the extension exists
const gl = renderer.getContext();
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('EXT_color_buffer_half_float');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.6, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 1.8;
controls.maxDistance = 8;

scene.add(new THREE.HemisphereLight(0x8899bb, 0x111420, 0.7));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(3, 4, 5);
scene.add(keyLight);
const rimLight = new THREE.PointLight(0x38bdf8, 14, 20);
rimLight.position.set(-4, -2, -3);
scene.add(rimLight);

/* ============================================================================
 *  SIMULATION STATE — two RGBA half-float targets, ping-ponged every step
 *  R = chemical A (substrate), G = chemical B (activator)
 * ========================================================================== */
const rtOpts = {
  format: THREE.RGBAFormat,
  type: THREE.HalfFloatType,
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  wrapS: THREE.RepeatWrapping,          // seamless wrap = periodic boundary conditions
  wrapT: THREE.RepeatWrapping,
  depthBuffer: false,
  stencilBuffer: false,
  generateMipmaps: false,
};
let rtRead  = new THREE.WebGLRenderTarget(SIM_SIZE, SIM_SIZE, rtOpts);
let rtWrite = new THREE.WebGLRenderTarget(SIM_SIZE, SIM_SIZE, rtOpts);
function swapTargets() { [rtRead, rtWrite] = [rtWrite, rtRead]; }

// stable target the 3D materials bind to; refreshed by a copy pass each frame
const rtDisplay = new THREE.WebGLRenderTarget(SIM_SIZE, SIM_SIZE, {
  ...rtOpts,
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
});

/* ============================================================================
 *  FULLSCREEN QUAD used for every GPU pass (step / seed / clear)
 * ========================================================================== */
const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadGeo = new THREE.PlaneGeometry(2, 2);
const quadMesh = new THREE.Mesh(quadGeo, null);
quadScene.add(quadMesh);

const VERT_QUAD = /* glsl */`
varying vec2 vUv;
void main(){
  vUv = uv;
  gl_Position = vec4(position.xy, 0.0, 1.0);
}`;

/* --- Gray-Scott step: du/dt = Du∇²u - u v² + f(1-u) ; dv/dt = Dv∇²v + u v² - (f+k)v --- */
const FRAG_STEP = /* glsl */`
precision highp float;
uniform sampler2D tState;
uniform vec2  uTexel;
uniform float uFeed;
uniform float uKill;
varying vec2 vUv;

vec2 laplacian(vec2 uv){
  vec2 s = vec2(0.0);
  s += texture2D(tState, uv + uTexel * vec2(-1.0, 0.0)).xy * 0.20;
  s += texture2D(tState, uv + uTexel * vec2( 1.0, 0.0)).xy * 0.20;
  s += texture2D(tState, uv + uTexel * vec2( 0.0,-1.0)).xy * 0.20;
  s += texture2D(tState, uv + uTexel * vec2( 0.0, 1.0)).xy * 0.20;
  s += texture2D(tState, uv + uTexel * vec2(-1.0,-1.0)).xy * 0.05;
  s += texture2D(tState, uv + uTexel * vec2( 1.0,-1.0)).xy * 0.05;
  s += texture2D(tState, uv + uTexel * vec2(-1.0, 1.0)).xy * 0.05;
  s += texture2D(tState, uv + uTexel * vec2( 1.0, 1.0)).xy * 0.05;
  return s - texture2D(tState, uv).xy;
}

void main(){
  vec2 st = texture2D(tState, vUv).xy;
  vec2 l  = laplacian(vUv);
  float u = st.x, v = st.y;
  float reaction = u * v * v;
  float du = l.x - reaction + uFeed * (1.0 - u);
  float dv = l.y + reaction - (uKill + uFeed) * v;
  u = clamp(u + du, 0.0, 1.0);
  v = clamp(v + dv, 0.0, 1.0);
  gl_FragColor = vec4(u, v, 0.0, 1.0);
}`;

/* --- brush: stamp B = 1 inside a disc at uPoint --- */
const FRAG_SEED = /* glsl */`
precision highp float;
uniform sampler2D tState;
uniform vec2  uPoint;
uniform float uRadius;
varying vec2 vUv;
void main(){
  vec4 s = texture2D(tState, vUv);
  if (distance(vUv, uPoint) < uRadius){
    s.r = max(s.r, 0.5);
    s.g = 1.0;
  }
  gl_FragColor = s;
}`;

/* --- wipe both chemicals to zero --- */
const FRAG_CLEAR = /* glsl */`
precision highp float;
varying vec2 vUv;
void main(){ gl_FragColor = vec4(0.0); }`;

/* --- passthrough copy into the display target --- */
const FRAG_COPY = /* glsl */`
precision highp float;
uniform sampler2D tState;
varying vec2 vUv;
void main(){ gl_FragColor = texture2D(tState, vUv); }`;

function makePassMaterial(fragSrc, uniforms){
  return new THREE.ShaderMaterial({
    uniforms,
    vertexShader: VERT_QUAD,
    fragmentShader: fragSrc,
    depthTest: false,
    depthWrite: false,
  });
}

const stepMat  = makePassMaterial(FRAG_STEP, {
  tState: { value: null },
  uTexel: { value: new THREE.Vector2(1 / SIM_SIZE, 1 / SIM_SIZE) },
  uFeed:  { value: params.feed },
  uKill:  { value: params.kill },
});
const seedMat  = makePassMaterial(FRAG_SEED, {
  tState:  { value: null },
  uPoint:  { value: new THREE.Vector2() },
  uRadius: { value: 0.012 },
});
const clearMat = makePassMaterial(FRAG_CLEAR);
const copyMat  = makePassMaterial(FRAG_COPY, { tState: { value: null } });

function runPass(material, target){
  quadMesh.material = material;
  renderer.setRenderTarget(target);
  renderer.render(quadScene, quadCam);
  renderer.setRenderTarget(null);
}

/* ============================================================================
 *  SEED QUEUE — raycast clicks enqueue here, drained before the next frame
 * ========================================================================== */
const pendingSeeds = [];

function seedAt(x, y, r = 0.012){
  pendingSeeds.push({ x: ((x % 1) + 1) % 1, y: ((y % 1) + 1) % 1, r });
}

function drainSeeds(){
  for (const s of pendingSeeds){
    seedMat.uniforms.tState.value = rtRead.texture;
    seedMat.uniforms.uPoint.value.set(s.x, s.y);
    seedMat.uniforms.uRadius.value = s.r;
    runPass(seedMat, rtWrite);
    swapTargets();
  }
  pendingSeeds.length = 0;
}

function clearSimulation(withSeed = true){
  pendingSeeds.length = 0;
  runPass(clearMat, rtRead);
  runPass(clearMat, rtWrite);
  if (withSeed) seedAt(0.5, 0.5, 0.02);
}

/* ============================================================================
 *  MESH TEXTURE — the knot binds rtDisplay directly (no CPU readback):
 *  albedo, bump and displacement all sample the live simulation on GPU.
 * ========================================================================== */
const simTex = rtDisplay.texture;

/* ============================================================================
 *  TORUS KNOT — Standard material patched via onBeforeCompile: albedo comes
 *  from a palette over the live field, displacement offsets vertices outward.
 * ========================================================================== */
let knotShader = null;

// Palette applied on-GPU in linear space: activator -> teal/green glow with a
// hot amber core, substrate -> cool steel-blue base.
const ALBEDO_GLSL = /* glsl */`
vec3 simAlbedo(vec2 uv){
  vec2 s = texture2D(map, uv).gb;
  float act  = clamp(s.x / 0.32, 0.0, 1.0);
  float sub  = clamp(s.y / 0.30, 0.0, 1.0);
  float glow = act * act;
  vec3 col = vec3(0.020, 0.031, 0.055);
  col += vec3(0.05, 0.09, 0.16) * sub;
  col += vec3(0.10, 0.95, 0.55) * glow;
  col += vec3(0.60, 0.30, 0.08) * glow * glow * act;
  return col;
}`;

const knotMat = new THREE.MeshStandardMaterial({
  map: simTex,                 // albedo: palettized field
  bumpMap: simTex,             // shading detail from the same field
  bumpScale: 0.6,
  roughness: 0.42,
  metalness: 0.15,
});
knotMat.onBeforeCompile = (shader) => {
  shader.uniforms.uDispMap = { value: simTex };
  shader.uniforms.uDispScale = { value: params.displacement };
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', `
      #include <common>
      uniform sampler2D uDispMap;
      uniform float uDispScale;
    `)
    .replace('#include <begin_vertex>', `
      #include <begin_vertex>
      transformed += normal * (texture2D(uDispMap, uv).g * uDispScale);
    `);
  shader.fragmentShader = shader.fragmentShader
    // inject after map_pars_fragment: simAlbedo samples `map`, which is only
    // declared by that chunk (declaration-before-use)
    .replace('#include <map_pars_fragment>', `#include <map_pars_fragment>\n${ALBEDO_GLSL}`)
    .replace('#include <map_fragment>', `
      diffuseColor.rgb = simAlbedo(vMapUv);
    `);
  knotShader = shader;
};

const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(1, 0.34, 400, 64, 2, 3), knotMat);
scene.add(knot);

/* ============================================================================
 *  INTERACTION — raycast the knot, convert hit UV → chemical seed
 * ========================================================================== */
const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();

function pointerToSeedUV(event){
  pointerNdc.set(
    (event.clientX / innerWidth) * 2 - 1,
    -(event.clientY / innerHeight) * 2 + 1,
  );
  raycaster.setFromCamera(pointerNdc, camera);
  const hit = raycaster.intersectObject(knot, false)[0];
  return hit && hit.uv ? hit.uv : null;
}

renderer.domElement.addEventListener('pointerdown', (event) => {
  const uv = pointerToSeedUV(event);
  if (uv) seedAt(uv.x, uv.y, 0.014);
});

/* ============================================================================
 *  UI WIRING
 * ========================================================================== */
const $ = (id) => document.getElementById(id);
const presetButtons = { mitosis: $('pMitosis'), coral: $('pCoral'), worms: $('pWorms') };

function bindSlider(id, key, fmt, onChange){
  const el = $(id), out = $(id + 'Val');
  el.addEventListener('input', () => {
    params[key] = parseFloat(el.value);
    out.textContent = fmt(params[key]);
    onChange?.();
  });
}

function setActivePreset(name){
  for (const [n, btn] of Object.entries(presetButtons))
    btn.classList.toggle('active', n === name);
}

bindSlider('feed', 'feed', (v) => v.toFixed(4),
  () => { stepMat.uniforms.uFeed.value = params.feed; setActivePreset(''); });
bindSlider('kill', 'kill', (v) => v.toFixed(4),
  () => { stepMat.uniforms.uKill.value = params.kill; setActivePreset(''); });
bindSlider('disp', 'displacement', (v) => v.toFixed(2),
  () => { if (knotShader) knotShader.uniforms.uDispScale.value = params.displacement; });
bindSlider('speed', 'spin', (v) => v.toFixed(2));

for (const [name, btn] of Object.entries(presetButtons)){
  btn.addEventListener('click', () => {
    params.feed = PRESETS[name].f;
    params.kill = PRESETS[name].k;
    $('feed').value = params.feed; $('feedVal').textContent = params.feed.toFixed(4);
    $('kill').value = params.kill; $('killVal').textContent = params.kill.toFixed(4);
    stepMat.uniforms.uFeed.value = params.feed;
    stepMat.uniforms.uKill.value = params.kill;
    setActivePreset(name);
    clearSimulation(true);
  });
}
$('reseed').addEventListener('click', () => {
  const a = Math.random() * Math.PI * 2;
  const b = Math.random() * Math.PI * 2;
  seedAt(0.5 + 0.22 * Math.cos(a), 0.5 + 0.22 * Math.sin(a));
  seedAt(0.5 + 0.22 * Math.cos(b), 0.5 + 0.22 * Math.sin(b));
});
$('reset').addEventListener('click', () => clearSimulation(false));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================================
 *  MAIN LOOP — seed queue → N Gray-Scott steps → texture refresh → render
 * ========================================================================== */
clearSimulation(true);

const fpsEl = $('fps');
let fpsFrames = 0, fpsLast = performance.now();
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  drainSeeds();

  stepMat.uniforms.uFeed.value = params.feed;
  stepMat.uniforms.uKill.value = params.kill;
  stepMat.uniforms.tState.value = rtRead.texture;
  for (let i = 0; i < STEPS_FRAME; i++){
    runPass(stepMat, rtWrite);
    swapTargets();
    stepMat.uniforms.tState.value = rtRead.texture;
  }

  copyMat.uniforms.tState.value = rtRead.texture;
  runPass(copyMat, rtDisplay);

  knot.rotation.y += dt * params.spin * 0.7;
  knot.rotation.x = Math.sin(performance.now() * 0.00021) * 0.35;
  controls.update();
  renderer.render(scene, camera);

  fpsFrames++;
  const now = performance.now();
  if (now - fpsLast >= 500){
    fpsEl.textContent = ((fpsFrames * 1000) / (now - fpsLast)).toFixed(0);
    fpsFrames = 0;
    fpsLast = now;
  }
}
animate();
</script>
</body>
</html>
