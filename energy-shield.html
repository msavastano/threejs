<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Energy Shield — Three.js</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #info {
    position: fixed; left: 12px; top: 12px;
    color: #9cf; font: 12px/1.4 monospace;
    text-shadow: 0 0 6px #06f; pointer-events: none;
    background: rgba(0,0,0,0.25); padding: 6px 8px; border-radius: 4px;
  }
</style>
</head>
<body>
<div id="info">Energy Shield — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

// ---------- Scene & Camera ----------
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.04);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.1, 200
);
camera.position.set(0, 0.6, 4.2);

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.2;
controls.maxDistance = 12.0;

// ---------- Subtle starfield for depth ----------
{
  const starCount = 1200;
  const positions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    // distribute on a large sphere
    const r = 60 + Math.random() * 40;
    const t = Math.random() * Math.PI * 2;
    const p = Math.acos(2 * Math.random() - 1);
    positions[i * 3 + 0] = r * Math.sin(p) * Math.cos(t);
    positions[i * 3 + 1] = r * Math.cos(p);
    positions[i * 3 + 2] = r * Math.sin(p) * Math.sin(t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const m = new THREE.PointsMaterial({
    color: 0x88aaff, size: 0.5, sizeAttenuation: true,
    transparent: true, opacity: 0.7, depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  scene.add(new THREE.Points(g, m));
}

// ---------- Shader ----------
const vertexShader = /* glsl */`
  varying vec3 vWorldNormal;
  varying vec3 vViewDir;
  varying vec3 vWorldPos;
  varying vec2 vUv;

  void main() {
    vUv = uv;

    // World-space normal and position for stable lighting regardless of mesh rotation
    vec4 worldPos = modelMatrix * vec4(position, 1.0);
    vWorldPos = worldPos.xyz;
    vWorldNormal = normalize(mat3(modelMatrix) * normal);

    // View direction in world space (camera -> fragment)
    vViewDir = normalize(cameraPosition - worldPos.xyz);

    gl_Position = projectionMatrix * viewMatrix * worldPos;
  }
`;

const fragmentShader = /* glsl */`
  precision highp float;

  uniform float uTime;
  uniform vec3  uColorCore;      // interior tint
  uniform vec3  uColorRim;       // rim glow color
  uniform float uFresnelPower;   // rim sharpness
  uniform float uFresnelBoost;   // rim intensity multiplier
  uniform float uNoiseScale;     // pattern scale
  uniform float uNoiseSpeed;     // pattern scroll speed
  uniform float uPulseSpeed;     // breathing rate
  uniform float uPulseAmount;    // breathing strength (0..1)
  uniform float uOpacity;        // base alpha

  varying vec3 vWorldNormal;
  varying vec3 vViewDir;
  varying vec3 vWorldPos;
  varying vec2 vUv;

  // ---- Hash / Value Noise (3D) ----
  // Compact, dependency-free value noise — fast enough for 60fps on a sphere.
  float hash(vec3 p) {
    p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }

  float vnoise(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    // Smoothstep interpolation
    vec3 u = f * f * (3.0 - 2.0 * f);

    float n000 = hash(i + vec3(0.0, 0.0, 0.0));
    float n100 = hash(i + vec3(1.0, 0.0, 0.0));
    float n010 = hash(i + vec3(0.0, 1.0, 0.0));
    float n110 = hash(i + vec3(1.0, 1.0, 0.0));
    float n001 = hash(i + vec3(0.0, 0.0, 1.0));
    float n101 = hash(i + vec3(1.0, 0.0, 1.0));
    float n011 = hash(i + vec3(0.0, 1.0, 1.0));
    float n111 = hash(i + vec3(1.0, 1.0, 1.0));

    float nx00 = mix(n000, n100, u.x);
    float nx10 = mix(n010, n110, u.x);
    float nx01 = mix(n001, n101, u.x);
    float nx11 = mix(n011, n111, u.x);

    float nxy0 = mix(nx00, nx10, u.y);
    float nxy1 = mix(nx01, nx11, u.y);

    return mix(nxy0, nxy1, u.z);
  }

  // Fractal Brownian Motion — layered noise for richer surface detail
  float fbm(vec3 p) {
    float v = 0.0;
    float a = 0.5;
    for (int i = 0; i < 5; i++) {
      v += a * vnoise(p);
      p *= 2.03;
      a *= 0.5;
    }
    return v;
  }

  void main() {
    vec3 N = normalize(vWorldNormal);
    vec3 V = normalize(vViewDir);

    // ---- Fresnel: bright at glancing angles ----
    // pow(1 - dot(N,V), k) gives a clean rim term that peaks at the silhouette.
    float ndv = clamp(dot(N, V), 0.0, 1.0);
    float fresnel = pow(1.0 - ndv, uFresnelPower);

    // ---- Animated procedural pattern ----
    // Sample noise in world space, scrolling along time so the pattern
    // flows across the surface rather than being locked to the mesh.
    vec3 noisePos = vWorldPos * uNoiseScale + vec3(0.0, 0.0, uTime * uNoiseSpeed);
    // Secondary layer scrolls in a different direction for interference
    vec3 noisePos2 = vWorldPos * (uNoiseScale * 1.7)
                   + vec3(uTime * uNoiseSpeed * 0.6, uTime * uNoiseSpeed * 0.4, 0.0);

    float n1 = fbm(noisePos);
    float n2 = fbm(noisePos2);
    float pattern = mix(n1, n2, 0.5);

    // Optional scanline overlay — bands moving in object UV space
    float scan = 0.5 + 0.5 * sin(vUv.y * 220.0 + uTime * 3.0);
    scan = smoothstep(0.55, 1.0, scan) * 0.35;

    // ---- Pulse: smooth breathing ----
    // 0.5 * (1 - cos) gives a clean 0..1 oscillation
    float pulse = 0.5 + 0.5 * sin(uTime * uPulseSpeed);
    float pulseMod = mix(1.0, 0.85 + 0.3 * pulse, uPulseAmount);

    // ---- Compose color ----
    // Pattern darkens "panels" inside the shield, fresnel brightens the rim.
    float interior = pattern * 0.6;
    vec3 col = mix(uColorCore, uColorRim, fresnel);
    col += uColorRim * (fresnel * uFresnelBoost);
    col += uColorRim * scan;
    col *= pulseMod;

    // Soft interior fill so the sphere reads as volumetric, not just a rim
    col += uColorCore * interior * 0.25;

    // ---- Alpha ----
    // Rim is most opaque at the silhouette, interior stays translucent.
    float alpha = uOpacity * (0.15 + 0.85 * fresnel);
    alpha += scan * 0.15;
    alpha *= mix(1.0, 0.9 + 0.2 * pulse, uPulseAmount);
    alpha = clamp(alpha, 0.0, 1.0);

    gl_FragColor = vec4(col, alpha);
  }
`;

// ---------- Shield mesh ----------
const SHIELD_RADIUS = 1.5;
const geometry = new THREE.SphereGeometry(SHIELD_RADIUS, 96, 64);

const uniforms = {
  uTime:         { value: 0.0 },
  uColorCore:    { value: new THREE.Color(0x2244ff) },   // electric blue core
  uColorRim:     { value: new THREE.Color(0x66ddff) },   // cyan rim
  uFresnelPower: { value: 2.5 },
  uFresnelBoost: { value: 1.6 },
  uNoiseScale:   { value: 2.2 },
  uNoiseSpeed:   { value: 0.35 },
  uPulseSpeed:   { value: 1.8 },
  uPulseAmount:  { value: 0.35 },
  uOpacity:      { value: 0.9 }
};

const shieldMaterial = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  transparent: true,
  depthWrite: false,        // do not occlude other transparent layers
  side: THREE.DoubleSide,   // visible from inside and outside
  blending: THREE.AdditiveBlending
});

const shield = new THREE.Mesh(geometry, shieldMaterial);
scene.add(shield);

// ---------- Inner core (visual anchor) ----------
{
  const coreGeo = new THREE.IcosahedronGeometry(SHIELD_RADIUS * 0.45, 2);
  const coreMat = new THREE.MeshBasicMaterial({
    color: 0x4488ff,
    transparent: true,
    opacity: 0.18,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const core = new THREE.Mesh(coreGeo, coreMat);
  scene.add(core);

  // Slow counter-rotation looks nice with the shield
  core.userData.spin = { x: 0.2, y: 0.35 };
  core.userData.isCore = true;
}

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Render loop ----------
const clock = new THREE.Clock();

function tick() {
  const t = clock.getElapsedTime();
  uniforms.uTime.value = t;

  // Subtle shield rotation so the noise reads as moving across a real surface
  shield.rotation.y = t * 0.05;
  shield.rotation.x = Math.sin(t * 0.07) * 0.15;

  // Counter-rotate the core for a layered look
  scene.traverse((obj) => {
    if (obj.userData && obj.userData.isCore) {
      obj.rotation.x += obj.userData.spin.x * 0.005;
      obj.rotation.y += obj.userData.spin.y * 0.005;
    }
  });

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

tick();
</script>
</body>
</html>
