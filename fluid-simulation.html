<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stable Fluid Simulation — WebGL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

  #panel {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    width: 258px;
    background: rgba(10, 14, 22, 0.82);
    border: 1px solid rgba(120, 160, 255, 0.18);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #cdd6e4;
    font-size: 12px;
    user-select: none;
  }
  #panel h1 {
    font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
    padding: 10px 12px; color: #8fb4ff; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  #panel h1 span.caret { transition: transform 0.2s; font-size: 10px; color: #5a6b8a; }
  #panel.collapsed span.caret { transform: rotate(-90deg); }
  #panel.collapsed #controls { display: none; }
  #controls { padding: 0 12px 12px; }

  .row { display: flex; align-items: center; justify-content: space-between; margin: 7px 0; gap: 8px; }
  .row label { flex: 0 0 auto; color: #9fb0c8; }
  .row output { flex: 0 0 34px; text-align: right; color: #e8eefc; font-variant-numeric: tabular-nums; }
  input[type=range] {
    flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
    background: #22304a; border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: #6fa0ff; cursor: pointer; border: none;
  }
  select {
    background: #131a29; color: #dfe7f5; border: 1px solid #2a3a58;
    border-radius: 5px; padding: 3px 6px; font-size: 12px; outline: none;
  }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  button {
    flex: 1 0 30%;
    background: #17233a; color: #c9d7f2; border: 1px solid #2c3f63;
    border-radius: 6px; padding: 5px 4px; font-size: 11.5px; cursor: pointer;
  }
  button:hover { background: #1e2f4f; }
  button.active { background: #2c4a85; border-color: #5d86d8; color: #fff; }
  .section {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid rgba(120, 160, 255, 0.12);
    font-size: 10.5px; letter-spacing: 0.1em; color: #5f7194; text-transform: uppercase;
  }
  .hint { margin-top: 9px; color: #55647f; font-size: 10.5px; line-height: 1.5; }
  .toggle { display: flex; align-items: center; gap: 6px; margin: 7px 0; color: #9fb0c8; cursor: pointer; }
  .toggle input { accent-color: #6fa0ff; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="panel">
  <h1 id="panelHead">STABLE FLUIDS · WEBGL <span class="caret">▼</span></h1>
  <div id="controls">
    <div class="section">Grid</div>
    <div class="row">
      <label>Sim resolution</label>
      <select id="simRes">
        <option value="64">64</option>
        <option value="128">128</option>
        <option value="256" selected>256</option>
        <option value="512">512</option>
      </select>
    </div>
    <div class="row">
      <label>Dye resolution</label>
      <select id="dyeRes">
        <option value="256">256</option>
        <option value="512">512</option>
        <option value="1024" selected>1024</option>
      </select>
    </div>
    <div class="row">
      <label>Pressure iters</label>
      <input type="range" id="pressureIters" min="10" max="80" step="1" value="30">
      <output id="pressureItersV">30</output>
    </div>

    <div class="section">Fluid</div>
    <div class="row">
      <label>Vorticity</label>
      <input type="range" id="curl" min="0" max="50" step="1" value="18">
      <output id="curlV">18</output>
    </div>
    <div class="row">
      <label>Dye fade</label>
      <input type="range" id="dyeDiss" min="0" max="4" step="0.05" value="0.6">
      <output id="dyeDissV">0.60</output>
    </div>
    <div class="row">
      <label>Vel. friction</label>
      <input type="range" id="velDiss" min="0" max="4" step="0.05" value="0.15">
      <output id="velDissV">0.15</output>
    </div>
    <div class="row">
      <label>Splat force</label>
      <input type="range" id="splatForce" min="1000" max="12000" step="100" value="5500">
      <output id="splatForceV">5500</output>
    </div>
    <div class="row">
      <label>Brush size</label>
      <input type="range" id="radius" min="0.05" max="1.5" step="0.05" value="0.35">
      <output id="radiusV">0.35</output>
    </div>

    <div class="section">Smoke</div>
    <label class="toggle"><input type="checkbox" id="smokeOn" checked> Smoke emitter (buoyant plume)</label>
    <div class="row">
      <label>Buoyancy</label>
      <input type="range" id="buoyancy" min="0" max="60" step="1" value="22">
      <output id="buoyancyV">22</output>
    </div>

    <div class="section">Mode</div>
    <div class="btns">
      <button id="modeFluid" class="active">💨 Fluid</button>
      <button id="modeDraw">🧱 Wall</button>
      <button id="modeErase">🩹 Erase</button>
    </div>
    <div class="btns">
      <button id="clearDye">Clear dye</button>
      <button id="clearObs">Clear walls</button>
      <button id="pauseBtn">Pause</button>
    </div>
    <div class="hint">
      Drag to stir dye · <b>W</b> hold to draw walls · <b>E</b> hold to erase ·
      right-drag also draws walls · <b>Space</b> pause
    </div>
  </div>
</div>

<script>
'use strict';

// ============================================================================
// GL bootstrap
// ============================================================================
const canvas = document.getElementById('canvas');

function getWebGLContext(canvas) {
  const params = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
  let gl = canvas.getContext('webgl2', params);
  const isWebGL2 = !!gl;
  if (!isWebGL2) gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
  if (!gl) throw new Error('WebGL not supported');

  let halfFloat, supportLinearFiltering;
  if (isWebGL2) {
    gl.getExtension('EXT_color_buffer_float');
    supportLinearFiltering = !!gl.getExtension('OES_texture_float_linear');
  } else {
    halfFloat = gl.getExtension('OES_texture_half_float');
    supportLinearFiltering = !!gl.getExtension('OES_texture_half_float_linear');
  }
  const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : halfFloat.HALF_FLOAT_OES;

  let formatRGBA, formatRG, formatR;
  if (isWebGL2) {
    formatRGBA = getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, halfFloatTexType);
    formatRG   = getSupportedFormat(gl, gl.RG16F,   gl.RG,   halfFloatTexType);
    formatR    = getSupportedFormat(gl, gl.R16F,    gl.RED,  halfFloatTexType);
  } else {
    formatRGBA = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
    formatRG   = formatRGBA;
    formatR    = formatRGBA;
  }
  return { gl, isWebGL2, halfFloatTexType, supportLinearFiltering, formatRGBA, formatRG, formatR };
}

function getSupportedFormat(gl, internalFormat, format, type) {
  if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
    switch (internalFormat) {
      case gl.R16F:  return getSupportedFormat(gl, gl.RG16F, gl.RG, type);
      case gl.RG16F: return getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, type);
      default: return null;
    }
  }
  return { internalFormat, format };
}

function supportRenderTextureFormat(gl, internalFormat, format, type) {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.deleteFramebuffer(fbo);
  gl.deleteTexture(texture);
  return ok;
}

const { gl, halfFloatTexType, supportLinearFiltering, formatRGBA, formatRG, formatR } = getWebGLContext(canvas);

// ============================================================================
// Config / state
// ============================================================================
const config = {
  SIM_RESOLUTION: 256,
  DYE_RESOLUTION: 1024,
  PRESSURE_ITERATIONS: 30,
  CURL: 18,
  DYE_DISSIPATION: 0.6,
  VELOCITY_DISSIPATION: 0.15,
  SPLAT_FORCE: 5500,
  SPLAT_RADIUS: 0.35,
  BUOYANCY: 22,
  AMBIENT: 0.0,
  SMOKE_EMITTER: true,
  PAUSED: false,
};

let mode = 'fluid'; // 'fluid' | 'draw' | 'erase'
let keyHeldMode = null;

const pointer = {
  down: false, drawing: false,
  x: 0.5, y: 0.5, dx: 0, dy: 0,
  color: [0.6, 0.2, 1.0],
  button: 0, moved: false,
};

// ============================================================================
// Shaders
// ============================================================================
function compileShader(type, source, keywords) {
  if (keywords) {
    let defs = '';
    for (const k of keywords) defs += `#define ${k}\n`;
    source = defs + source;
  }
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(shader) + '\n' + source);
  return shader;
}

function createProgram(vs, fs) {
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(program));
  const uniforms = {};
  const n = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(program, i).name;
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  return { program, uniforms, bind() { gl.useProgram(program); } };
}

const baseVertexShader = compileShader(gl.VERTEX_SHADER, `
  precision highp float;
  attribute vec2 aPosition;
  varying vec2 vUv;
  varying vec2 vL, vR, vT, vB;
  uniform vec2 texelSize;
  void main () {
    vUv = aPosition * 0.5 + 0.5;
    vL = vUv - vec2(texelSize.x, 0.0);
    vR = vUv + vec2(texelSize.x, 0.0);
    vT = vUv + vec2(0.0, texelSize.y);
    vB = vUv - vec2(0.0, texelSize.y);
    gl_Position = vec4(aPosition, 0.0, 1.0);
  }
`);

// Helper chunk: a cell is solid if it's a painted obstacle or outside the domain.
const SOLID_CHUNK = `
  uniform sampler2D uObstacles;
  float solidAt (vec2 uv) {
    if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return 1.0;
    return step(0.5, texture2D(uObstacles, uv).r);
  }
`;

const copyShader = compileShader(gl.FRAGMENT_SHADER, `
  precision mediump float;
  varying highp vec2 vUv;
  uniform sampler2D uTexture;
  void main () { gl_FragColor = texture2D(uTexture, vUv); }
`);

const clearShader = compileShader(gl.FRAGMENT_SHADER, `
  precision mediump float;
  varying highp vec2 vUv;
  uniform sampler2D uTexture;
  uniform float value;
  void main () { gl_FragColor = value * texture2D(uTexture, vUv); }
`);

const splatShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uTarget;
  ${SOLID_CHUNK}
  uniform float aspectRatio;
  uniform vec3 color;
  uniform vec2 point;
  uniform float radius;
  void main () {
    if (solidAt(vUv) > 0.5) { gl_FragColor = texture2D(uTarget, vUv); return; }
    vec2 p = vUv - point;
    p.x *= aspectRatio;
    vec3 splat = exp(-dot(p, p) / radius) * color;
    vec3 base = texture2D(uTarget, vUv).xyz;
    gl_FragColor = vec4(base + splat, 1.0);
  }
`);

// Paints (or erases) hard-edged circles into the obstacle mask.
const obstacleBrushShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uTarget;
  uniform float aspectRatio;
  uniform vec2 point;
  uniform float radius;
  uniform float value; // 1 = paint wall, 0 = erase
  void main () {
    vec2 p = vUv - point;
    p.x *= aspectRatio;
    float prev = texture2D(uTarget, vUv).r;
    float inside = step(dot(p, p), radius);
    float out_ = mix(prev, value, inside);
    gl_FragColor = vec4(out_, 0.0, 0.0, 1.0);
  }
`);

const advectionShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uVelocity;
  uniform sampler2D uSource;
  ${SOLID_CHUNK}
  uniform vec2 texelSize;
  uniform vec2 dyeTexelSize;
  uniform float dt;
  uniform float dissipation;

  vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
    vec2 st = uv / tsize - 0.5;
    vec2 iuv = floor(st);
    vec2 fuv = fract(st);
    vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
    vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
    vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
    vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
    return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
  }

  void main () {
    if (solidAt(vUv) > 0.5) { gl_FragColor = vec4(0.0); return; }
  #ifdef MANUAL_FILTERING
    vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
    vec4 result = bilerp(uSource, coord, dyeTexelSize);
  #else
    vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
    vec4 result = texture2D(uSource, coord);
  #endif
    // Don't pull dye out of walls
    if (solidAt(coord) > 0.5) result = vec4(0.0);
    float decay = 1.0 + dissipation * dt;
    gl_FragColor = result / decay;
  }
`, supportLinearFiltering ? null : ['MANUAL_FILTERING']);

const divergenceShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uVelocity;
  ${SOLID_CHUNK}
  void main () {
    if (solidAt(vUv) > 0.5) { gl_FragColor = vec4(0.0); return; }
    float L = solidAt(vL) > 0.5 ? 0.0 : texture2D(uVelocity, vL).x;
    float R = solidAt(vR) > 0.5 ? 0.0 : texture2D(uVelocity, vR).x;
    float T = solidAt(vT) > 0.5 ? 0.0 : texture2D(uVelocity, vT).y;
    float B = solidAt(vB) > 0.5 ? 0.0 : texture2D(uVelocity, vB).y;
    float div = 0.5 * (R - L + T - B);
    gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
  }
`);

const curlShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uVelocity, vL).y;
    float R = texture2D(uVelocity, vR).y;
    float T = texture2D(uVelocity, vT).x;
    float B = texture2D(uVelocity, vB).x;
    float vorticity = R - L - T + B;
    gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
  }
`);

const vorticityShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uVelocity;
  uniform sampler2D uCurl;
  ${SOLID_CHUNK}
  uniform float curl;
  uniform float dt;
  void main () {
    if (solidAt(vUv) > 0.5) { gl_FragColor = vec4(0.0); return; }
    float L = texture2D(uCurl, vL).x;
    float R = texture2D(uCurl, vR).x;
    float T = texture2D(uCurl, vT).x;
    float B = texture2D(uCurl, vB).x;
    float C = texture2D(uCurl, vUv).x;
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    force /= length(force) + 0.0001;
    force *= curl * C;
    force.y *= -1.0;
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    velocity += force * dt;
    velocity = clamp(velocity, -1000.0, 1000.0);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }
`);

// Buoyancy: hot cells rise, dense smoke sinks slightly (Fedkiw et al.)
const buoyancyShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uVelocity;
  uniform sampler2D uTemperature;
  uniform sampler2D uDensity;
  ${SOLID_CHUNK}
  uniform float dt;
  uniform float sigma;   // thermal lift
  uniform float kappa;   // smoke weight
  uniform float ambient;
  void main () {
    if (solidAt(vUv) > 0.5) { gl_FragColor = vec4(0.0); return; }
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    float t = texture2D(uTemperature, vUv).x;
    vec3 d = texture2D(uDensity, vUv).xyz;
    float density = (d.r + d.g + d.b) / 3.0;
    velocity.y += dt * (sigma * (t - ambient) - kappa * density);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }
`);

const pressureShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uPressure;
  uniform sampler2D uDivergence;
  ${SOLID_CHUNK}
  void main () {
    float C = texture2D(uPressure, vUv).x;
    float L = solidAt(vL) > 0.5 ? C : texture2D(uPressure, vL).x;
    float R = solidAt(vR) > 0.5 ? C : texture2D(uPressure, vR).x;
    float T = solidAt(vT) > 0.5 ? C : texture2D(uPressure, vT).x;
    float B = solidAt(vB) > 0.5 ? C : texture2D(uPressure, vB).x;
    float divergence = texture2D(uDivergence, vUv).x;
    float pressure = (L + R + B + T - divergence) * 0.25;
    gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
  }
`);

const gradientSubtractShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uPressure;
  uniform sampler2D uVelocity;
  ${SOLID_CHUNK}
  void main () {
    if (solidAt(vUv) > 0.5) { gl_FragColor = vec4(0.0); return; }
    float C = texture2D(uPressure, vUv).x;
    float sL = solidAt(vL), sR = solidAt(vR), sT = solidAt(vT), sB = solidAt(vB);
    float L = sL > 0.5 ? C : texture2D(uPressure, vL).x;
    float R = sR > 0.5 ? C : texture2D(uPressure, vR).x;
    float T = sT > 0.5 ? C : texture2D(uPressure, vT).x;
    float B = sB > 0.5 ? C : texture2D(uPressure, vB).x;
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    velocity -= 0.5 * vec2(R - L, T - B);
    // No-through condition: kill any component still pointing into a wall
    if (sL > 0.5 && velocity.x < 0.0) velocity.x = 0.0;
    if (sR > 0.5 && velocity.x > 0.0) velocity.x = 0.0;
    if (sB > 0.5 && velocity.y < 0.0) velocity.y = 0.0;
    if (sT > 0.5 && velocity.y > 0.0) velocity.y = 0.0;
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }
`);

const displayShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uDye;
  uniform sampler2D uObstacles;
  uniform vec2 texelSize;
  uniform vec2 obstacleTexel;
  void main () {
    vec3 c = texture2D(uDye, vUv).rgb;

    // Cheap normal-mapped shading from the dye gradient
    vec3 lc = texture2D(uDye, vL).rgb;
    vec3 rc = texture2D(uDye, vR).rgb;
    vec3 tc = texture2D(uDye, vT).rgb;
    vec3 bc = texture2D(uDye, vB).rgb;
    float dx = length(rc) - length(lc);
    float dy = length(tc) - length(bc);
    vec3 n = normalize(vec3(dx, dy, length(texelSize) * 60.0 + 0.15));
    float diffuse = clamp(dot(n, normalize(vec3(0.0, 0.0, 1.0))) + 0.7, 0.7, 1.0);
    c *= diffuse;

    // Obstacles: slate blocks with an edge glow
    float obs = step(0.5, texture2D(uObstacles, vUv).r);
    float oL = step(0.5, texture2D(uObstacles, vUv - vec2(obstacleTexel.x, 0.0)).r);
    float oR = step(0.5, texture2D(uObstacles, vUv + vec2(obstacleTexel.x, 0.0)).r);
    float oB = step(0.5, texture2D(uObstacles, vUv - vec2(0.0, obstacleTexel.y)).r);
    float oT = step(0.5, texture2D(uObstacles, vUv + vec2(0.0, obstacleTexel.y)).r);
    float edge = obs * (4.0 - oL - oR - oB - oT) * 0.25;
    vec3 wall = vec3(0.16, 0.19, 0.25) + edge * vec3(0.35, 0.5, 0.9);
    c = mix(c, wall, obs);

    float a = max(c.r, max(c.g, c.b));
    gl_FragColor = vec4(c, a);
  }
`);

// ============================================================================
// Framebuffers
// ============================================================================
const blit = (() => {
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 3, 3, -1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  return (target) => {
    if (target == null) {
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } else {
      gl.viewport(0, 0, target.width, target.height);
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
})();

function createFBO(w, h, internalFormat, format, type, filter) {
  const texture = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);

  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  return {
    texture, fbo, width: w, height: h,
    texelSizeX: 1 / w, texelSizeY: 1 / h,
    attach(id) {
      gl.activeTexture(gl.TEXTURE0 + id);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      return id;
    },
    dispose() { gl.deleteTexture(texture); gl.deleteFramebuffer(fbo); },
  };
}

function createDoubleFBO(w, h, internalFormat, format, type, filter) {
  let fbo1 = createFBO(w, h, internalFormat, format, type, filter);
  let fbo2 = createFBO(w, h, internalFormat, format, type, filter);
  return {
    width: w, height: h, texelSizeX: 1 / w, texelSizeY: 1 / h,
    get read() { return fbo1; },
    set read(v) { fbo1 = v; },
    get write() { return fbo2; },
    set write(v) { fbo2 = v; },
    swap() { const t = fbo1; fbo1 = fbo2; fbo2 = t; },
    dispose() { fbo1.dispose(); fbo2.dispose(); },
  };
}

const copyProgram      = createProgram(baseVertexShader, copyShader);
const clearProgram     = createProgram(baseVertexShader, clearShader);
const splatProgram     = createProgram(baseVertexShader, splatShader);
const obstacleProgram  = createProgram(baseVertexShader, obstacleBrushShader);
const advectionProgram = createProgram(baseVertexShader, advectionShader);
const divergenceProgram = createProgram(baseVertexShader, divergenceShader);
const curlProgram      = createProgram(baseVertexShader, curlShader);
const vorticityProgram = createProgram(baseVertexShader, vorticityShader);
const buoyancyProgram  = createProgram(baseVertexShader, buoyancyShader);
const pressureProgram  = createProgram(baseVertexShader, pressureShader);
const gradientProgram  = createProgram(baseVertexShader, gradientSubtractShader);
const displayProgram   = createProgram(baseVertexShader, displayShader);

let velocity, dye, temperature, pressure, divergence, curlFBO, obstacles;

function getResolution(resolution) {
  let aspect = gl.drawingBufferWidth / gl.drawingBufferHeight;
  if (aspect < 1) aspect = 1 / aspect;
  const max = Math.round(resolution * aspect);
  const min = Math.round(resolution);
  return gl.drawingBufferWidth > gl.drawingBufferHeight
    ? { width: max, height: min }
    : { width: min, height: max };
}

function resizeDoubleFBO(target, w, h, internalFormat, format, type, filter) {
  if (target.width === w && target.height === h) return target;
  const newFBO = createDoubleFBO(w, h, internalFormat, format, type, filter);
  copyProgram.bind();
  gl.uniform1i(copyProgram.uniforms.uTexture, target.read.attach(0));
  blit(newFBO.read);
  target.dispose();
  return newFBO;
}

function initFramebuffers() {
  const simRes = getResolution(config.SIM_RESOLUTION);
  const dyeRes = getResolution(config.DYE_RESOLUTION);
  const type = halfFloatTexType;
  const rgba = formatRGBA, rg = formatRG, r = formatR;
  const filtering = supportLinearFiltering ? gl.LINEAR : gl.NEAREST;

  gl.disable(gl.BLEND);

  if (!dye) dye = createDoubleFBO(dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, type, filtering);
  else dye = resizeDoubleFBO(dye, dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, type, filtering);

  if (!velocity) velocity = createDoubleFBO(simRes.width, simRes.height, rg.internalFormat, rg.format, type, filtering);
  else velocity = resizeDoubleFBO(velocity, simRes.width, simRes.height, rg.internalFormat, rg.format, type, filtering);

  if (!temperature) temperature = createDoubleFBO(simRes.width, simRes.height, r.internalFormat, r.format, type, filtering);
  else temperature = resizeDoubleFBO(temperature, simRes.width, simRes.height, r.internalFormat, r.format, type, filtering);

  if (!obstacles) {
    obstacles = createDoubleFBO(simRes.width, simRes.height, r.internalFormat, r.format, type, gl.NEAREST);
    seedDefaultObstacles();
  } else {
    obstacles = resizeDoubleFBO(obstacles, simRes.width, simRes.height, r.internalFormat, r.format, type, gl.NEAREST);
  }

  if (pressure) pressure.dispose();
  if (divergence) divergence.dispose();
  if (curlFBO) curlFBO.dispose();
  pressure = createDoubleFBO(simRes.width, simRes.height, r.internalFormat, r.format, type, gl.NEAREST);
  divergence = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, type, gl.NEAREST);
  curlFBO = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, type, gl.NEAREST);
}

function paintObstacle(x, y, radiusWorld, value) {
  obstacleProgram.bind();
  gl.uniform1i(obstacleProgram.uniforms.uTarget, obstacles.read.attach(0));
  gl.uniform1f(obstacleProgram.uniforms.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(obstacleProgram.uniforms.point, x, y);
  gl.uniform1f(obstacleProgram.uniforms.radius, radiusWorld * radiusWorld);
  gl.uniform1f(obstacleProgram.uniforms.value, value);
  blit(obstacles.write);
  obstacles.swap();
}

function seedDefaultObstacles() {
  // A pillar and two angled slabs for the smoke plume to curl around
  paintObstacle(0.5, 0.55, 0.055, 1);
  for (let i = 0; i <= 14; i++) {
    const t = i / 14;
    paintObstacle(0.22 + t * 0.14, 0.32 + t * 0.10, 0.016, 1);
    paintObstacle(0.78 - t * 0.14, 0.32 + t * 0.10, 0.016, 1);
  }
}

function clearObstacles() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, obstacles.read.fbo);
  gl.viewport(0, 0, obstacles.width, obstacles.height);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
}

function clearDye() {
  for (const t of [dye, temperature]) {
    for (const f of [t.read, t.write]) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, f.fbo);
      gl.viewport(0, 0, f.width, f.height);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }
  }
}

// ============================================================================
// Simulation step
// ============================================================================
function step(dt) {
  gl.disable(gl.BLEND);

  // Vorticity confinement
  curlProgram.bind();
  gl.uniform2f(curlProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
  blit(curlFBO);

  vorticityProgram.bind();
  gl.uniform2f(vorticityProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(vorticityProgram.uniforms.uCurl, curlFBO.attach(1));
  gl.uniform1i(vorticityProgram.uniforms.uObstacles, obstacles.read.attach(2));
  gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
  gl.uniform1f(vorticityProgram.uniforms.dt, dt);
  blit(velocity.write);
  velocity.swap();

  // Buoyancy from the temperature field
  buoyancyProgram.bind();
  gl.uniform2f(buoyancyProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(buoyancyProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(buoyancyProgram.uniforms.uTemperature, temperature.read.attach(1));
  gl.uniform1i(buoyancyProgram.uniforms.uDensity, dye.read.attach(2));
  gl.uniform1i(buoyancyProgram.uniforms.uObstacles, obstacles.read.attach(3));
  gl.uniform1f(buoyancyProgram.uniforms.dt, dt);
  gl.uniform1f(buoyancyProgram.uniforms.sigma, config.BUOYANCY);
  gl.uniform1f(buoyancyProgram.uniforms.kappa, config.BUOYANCY * 0.08);
  gl.uniform1f(buoyancyProgram.uniforms.ambient, config.AMBIENT);
  blit(velocity.write);
  velocity.swap();

  // Divergence
  divergenceProgram.bind();
  gl.uniform2f(divergenceProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(divergenceProgram.uniforms.uObstacles, obstacles.read.attach(1));
  blit(divergence);

  // Pressure solve (Jacobi)
  clearProgram.bind();
  gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
  gl.uniform1f(clearProgram.uniforms.value, 0.8);
  blit(pressure.write);
  pressure.swap();

  pressureProgram.bind();
  gl.uniform2f(pressureProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
  gl.uniform1i(pressureProgram.uniforms.uObstacles, obstacles.read.attach(1));
  for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
    gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(2));
    blit(pressure.write);
    pressure.swap();
  }

  // Subtract pressure gradient
  gradientProgram.bind();
  gl.uniform2f(gradientProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(gradientProgram.uniforms.uPressure, pressure.read.attach(0));
  gl.uniform1i(gradientProgram.uniforms.uVelocity, velocity.read.attach(1));
  gl.uniform1i(gradientProgram.uniforms.uObstacles, obstacles.read.attach(2));
  blit(velocity.write);
  velocity.swap();

  // Advect velocity (self-advection)
  advectionProgram.bind();
  gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  if (!supportLinearFiltering)
    gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(advectionProgram.uniforms.uSource, velocity.read.attach(0));
  gl.uniform1i(advectionProgram.uniforms.uObstacles, obstacles.read.attach(1));
  gl.uniform1f(advectionProgram.uniforms.dt, dt);
  gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
  blit(velocity.write);
  velocity.swap();

  // Advect temperature
  if (!supportLinearFiltering)
    gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, temperature.texelSizeX, temperature.texelSizeY);
  gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(advectionProgram.uniforms.uSource, temperature.read.attach(2));
  gl.uniform1f(advectionProgram.uniforms.dissipation, 0.9);
  blit(temperature.write);
  temperature.swap();

  // Advect dye
  if (!supportLinearFiltering)
    gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(advectionProgram.uniforms.uSource, dye.read.attach(2));
  gl.uniform1f(advectionProgram.uniforms.dissipation, config.DYE_DISSIPATION);
  blit(dye.write);
  dye.swap();
}

// ============================================================================
// Splats
// ============================================================================
function splat(x, y, dx, dy, color, heat) {
  const radius = config.SPLAT_RADIUS / 100;

  splatProgram.bind();
  gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(splatProgram.uniforms.point, x, y);
  gl.uniform1f(splatProgram.uniforms.radius, correctRadius(radius));
  gl.uniform1i(splatProgram.uniforms.uObstacles, obstacles.read.attach(1));

  gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
  gl.uniform3f(splatProgram.uniforms.color, dx, dy, 0);
  blit(velocity.write);
  velocity.swap();

  gl.uniform1i(splatProgram.uniforms.uTarget, dye.read.attach(0));
  gl.uniform3f(splatProgram.uniforms.color, color[0], color[1], color[2]);
  blit(dye.write);
  dye.swap();

  if (heat > 0) {
    gl.uniform1i(splatProgram.uniforms.uTarget, temperature.read.attach(0));
    gl.uniform3f(splatProgram.uniforms.color, heat, 0, 0);
    blit(temperature.write);
    temperature.swap();
  }
}

function correctRadius(radius) {
  const aspect = canvas.width / canvas.height;
  return aspect > 1 ? radius * aspect : radius;
}

function HSVtoRGB(h, s, v) {
  const i = Math.floor(h * 6);
  const f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  switch (i % 6) {
    case 0: return [v, t, p];
    case 1: return [q, v, p];
    case 2: return [p, v, t];
    case 3: return [p, q, v];
    case 4: return [t, p, v];
    default: return [v, p, q];
  }
}

let hue = Math.random();
function nextColor() {
  hue = (hue + 0.13) % 1;
  const c = HSVtoRGB(hue, 1.0, 1.0);
  return [c[0] * 0.22, c[1] * 0.22, c[2] * 0.22];
}

// ============================================================================
// Smoke emitter
// ============================================================================
let emitterHue = 0;
function emitSmoke(time) {
  const wobble = Math.sin(time * 1.7) * 0.02 + Math.sin(time * 0.53) * 0.03;
  const x = 0.5 + wobble;
  const y = 0.045;
  emitterHue = (emitterHue + 0.0007) % 1;
  const tint = HSVtoRGB(emitterHue, 0.25, 1.0);
  const s = 0.055; // smoke is desaturated gray with a slow-drifting tint
  splat(x, y, wobble * 220, 55, [tint[0] * s, tint[1] * s, tint[2] * s], 0.32);
}

// ============================================================================
// Render
// ============================================================================
function render() {
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
  gl.clearColor(0.02, 0.024, 0.04, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  displayProgram.bind();
  gl.uniform2f(displayProgram.uniforms.texelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(displayProgram.uniforms.uDye, dye.read.attach(0));
  gl.uniform1i(displayProgram.uniforms.uObstacles, obstacles.read.attach(1));
  gl.uniform2f(displayProgram.uniforms.obstacleTexel, obstacles.texelSizeX, obstacles.texelSizeY);
  blit(null);
}

// ============================================================================
// Main loop
// ============================================================================
function resizeCanvas() {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(canvas.clientWidth * pixelRatio);
  const h = Math.floor(canvas.clientHeight * pixelRatio);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    return true;
  }
  return false;
}

resizeCanvas();
initFramebuffers();

let lastTime = performance.now();
function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 1 / 30);
  lastTime = now;

  if (resizeCanvas()) initFramebuffers();

  const activeMode = keyHeldMode || mode;

  if (pointer.down && pointer.moved) {
    pointer.moved = false;
    if (activeMode === 'fluid' && pointer.button === 0) {
      const dx = pointer.dx * config.SPLAT_FORCE;
      const dy = pointer.dy * config.SPLAT_FORCE;
      splat(pointer.x, pointer.y, dx, dy, pointer.color, 0.06);
    }
  }
  if (pointer.down && (activeMode !== 'fluid' || pointer.button === 2)) {
    const paint = (activeMode === 'erase') ? 0 : 1;
    paintObstacle(pointer.x, pointer.y, config.SPLAT_RADIUS * 0.05, paint);
  }

  if (!config.PAUSED) {
    if (config.SMOKE_EMITTER) emitSmoke(now / 1000);
    step(dt);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ============================================================================
// Input
// ============================================================================
function updatePointer(e) {
  const rect = canvas.getBoundingClientRect();
  const nx = (e.clientX - rect.left) / rect.width;
  const ny = 1 - (e.clientY - rect.top) / rect.height;
  pointer.dx = nx - pointer.x;
  pointer.dy = ny - pointer.y;
  pointer.x = nx;
  pointer.y = ny;
  pointer.moved = Math.abs(pointer.dx) > 0 || Math.abs(pointer.dy) > 0;
}

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  const rect = canvas.getBoundingClientRect();
  pointer.x = (e.clientX - rect.left) / rect.width;
  pointer.y = 1 - (e.clientY - rect.top) / rect.height;
  pointer.dx = 0; pointer.dy = 0;
  pointer.down = true;
  pointer.button = e.button;
  pointer.color = nextColor();
  // A tap with no motion still makes a puff
  const activeMode = keyHeldMode || mode;
  if (activeMode === 'fluid' && e.button === 0) {
    splat(pointer.x, pointer.y, 0, 0, pointer.color, 0.06);
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!pointer.down) return;
  updatePointer(e);
});

window.addEventListener('pointerup', () => { pointer.down = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyW') keyHeldMode = 'draw';
  if (e.code === 'KeyE') keyHeldMode = 'erase';
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'KeyW' && keyHeldMode === 'draw') keyHeldMode = null;
  if (e.code === 'KeyE' && keyHeldMode === 'erase') keyHeldMode = null;
});

// ============================================================================
// UI wiring
// ============================================================================
const $ = (id) => document.getElementById(id);

function bindSlider(id, key, fmt) {
  const el = $(id), out = $(id + 'V');
  el.addEventListener('input', () => {
    config[key] = parseFloat(el.value);
    out.textContent = fmt ? fmt(config[key]) : config[key];
  });
}
bindSlider('pressureIters', 'PRESSURE_ITERATIONS');
bindSlider('curl', 'CURL');
bindSlider('dyeDiss', 'DYE_DISSIPATION', v => v.toFixed(2));
bindSlider('velDiss', 'VELOCITY_DISSIPATION', v => v.toFixed(2));
bindSlider('splatForce', 'SPLAT_FORCE');
bindSlider('radius', 'SPLAT_RADIUS', v => v.toFixed(2));
bindSlider('buoyancy', 'BUOYANCY');

$('simRes').addEventListener('change', (e) => {
  config.SIM_RESOLUTION = parseInt(e.target.value);
  initFramebuffers();
});
$('dyeRes').addEventListener('change', (e) => {
  config.DYE_RESOLUTION = parseInt(e.target.value);
  initFramebuffers();
});
$('smokeOn').addEventListener('change', (e) => { config.SMOKE_EMITTER = e.target.checked; });

function setMode(m) {
  mode = m;
  $('modeFluid').classList.toggle('active', m === 'fluid');
  $('modeDraw').classList.toggle('active', m === 'draw');
  $('modeErase').classList.toggle('active', m === 'erase');
}
$('modeFluid').addEventListener('click', () => setMode('fluid'));
$('modeDraw').addEventListener('click', () => setMode('draw'));
$('modeErase').addEventListener('click', () => setMode('erase'));

$('clearDye').addEventListener('click', clearDye);
$('clearObs').addEventListener('click', clearObstacles);

function togglePause() {
  config.PAUSED = !config.PAUSED;
  $('pauseBtn').textContent = config.PAUSED ? 'Resume' : 'Pause';
  $('pauseBtn').classList.toggle('active', config.PAUSED);
}
$('pauseBtn').addEventListener('click', togglePause);

$('panelHead').addEventListener('click', () => {
  $('panel').classList.toggle('collapsed');
});
</script>
</body>
