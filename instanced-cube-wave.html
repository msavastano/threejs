<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instanced Cube Wave — 50,000 Cubes</title>
<style>
  :root {
    --accent-cyan: #00f0ff;
    --accent-amber: #ffb347;
    --bg-dark: #030409;
    --bg-card: rgba(10, 14, 26, 0.55);
    --border-color: rgba(120, 160, 255, 0.16);
    --text-primary: #dfe8ff;
    --text-secondary: rgba(170, 185, 220, 0.68);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg-dark);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
  }
  #app { position: fixed; inset: 0; z-index: 1; }
  canvas { display: block; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0) 35%, rgba(2,3,10,0.45) 75%, rgba(1,1,6,0.92) 100%);
    mix-blend-mode: multiply;
  }
  .panel {
    background: var(--bg-card);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  #hud {
    position: fixed; top: 18px; left: 18px; z-index: 20;
    padding: 13px 17px; min-width: 240px;
    font-size: 12px; line-height: 1.85; color: var(--text-secondary);
  }
  #hud h1 {
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent-cyan); font-weight: 600; margin-bottom: 7px;
  }
  .hud-row { display: flex; justify-content: space-between; gap: 18px; }
  .hud-row span:last-child { color: var(--text-primary); font-variant-numeric: tabular-nums; }
  #hud .dim { opacity: .8; }
  #legend {
    position: fixed; top: 18px; right: 18px; z-index: 20;
    padding: 12px 15px; font-size: 11.5px; line-height: 2;
    color: var(--text-secondary);
  }
  .toggle {
    display: flex; align-items: center; gap: 9px; cursor: pointer;
    transition: color .15s ease; user-select: none;
  }
  .toggle:hover { color: var(--text-primary); }
  .toggle input { accent-color: #00c8d8; cursor: pointer; }
  .swatch { width: 18px; height: 2px; border-radius: 1px; flex-shrink: 0; }
  #legend .hint { margin-top: 4px; opacity: .65; font-size: 10.5px; }
  @media (max-width: 700px) {
    #hud { display: none; }
    #legend { top: 12px; right: 12px; padding: 8px 10px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<div id="hud" class="panel">
  <h1>Instanced Cube Wave</h1>
  <div class="hud-row"><span class="dim">Instances</span><span id="h-count">—</span></div>
  <div class="hud-row"><span class="dim">Draw calls</span><span id="h-draw">—</span></div>
  <div class="hud-row"><span class="dim">FPS (target 60)</span><span id="h-fps">—</span></div>
  <div class="hud-row"><span class="dim">Triangles</span><span id="h-tris">—</span></div>
</div>
<div id="legend" class="panel">
  <label class="toggle"><input type="checkbox" id="tg-color" checked> Dynamic vertex color</label>
  <label class="toggle"><input type="checkbox" id="tg-tilt" checked> Slope tilt</label>
  <label class="toggle"><input type="checkbox" id="tg-help"> Help</label>
  <div class="hint">Drag to orbit · scroll to zoom</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   1. CONFIG & CONSTANTS
   ============================================================ */
const COUNT = 50000;           // 50 × 40 × 25 = 50,000 instances
const COLS_X = 50, COLS_Y = 40, COLS_Z = 25;
const SPACING = 4;
const HALF_X = (COLS_X * SPACING) / 2;
const HALF_Y = (COLS_Y * SPACING) / 2;
const HALF_Z = (COLS_Z * SPACING) / 2;

// Wave parameters (tweaked for a smooth propagating sine wave)
const WAVE = {
  amp:   14,    // vertical displacement amplitude
  speed: 2.2,   // time multiplier (propagation speed)
  fX:    0.22,  // spatial frequency along X
  fZ:    0.32,  // spatial frequency along Z
  tilt:  0.45,  // rotation factor tied to slope
};

/* ============================================================
   2. SCENE / CAMERA / RENDERER
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020308);
scene.fog = new THREE.FogExp2(0x020308, 0.00045);

const camera = new THREE.PerspectiveCamera(
  55, innerWidth / innerHeight, 0.1, 4000
);
camera.position.set(160, 130, 230);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.info.enabled = true;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);
controls.minDistance = 80;
controls.maxDistance = 1400;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   3. LIGHTING
   ============================================================ */
const dirLight = new THREE.DirectionalLight(0xffffff, 2.4);
dirLight.position.set(140, 260, 160);
scene.add(dirLight);
scene.add(new THREE.AmbientLight(0x4a5a78, 0.35));

/* ============================================================
   4. INSTANCED MESH + PER-INSTANCE DATA
   ============================================================ */
const geometry = new THREE.BoxGeometry(1, 1, 1);
const material = new THREE.MeshStandardMaterial({
  metalness: 0.18,
  roughness: 0.55,
  vertexColors: true,          // read the per-instance color attribute
  flatShading: false,
});

const mesh = new THREE.InstancedMesh(geometry, material, COUNT);
// Streamed every frame -> hint the GPU for frequent uploads
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

// Per-instance static base positions (Float32 typed arrays = cache friendly)
const baseX = new Float32Array(COUNT);
const baseY = new Float32Array(COUNT);
const baseZ = new Float32Array(COUNT);
const baseHue = new Float32Array(COUNT); // base color hue per instance

// Reusable scratch objects — NO allocation happens inside the animation loop:
// each is created once here and mutated in place every frame.
const dummy = new THREE.Object3D();      // holds position/rotation/scale -> matrix
const waveColor = new THREE.Color();     // reused for setColorAt() writes

// Explicit instanceColor attribute so setColorAt writes into a valid buffer
// and we can flag needsUpdate correctly.
const colorAttr = new THREE.InstancedBufferAttribute(new Float32Array(COUNT * 3), 3);
mesh.instanceColor = colorAttr;

let i = 0;
for (let ix = 0; ix < COLS_X; ix++) {
  for (let iy = 0; iy < COLS_Y; iy++) {
    for (let iz = 0; iz < COLS_Z; iz++) {
      baseX[i] = ix * SPACING - HALF_X + SPACING / 2;
      baseY[i] = iy * SPACING - HALF_Y + SPACING / 2;
      baseZ[i] = iz * SPACING - HALF_Z + SPACING / 2;
      // Gradient hue: deep blue -> cyan -> magenta across the Y axis
      baseHue[i] = 0.58 + (iy / (COLS_Y - 1)) * 0.28;

      // Initial static transform (flat grid, identity rotation)
      dummy.position.set(baseX[i], baseY[i], baseZ[i]);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(0.92, 0.92, 0.92);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);

      // Initial gradient color
      waveColor.setHSL(baseHue[i], 0.88, 0.48).convertSRGBToLinear();
      mesh.setColorAt(i, waveColor);
      i++;
    }
  }
}
// First upload of static buffers
mesh.instanceMatrix.needsUpdate = true;
mesh.instanceColor.needsUpdate = true;
scene.add(mesh);

/* ============================================================
   5. HUD helpers
   ============================================================ */
const $ = (id) => document.getElementById(id);
$('h-count').textContent = COUNT.toLocaleString();

let fpsEl = $('h-fps'), drawEl = $('h-draw'), trisEl = $('h-tris');
let frames = 0, lastFps = performance.now(), fps = 0;

function setVisible(id, on) {
  const el = document.getElementById(id);
  if (el) el.style.display = on ? '' : 'none';
}

/* ============================================================
   6. ANIMATION LOOP
   ============================================================ */
function animate(now = 0) {
  requestAnimationFrame(animate);
  const time = performance.now() * 0.001;

  // --- FPS counter ---
  frames++;
  if (now - lastFps >= 250) {
    fps = (frames * 1000) / (now - lastFps);
    frames = 0;
    lastFps = now;
    fpsEl.textContent = fps.toFixed(1);
    drawEl.textContent = renderer.info.render.calls.toLocaleString();
    trisEl.textContent = renderer.info.render.triangles.toLocaleString();
  }

  const doColor = document.getElementById('tg-color').checked;
  const doTilt = document.getElementById('tg-tilt').checked;

  // --- Per-instance update: NO new Matrix4 / Vector3 allocated here.
  // dummy & waveColor were created once outside and are mutated in place.
  const m = WAVE;
  for (let k = 0; k < COUNT; k++) {
    const bx = baseX[k], bz = baseZ[k];
    const phase = time * m.speed + bx * m.fX + bz * m.fZ;
    const s = Math.sin(phase);
    const c = Math.cos(phase);

    // Y position propagates a sine wave through the volume
    dummy.position.x = bx;
    dummy.position.y = baseY[k] + s * m.amp;
    dummy.position.z = bz;

    // Rotation follows the wave slope (tilt in the propagation direction)
    if (doTilt) {
      dummy.rotation.x =  c * m.fZ * m.tilt;
      dummy.rotation.z = -c * m.fX * m.tilt;
    } else {
      dummy.rotation.x = 0;
      dummy.rotation.z = 0;
    }

    dummy.updateMatrix();                 // writes into dummy.matrix (reused)
    mesh.setMatrixAt(k, dummy.matrix);    // copies 16 floats, no allocation

    if (doColor) {
      // Dynamic gradient: hue shifts with the wave, luminance pulses with height
      waveColor.setHSL(
        baseHue[k] + s * 0.05,
        0.88,
        0.42 + s * 0.22
      ).convertSRGBToLinear();
      mesh.setColorAt(k, waveColor);      // writes 3 floats into the attribute
    }
  }

  mesh.instanceMatrix.needsUpdate = true;  // re-upload transform buffer
  if (doColor) {
    mesh.instanceColor.needsUpdate = true; // re-upload color buffer
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

/* ============================================================
   7. Legend / help toggle
   ============================================================ */
const helpBox = document.createElement('div');
helpBox.className = 'panel';
helpBox.id = 'help';
Object.assign(helpBox.style, {
  position: 'fixed', bottom: '18px', left: '50%', transform: 'translateX(-50%)',
  padding: '12px 18px', fontSize: '11.5px', lineHeight: 1.6,
  maxWidth: '420px', textAlign: 'center', display: 'none',
});
helpBox.innerHTML = `
  <b>Instanced Cube Wave</b><br>
  50,000 cubes rendered as a <i>single InstancedMesh</i> (one draw call).
  The wave is a propagating sine in Y driven in the loop with no per-frame
  Matrix4 / Vector3 allocations. Colors are a per-instance gradient updated
  via <code>setColorAt</code> with <code>instanceColor.needsUpdate</code>.
`;
document.body.appendChild(helpBox);
document.getElementById('tg-help').addEventListener('change', (e) => {
  helpBox.style.display = e.target.checked ? '' : 'none';
});
</script>
</body>
</html>
